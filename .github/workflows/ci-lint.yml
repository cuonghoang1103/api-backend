name: CI - Lint & Type Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'eval/**'
      - 'prisma/**'
      - 'scripts/test-work-db.mjs'
      - 'scripts/db-test-tu-migration.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/package.json'
      - 'tsconfig.json'
      - 'frontend/tsconfig.json'
      - '.eslintrc.json'
      - '.prettierrc'
  workflow_dispatch: {}   # cho phép bấm chạy tay (Actions → Run workflow) — không cần push

jobs:
  backend-lint:
    name: Backend Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 matches the production runtime (node:22-alpine) and is required
          # by the CV PDF round-trip test in `npm test` (unpdf needs
          # Promise.withResolvers, a Node 22 feature).
          node-version: '22'
          cache: 'npm'
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: TypeScript type-check (required)
        run: npx tsc --noEmit
      - name: Interview grader eval — golden set (required)
        # STATIC eval: pure, no DB, no LLM key. Fails the build if the grader
        # stops ranking answers correctly (a prompt/scoring regression). The AI
        # eval (npm run eval:grader:ai) needs a key and is run manually.
        run: npm run eval:grader
      - name: CV linter eval — golden set (required)
        # STATIC eval: pure, no DB, no LLM key. Fails the build if the CV bullet
        # linter regresses — especially if it starts marking STRONG bullets WEAK
        # (the fatal false-positive the harness gates on).
        run: npm run eval:cv-linter
      - name: CV critique fabrication test (skips without an AI key)
        # Feeds the reviewer a metric-less CV and fails if it invents a number.
        # Becomes a REAL gate once the repo secrets below are added (Settings →
        # Secrets → Actions): ANTHROPIC_API_KEY, LLM_BASE_URL, LLM_MODEL_REPORT.
        # Without them the env is empty and the test SKIPS (exit 0).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL_REPORT: ${{ secrets.LLM_MODEL_REPORT }}
        run: npm run eval:cv-fabrication
      - name: Unit tests — money math + payment signature (required)
        # Đợt 8c: auth.mfa.test ký JWT ⇒ cần JWT_SECRET (máy có .env nên xanh, CI thì đỏ từ 10/10).
        env:
          JWT_SECRET: ci-unit-test-secret-not-for-production-0123456789
        run: npm test
      - name: ESLint (informational)
        continue-on-error: true
        run: npm run lint 2>&1 | tail -30 || echo "(lint warnings — pre-existing)"

  work-db-tests:
    # Đợt 6a (D1): test DB của CT Work CHẠY THẬT (trước đây mọi tệp *.db.test.ts tự SKIP vì CI không
    # đặt WORK_DB_TEST=1). Postgres dựng tạm trong job — không bao giờ chạm CSDL production.
    # Ảnh pgvector/pgvector:pg16: migration cần `vector` + `pg_trgm` (có sẵn trong contrib), không cần PostGIS.
    name: CT Work DB tests (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ctwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ctwork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ctwork_test?schema=public
      JWT_SECRET: ci-work-db-test-secret-not-for-production-0123456789
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      # Đợt 8c: KHÔNG tắt WORK_EMAIL_NOTIFICATIONS — portal/s3b/s5a/planning kiểm email đi (hộp thư giả của test).
      LLM_BACKGROUND_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        run: npx prisma generate
      # Đợt 8c: KHÔNG `prisma migrate deploy` — lịch sử migration không phát lại được trên CSDL trống (P3018 ở
      # 20260706130000_add_music_and_profile + vài bảng từng tạo ngoài migration) nên bước này đỏ từ đợt 6a.
      # Script phát lại từng migration bằng psql rồi lấp phần THIẾU bằng `prisma migrate diff` (xem đầu tệp).
      - name: Build test DB from migrations (scripts/db-test-tu-migration.mjs)
        run: node scripts/db-test-tu-migration.mjs
      - name: CT Work DB tests (WORK_DB_TEST=1, tuần tự từng tệp)
        run: npm run test:work-db

  frontend-lint:
    name: Frontend Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: TypeScript type-check (required)
        run: npx tsc --noEmit --skipLibCheck
      - name: Next.js ESLint (informational)
        continue-on-error: true
        run: npx next lint --dir src 2>&1 | tail -30 || echo "(next lint not configured — skipping)"
