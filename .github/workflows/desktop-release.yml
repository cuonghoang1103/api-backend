# Dựng ứng dụng desktop cho cả ba nền tảng và đẩy lên GitHub Releases.
#
# ⚠️ CHỈ CHẠY BẰNG TAY (`workflow_dispatch`). KHÔNG thêm trigger `push:`.
#    Dự án này đã có hai lần sự cố thật vì nhiều workflow cùng chạy trên mỗi
#    push và giẫm chân nhau (03/07 và 06/07/2026 — xem CLAUDE.md). Workflow này
#    không đụng tới VPS nên không đua với deploy, nhưng quy tắc "không tự chạy
#    theo push" vẫn giữ cho nhất quán.
#
# Cách chạy: tab Actions → "Desktop — dựng bản cài 3 nền tảng" → Run workflow.
#
# Cần MỘT secret: `RELEASE_TOKEN` (xem docs/building-and-packaging.md).
# KHÔNG đụng tới VPS_HOST / VPS_USER / VPS_SSH_PRIVATE_KEY — 10 workflow khác
# đang dùng chúng.

name: Desktop — dựng bản cài 3 nền tảng

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (để trống = dùng version trong desktop/package.json)'
        required: false
        type: string

# Không cho hai lần chạy chồng nhau: cả hai sẽ cùng tải file lên một release và
# ghi đè lẫn nhau.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # ── Kiểm trước khi dựng ────────────────────────────────────
  # Chạy RIÊNG và chạy TRƯỚC. Dựng ba nền tảng mất ~15 phút và tốn phút Actions;
  # để một lỗi TypeScript làm hỏng cả ba job là lãng phí thấy rõ.
  kiem-tra:
    name: Kiểm tra mã
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - run: npm ci
        working-directory: desktop

      # ⚠️ PHẢI cài cả deps của FRONTEND.
      #
      # App desktop dùng lại nguyên các component Notes của web qua alias
      # `@` → `../frontend/src` (xem `desktop/vite.config.ts`). Nên cây module
      # của renderer chạm THẬT vào `frontend/node_modules`, và thiếu nó thì cả
      # typecheck lẫn vitest lẫn `vite build` đều hỏng ở bước phân giải import.
      #
      # Hỏng đúng như vậy 17/08/2026: `routes.test.ts` (chỉ dùng `fs.existsSync`)
      # vẫn đỏ, vì nó import `./routes` → `page-registry` → `NotesPage` →
      # `@/app/notes/page` → `@dnd-kit/core`. Thông báo lỗi trỏ vào một file
      # frontend mà job này tưởng như không liên quan gì.
      - run: npm ci
        working-directory: frontend

      - name: Kiểm kiểu
        run: npm run typecheck
        working-directory: desktop

      - name: Unit test
        run: npx vitest run
        working-directory: desktop

  # ── Tạo SẴN bản nháp ───────────────────────────────────────
  #
  # ⚠️ ĐÂY LÀ CHỐT CHỐNG ĐUA. Không có job này thì ba nhánh dựng chạy song song
  # và mỗi nhánh tự tạo bản phát hành cho CÙNG một thẻ — GitHub cho phép nhiều
  # bản NHÁP trùng tên thẻ, nên tệp mac nằm ở một bản, tệp Linux ở bản khác, và
  # `gh release view v<x>` chỉ thấy một trong số đó.
  #
  # Đã xảy ra thật với 0.5.4: cả ba job đều XANH, log macOS ghi rõ
  # `creating GitHub release reason=release doesn't exist tag=v0.5.4`, và bước
  # công bố báo "THIẾU latest.yml". Bản 0.5.3 thoát chỉ vì may về thứ tự.
  #
  # Có bản nháp sẵn thì electron-builder tìm thấy và tải VÀO ĐÓ.
  tao-nhap:
    name: Tạo bản nháp
    needs: kiem-tra
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tạo bản nháp nếu chưa có
        env:
          # Cùng token với bước công bố — `GITHUB_TOKEN` mặc định chỉ có quyền trên
          # repo NÀY, không tạo được release ở repo cuongthai-desktop.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          REPO="cuonghoang1103/cuongthai-desktop"
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Đã có $TAG — dùng lại."
          else
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes "Đang dựng…"
            echo "Đã tạo bản nháp $TAG."
          fi

  # ── Dựng ───────────────────────────────────────────────────
  dung:
    name: Dựng ${{ matrix.ten }}
    needs: tao-nhap
    runs-on: ${{ matrix.os }}
    strategy:
      # Một nền tảng hỏng thì hai nền tảng kia VẪN dựng xong. Mặc định của
      # GitHub là huỷ hết — mà thà có hai bản còn hơn không có bản nào.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ten: macOS
            lenh: dist:mac
          - os: windows-latest
            ten: Windows
            lenh: dist:win
          - os: ubuntu-latest
            ten: Linux
            lenh: dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      # libsecret là kho khoá của Linux. electron-builder cần nó lúc đóng gói
      # bản .deb; thiếu thì bản cài ra vẫn chạy nhưng safeStorage không mã hoá
      # được và người dùng phải đăng nhập lại mỗi lần mở app.
      - name: Cài thư viện hệ thống (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - run: npm ci
        working-directory: desktop

      # Cùng lý do như ở job kiểm tra: renderer biên dịch mã nguồn của frontend.
      - run: npm ci
        working-directory: frontend

      - name: Đặt phiên bản
        if: inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version
        working-directory: desktop

      - name: Dựng và phát hành
        run: npm run ${{ matrix.lenh }} -- --publish always
        working-directory: desktop
        env:
          # Token có quyền ghi vào repo PHÁT HÀNH (cuongthai-desktop), không
          # phải `GITHUB_TOKEN` mặc định — token mặc định chỉ có quyền trong
          # chính repo đang chạy workflow.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Không ký số (chưa mua chứng chỉ). Đặt tường minh để electron-builder
          # không đi tìm chứng chỉ trong keychain của máy runner rồi báo lỗi khó hiểu.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Giữ lại file cài kể cả khi bước phát hành hỏng — nếu không, một lỗi
      # token sẽ vứt luôn 15 phút dựng và phải chạy lại từ đầu.
      - name: Lưu bản cài làm artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ban-cai-${{ matrix.ten }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.yml
          if-no-files-found: warn
          retention-days: 14

  # ── Công bố ────────────────────────────────────────────────
  # Chạy SAU KHI cả ba nền tảng dựng xong. `needs: dung` đợi trọn ma trận và
  # chỉ chạy nếu KHÔNG job nào hỏng — nên một bản phát hành thiếu nền tảng sẽ
  # nằm mãi ở dạng nháp thay vì được công bố nửa vời.
  #
  # Đây là chốt chặn cho lỗi mà `releaseType: draft` mở đường giải quyết: xem
  # ghi chú dài trong desktop/electron-builder.yml.
  cong-bo:
    name: Công bố bản phát hành
    needs: dung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xác định thẻ phiên bản
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER=$(node -p "require('./desktop/package.json').version")
          fi
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Sẽ công bố v${VER}"

      # Đếm file TRƯỚC khi công bố. Cả ba job đều báo thành công mà vẫn có thể
      # thiếu file nếu một lượt upload lỗi âm thầm — mà đúng những file `.yml`
      # này mới là thứ `electron-updater` đọc, thiếu nó thì app báo lỗi đỏ dù
      # bản cài vẫn nằm đó.
      - name: Kiểm đủ file rồi mới công bố
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="cuonghoang1103/cuongthai-desktop"
          FILES=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "$FILES"
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            echo "$FILES" | grep -qx "$f" || { echo "❌ THIẾU $f — giữ nguyên bản nháp"; exit 1; }
          done
          echo "$FILES" | grep -q '\.exe$'      || { echo "❌ THIẾU bản cài Windows"; exit 1; }
          echo "$FILES" | grep -q '\.dmg$'      || { echo "❌ THIẾU bản cài macOS"; exit 1; }
          echo "$FILES" | grep -q '\.AppImage$' || { echo "❌ THIẾU bản cài Linux"; exit 1; }
          echo "✅ Đủ file"

      - name: Chuyển nháp sang công bố
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release edit "${{ steps.tag.outputs.tag }}" \
            --repo cuonghoang1103/cuongthai-desktop \
            --draft=false --latest
          echo "✅ Đã công bố ${{ steps.tag.outputs.tag }}"
