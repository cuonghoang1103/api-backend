# Dựng ứng dụng desktop cho cả ba nền tảng và đẩy lên GitHub Releases.
#
# ⚠️ CHỈ CHẠY BẰNG TAY (`workflow_dispatch`). KHÔNG thêm trigger `push:`.
#    Dự án này đã có hai lần sự cố thật vì nhiều workflow cùng chạy trên mỗi
#    push và giẫm chân nhau (03/07 và 06/07/2026 — xem CLAUDE.md). Workflow này
#    không đụng tới VPS nên không đua với deploy, nhưng quy tắc "không tự chạy
#    theo push" vẫn giữ cho nhất quán.
#
# Cách chạy: tab Actions → "Desktop — dựng bản cài 3 nền tảng" → Run workflow.
#
# Cần MỘT secret: `RELEASE_TOKEN` (xem docs/building-and-packaging.md).
# KHÔNG đụng tới VPS_HOST / VPS_USER / VPS_SSH_PRIVATE_KEY — 10 workflow khác
# đang dùng chúng.

name: Desktop — dựng bản cài 3 nền tảng

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (để trống = dùng version trong desktop/package.json)'
        required: false
        type: string

# Không cho hai lần chạy chồng nhau: cả hai sẽ cùng tải file lên một release và
# ghi đè lẫn nhau.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # ── Kiểm trước khi dựng ────────────────────────────────────
  # Chạy RIÊNG và chạy TRƯỚC. Dựng ba nền tảng mất ~15 phút và tốn phút Actions;
  # để một lỗi TypeScript làm hỏng cả ba job là lãng phí thấy rõ.
  kiem-tra:
    name: Kiểm tra mã
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # ── CHỐT CHẶN: KHÔNG dựng đè lên một bản ĐÃ CÔNG BỐ ──────────
      #
      # Nhiều phiên Claude cùng làm app desktop, và mỗi phiên tự bump version
      # rồi tự `gh workflow run`. Đêm 19-20/08/2026 có 11 lần bump trong 4,5
      # giờ, và hai lần dựng chồng nhau: v0.5.40 do một lượt công bố lúc
      # 18:08:17, lượt kia xong lúc 18:15:37 và TẢI ĐÈ lên đúng release đó.
      #
      # Lần đó không ai mất gì vì hai lượt dựng từ cùng một commit. Nhưng nếu
      # chúng dựng từ hai commit khác nhau thì người dùng đã tải về một bản
      # cài mang số hiệu của bản khác — hỏng câm, và không có cách nào biết.
      #
      # `concurrency` bên trên chỉ xếp hàng, KHÔNG chặn: lượt sau vẫn chạy,
      # chỉ là chạy sau. Đây mới là chỗ chặn.
      #
      # Bản NHÁP thì cho qua: một lượt chết giữa chừng để lại nháp, và chạy
      # lại để hoàn tất là việc đúng.
      - name: Chặn dựng đè bản đã công bố
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # ⚠️ Phải là `if`, KHÔNG phải `[ -z … ] && …`. Runner chạy `bash -e`,
          # nên khi `inputs.version` CÓ giá trị thì vế trái sai, cả câu trả về
          # 1, và bước này chết ngay — đúng ở nhánh ít dùng nên rất dễ lọt.
          VER='${{ inputs.version }}'
          if [ -z "$VER" ]; then
            VER=$(node -p "require('./desktop/package.json').version")
          fi
          echo "Sắp dựng phiên bản: $VER"
          NHAP=$(gh release view "v$VER" --repo cuonghoang1103/cuongthai-desktop \
                   --json isDraft --jq .isDraft 2>/dev/null || echo 'khong-co')
          case "$NHAP" in
            khong-co) echo "→ chưa có release v$VER, dựng tiếp." ;;
            true)     echo "→ v$VER đang là bản NHÁP, dựng tiếp để hoàn tất." ;;
            false)
              echo "::error::v$VER ĐÃ CÔNG BỐ rồi — dựng tiếp sẽ tải ĐÈ lên bản người dùng đang tải."
              echo "::error::Muốn ra bản mới thì bump version: (cd desktop && npm run phat-hanh -- \"mô tả\")"
              exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - run: npm ci
        working-directory: desktop

      # ⚠️ PHẢI cài cả deps của FRONTEND.
      #
      # App desktop dùng lại nguyên các component Notes của web qua alias
      # `@` → `../frontend/src` (xem `desktop/vite.config.ts`). Nên cây module
      # của renderer chạm THẬT vào `frontend/node_modules`, và thiếu nó thì cả
      # typecheck lẫn vitest lẫn `vite build` đều hỏng ở bước phân giải import.
      #
      # Hỏng đúng như vậy 17/08/2026: `routes.test.ts` (chỉ dùng `fs.existsSync`)
      # vẫn đỏ, vì nó import `./routes` → `page-registry` → `NotesPage` →
      # `@/app/notes/page` → `@dnd-kit/core`. Thông báo lỗi trỏ vào một file
      # frontend mà job này tưởng như không liên quan gì.
      - run: npm ci
        working-directory: frontend

      - name: Kiểm kiểu
        run: npm run typecheck
        working-directory: desktop

      - name: Unit test
        run: npx vitest run
        working-directory: desktop

  # ── Dựng ───────────────────────────────────────────────────
  dung:
    name: Dựng ${{ matrix.ten }}
    needs: kiem-tra
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Một nền tảng hỏng thì hai nền tảng kia VẪN dựng xong. Mặc định của
      # GitHub là huỷ hết — mà thà có hai bản còn hơn không có bản nào.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ten: macOS
            lenh: dist:mac
          - os: windows-latest
            ten: Windows
            lenh: dist:win
          - os: ubuntu-latest
            ten: Linux
            lenh: dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      # libsecret là kho khoá của Linux. electron-builder cần nó lúc đóng gói
      # bản .deb; thiếu thì bản cài ra vẫn chạy nhưng safeStorage không mã hoá
      # được và người dùng phải đăng nhập lại mỗi lần mở app.
      # ⚠️ BƯỚC NÀY TỪNG TREO 12 TIẾNG (bản dựng 0.5.21, 18/08/2026). Lệnh đã
      # có `-y` nên không phải câu hỏi y/n — thủ phạm là `debconf` hỏi cấu hình
      # (im lặng chờ mãi) hoặc một gương apt treo giữa chừng.
      #
      # Ba lớp chống, và lớp thứ ba mới là lớp cứu thật:
      #   1. DEBIAN_FRONTEND=noninteractive — bịt mọi câu hỏi của debconf
      #   2. timeout 300 + thử lại một lần — gương treo thì đổi lượt là qua
      #   3. `timeout-minutes` ở cấp JOB (bên trên) — dù có gì kẹt ở đâu thì
      #      cũng không job nào đốt quá số phút đó nữa
      # ⚠️ ĐÃ TREO HAI LẦN, và lần thứ hai mới đọc được vì sao.
      #
      # 0.5.21: treo 12 tiếng (chưa có trần). 0.5.22: treo đủ 300s HAI LẦN
      # rồi `exit 124`, KHÔNG in ra một dòng nào. `DEBIAN_FRONTEND` không
      # cứu được ⇒ không phải debconf hỏi.
      #
      # Thủ phạm gần như chắc chắn: runner của GitHub chạy
      # `unattended-upgrades` lúc khởi động và nó GIỮ KHOÁ dpkg. `apt-get`
      # mặc định chờ khoá VÔ HẠN — nên nó đứng im, không lỗi, không thông
      # báo. `DPkg::Lock::Timeout` là thứ duy nhất bảo nó bỏ cuộc.
      #
      # Bỏ luôn `-qq`: lần trước nó che mất chỗ kẹt, và một bước hay treo
      # thì im lặng là thứ đắt nhất.
      #
      # `continue-on-error`: Windows và macOS đã dựng xong. Chặn cả bản
      # phát hành vì MỘT thư viện đóng gói của Linux là đánh đổi tồi — bản
      # .deb thiếu libsecret vẫn chạy, chỉ là người dùng Linux phải đăng
      # nhập lại mỗi lần mở app. Có bản cài cho ba nền tảng, kém một chút ở
      # một nền tảng, vẫn hơn không có bản nào.
      - name: Cài thư viện hệ thống (Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          cai() {
            sudo -E apt-get -o DPkg::Lock::Timeout=90 update \
              && sudo -E apt-get -o DPkg::Lock::Timeout=90 install -y --no-install-recommends libsecret-1-dev
          }
          timeout 240 bash -c "$(declare -f cai); cai" && exit 0
          echo "::warning::apt lần 1 hỏng — chờ khoá dpkg rồi thử lại"
          # In ra AI đang giữ khoá, để lần sau khỏi phải đoán.
          sudo lsof /var/lib/dpkg/lock-frontend 2>/dev/null || true
          timeout 240 bash -c "$(declare -f cai); cai" && exit 0
          echo "::warning::KHÔNG cài được libsecret-1-dev. Bản .deb vẫn dựng, nhưng safeStorage không mã hoá được — người dùng Linux phải đăng nhập lại mỗi lần mở app."
          exit 0

      - run: npm ci
        working-directory: desktop

      # Cùng lý do như ở job kiểm tra: renderer biên dịch mã nguồn của frontend.
      - run: npm ci
        working-directory: frontend

      - name: Đặt phiên bản
        if: inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version
        working-directory: desktop

      # ⛔ KHÔNG `--publish` ở đây.
      #
      # Ba job chạy song song, mỗi job gọi publisher GitHub của electron-builder,
      # và mỗi cái tự tạo bản phát hành khi thấy thẻ chưa tồn tại — GitHub cho
      # phép nhiều bản NHÁP trùng thẻ, nên tệp mac nằm ở bản này, Linux ở bản
      # kia. Đã hỏng đúng vậy với 0.5.4 (ba bản nháp v0.5.4 cùng lúc).
      #
      # Tạo sẵn một bản nháp rồi để chúng dùng chung cũng KHÔNG ăn thua:
      # electron-builder vẫn ghi `creating GitHub release reason=release doesn't
      # exist` — nó không nhận bản nháp do người khác tạo.
      #
      # Nên: dựng xong thì NỘP tệp cho Actions, và đúng MỘT job công bố. Không
      # còn chỗ nào để đua.
      - name: Dựng
        run: npm run ${{ matrix.lenh }} -- --publish never
        working-directory: desktop
        env:
          # Token có quyền ghi vào repo PHÁT HÀNH (cuongthai-desktop), không
          # phải `GITHUB_TOKEN` mặc định — token mặc định chỉ có quyền trong
          # chính repo đang chạy workflow.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Không ký số (chưa mua chứng chỉ). Đặt tường minh để electron-builder
          # không đi tìm chứng chỉ trong keychain của máy runner rồi báo lỗi khó hiểu.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Đây giờ là ĐƯỜNG CHÍNH đưa tệp sang job công bố, không còn là bản dự
      # phòng. `if: always()` vẫn giữ: dựng hỏng giữa chừng thì phần đã xong vẫn
      # tải về xem được.
      - name: Lưu bản cài làm artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ban-cai-${{ matrix.ten }}
          # ⛔ PHẢI có `*.zip` và `*.blockmap`.
          #
          # Từ khi job công bố lấy tệp TỪ ĐÂY (thay vì mỗi nhánh tự tải thẳng
          # lên GitHub), danh sách này quyết định bản phát hành có gì. Thiếu
          # `.zip` là bản macOS mất đúng thứ Squirrel.Mac bắt buộc phải có —
          # xem ghi chú dài trong electron-builder.yml. Thiếu `.blockmap` thì
          # cập nhật không tải theo phần chênh lệch được nữa, phải tải lại trọn
          # gói mỗi lần.
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/*.yml
          if-no-files-found: warn
          retention-days: 14

  # ── Công bố ────────────────────────────────────────────────
  # Chạy SAU KHI cả ba nền tảng dựng xong. `needs: dung` đợi trọn ma trận và
  # chỉ chạy nếu KHÔNG job nào hỏng — nên một bản phát hành thiếu nền tảng sẽ
  # nằm mãi ở dạng nháp thay vì được công bố nửa vời.
  #
  # Đây là chốt chặn cho lỗi mà `releaseType: draft` mở đường giải quyết: xem
  # ghi chú dài trong desktop/electron-builder.yml.
  cong-bo:
    name: Công bố bản phát hành
    needs: dung
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Xác định thẻ phiên bản
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER=$(node -p "require('./desktop/package.json').version")
          fi
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Sẽ công bố v${VER}"

      - name: Tải bản cài của cả ba nền tảng về
        uses: actions/download-artifact@v4
        with:
          pattern: ban-cai-*
          path: tep
          merge-multiple: true

      # Đếm file TRƯỚC khi công bố — và đếm trên ĐĨA, trước khi tải lên. Những
      # file `.yml` này mới là thứ `electron-updater` đọc; thiếu một cái thì app
      # báo lỗi đỏ dù bản cài vẫn nằm đó.
      - name: Kiểm đủ file rồi mới công bố
        run: |
          FILES=$(cd tep && ls)
          echo "$FILES"
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            echo "$FILES" | grep -qx "$f" || { echo "❌ THIẾU $f — giữ nguyên bản nháp"; exit 1; }
          done
          echo "$FILES" | grep -q '\.exe$'      || { echo "❌ THIẾU bản cài Windows"; exit 1; }
          echo "$FILES" | grep -q '\.dmg$'      || { echo "❌ THIẾU bản cài macOS"; exit 1; }
          echo "$FILES" | grep -q '\.AppImage$' || { echo "❌ THIẾU bản cài Linux"; exit 1; }
          # `.zip` của macOS: Squirrel.Mac CHỈ áp được bản cập nhật từ zip.
          # Thiếu nó thì app tìm thấy bản mới, tải xuống, rồi chết với
          # `ZIP file not provided`.
          echo "$FILES" | grep -q 'mac\.zip$'   || { echo "❌ THIẾU .zip của macOS"; exit 1; }
          echo "✅ Đủ file"

      # MỘT job, MỘT lần tạo. `--clobber` để chạy lại không chết vì tệp đã có.
      - name: Tạo bản phát hành và tải tệp lên
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="cuonghoang1103/cuongthai-desktop"
          VER="${TAG#v}"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --draft --title "$VER" --notes "CuongThai $VER"
          gh release upload "$TAG" --repo "$REPO" --clobber tep/*

      - name: Chuyển nháp sang công bố
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release edit "${{ steps.tag.outputs.tag }}" \
            --repo cuonghoang1103/cuongthai-desktop \
            --draft=false --latest
          echo "✅ Đã công bố ${{ steps.tag.outputs.tag }}"
