name: SSH Port Diagnostic

# CHI DOC. Khong sua bat cu thu gi tren VPS.

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup SSH key
        env:
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${VPS_SSH_PRIVATE_KEY_B64}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          printf 'Host vps\n    HostName %s\n    User %s\n    IdentityFile ~/.ssh/deploy_key\n    StrictHostKeyChecking no\n    ConnectTimeout 30\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER }}" > ~/.ssh/config

      - name: Ai dang giu cong 22
        run: |
          ssh vps 'bash -s' <<'EOF'
          echo "===== A. TIEN TRINH NAO GIU CONG 22 ====="
          ss -tlnp 2>/dev/null | grep ":22 " || echo "khong thay"

          echo; echo "===== B. CAC UNIT SSH ====="
          systemctl list-units --all --no-pager --no-legend 'ssh*' 2>/dev/null

          echo; echo "===== C. NOI DUNG ssh.socket ====="
          systemctl cat ssh.socket 2>&1 | head -40

          echo; echo "===== D. TRANG THAI ssh.socket ====="
          systemctl status ssh.socket --no-pager 2>&1 | head -12

          echo; echo "===== E. TRANG THAI ssh.service ====="
          systemctl status ssh.service --no-pager 2>&1 | head -12

          echo; echo "===== F. DROP-IN 60-tunnel.conf (dang co san) ====="
          cat /etc/ssh/sshd_config.d/60-tunnel.conf 2>&1

          echo; echo "===== G. 10-hostkeys.conf ====="
          cat /etc/ssh/sshd_config.d/10-hostkeys.conf 2>&1

          echo; echo "===== H. systemd co ho tro sshd -t khong ====="
          sshd -t 2>&1 && echo "sshd -t: CU PHAP HOP LE"

          echo; echo "===== XONG ====="
          EOF
