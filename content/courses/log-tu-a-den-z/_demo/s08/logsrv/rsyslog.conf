# Máy chủ log trung tâm của lab (container lgz-logsrv, Ubuntu 24.04, rsyslog 8.2312). Nhận UDP 514, TCP 514, TLS 6514.
global(workDirectory="/var/spool/rsyslog"
       DefaultNetstreamDriverCAFile="/etc/rsyslog-tls/ca.pem"
       DefaultNetstreamDriverCertFile="/etc/rsyslog-tls/logsrv.pem"
       DefaultNetstreamDriverKeyFile="/etc/rsyslog-tls/logsrv.key")
module(load="imudp")
module(load="imtcp" maxSessions="200")
input(type="imudp" port="514" ruleset="xa")
input(type="imtcp" port="514" ruleset="xa")
input(type="imtcp" port="6514" ruleset="xa" name="tls"
      streamDriver.name="gtls" streamDriver.mode="1" streamDriver.authMode="anon")

# Mỗi máy gửi tới một thư mục, mỗi chương trình một tệp; giữ nguyên thời gian GỐC của máy gửi (timereported)
template(name="theoMay" type="string" string="/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log")
template(name="dongDu" type="string"
         string="%timereported:::date-rfc3339% %HOSTNAME% %syslogtag% [nhận %timegenerated:::date-rfc3339% qua %inputname%] %msg%\n")
ruleset(name="xa") {
  action(type="omfile" dynaFile="theoMay" template="dongDu" dirCreateMode="0750" fileCreateMode="0640")
}
# RELP (Bài 8.2): giao thức có XÁC NHẬN từng gói — bên gửi chỉ xoá khỏi hàng đợi khi bên nhận báo đã ghi
module(load="imrelp")
input(type="imrelp" port="2514" ruleset="xa")
