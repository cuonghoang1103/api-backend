# /etc/rsyslog.d/30-shop.conf — local3 = ứng dụng "shop" của lab (facility tự chọn cho ứng dụng: local0…local7)
template(name="shopJson" type="list" option.jsonf="on") {
  property(outname="time"     name="timereported" dateFormat="rfc3339" format="jsonf")
  property(outname="host"     name="hostname"            format="jsonf")
  property(outname="app"      name="programname"         format="jsonf")
  property(outname="pid"      name="procid"              format="jsonf")
  property(outname="severity" name="syslogseverity-text" format="jsonf")
  property(outname="msg"      name="msg"                 format="jsonf")
}
local3.warning    /var/log/shop/canh-bao.log
local3.=debug     stop
local3.*          action(type="omfile" file="/var/log/shop/shop.log")
local3.*          action(type="omfile" file="/var/log/shop/shop.json" template="shopJson")
local3.*          stop
