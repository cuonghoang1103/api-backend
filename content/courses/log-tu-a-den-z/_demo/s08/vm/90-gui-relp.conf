# /etc/rsyslog.d/20-gui-di.conf (bản 2b) — RELP: như TCP nhưng bên nhận XÁC NHẬN từng dòng ⇒ không mất dòng khi kết nối đứt
module(load="omrelp")
*.* action(type="omrelp" target="10.0.2.2" port="2514"
           queue.type="LinkedList" queue.filename="gui_relp" queue.saveOnShutdown="on"
           action.resumeRetryCount="-1" action.resumeInterval="5")
