# /etc/rsyslog.d/20-gui-di.conf (bản 2) — TCP + hàng đợi có đĩa đỡ: máy chủ log tắt thì GIỮ lại, bật lên thì gửi bù
*.* action(type="omfwd" target="10.0.2.2" port="514" protocol="tcp"
           template="RSYSLOG_SyslogProtocol23Format"
           queue.type="LinkedList" queue.filename="gui_di" queue.maxDiskSpace="200m"
           queue.saveOnShutdown="on" action.resumeRetryCount="-1" action.resumeInterval="5")
