# /etc/rsyslog.d/20-gui-di.conf (bản 3) — TLS cổng 6514, KIỂM chứng chỉ máy chủ: phải do CA của lab ký VÀ mang tên logsrv.lab
global(DefaultNetstreamDriverCAFile="/etc/rsyslog-tls/ca.pem")
*.* action(type="omfwd" target="10.0.2.2" port="6514" protocol="tcp"
           template="RSYSLOG_SyslogProtocol23Format"
           StreamDriver="gtls" StreamDriverMode="1"
           StreamDriverAuthMode="x509/name" StreamDriverPermittedPeers="logsrv.lab"
           queue.type="LinkedList" queue.filename="gui_tls" action.resumeRetryCount="-1")
