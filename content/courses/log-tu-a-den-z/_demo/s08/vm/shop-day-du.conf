# /etc/logrotate.d/shop (bản cuối) — như dùng thật: hằng ngày HOẶC khi quá 50M, giữ 14 bản, nén trễ 1 bản, tên theo ngày
/var/log/shopapp/*.log {
    su hv adm
    daily
    maxsize 50M
    rotate 14
    dateext
    dateformat -%Y%m%d-%s
    compress
    delaycompress
    missingok
    notifempty
    create 0640 hv adm
    sharedscripts
    postrotate
        pkill -HUP -f '^python3 .*ghi.py /var/log/shopapp/' || true
    endscript
}
