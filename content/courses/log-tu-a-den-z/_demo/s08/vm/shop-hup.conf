# /etc/logrotate.d/shop (bản B) — create + postrotate gửi SIGHUP: ứng dụng mở tệp MỚI theo tên
/var/log/shopapp/app.log {
    create 0640 hv adm
    rotate 3
    missingok
    notifempty
    sharedscripts
    postrotate
        pkill -HUP -f '^python3 .*ghi.py /var/log/shopapp/app.log' || true
    endscript
}
