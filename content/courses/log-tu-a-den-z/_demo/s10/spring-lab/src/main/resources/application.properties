spring.application.name=shop
server.port=8080
# Mức log theo package: gốc INFO, code của mình DEBUG khi cần
logging.level.root=INFO
logging.level.vn.lab.shop=INFO
# Actuator: CHỈ mở health và loggers, và chỉ trong lab (production phải khoá — bài 10.5)
management.endpoints.web.exposure.include=health,loggers
# Lab không có máy nhận trace: tắt gửi đi, vẫn sinh traceId/spanId cho log
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=false
management.opentelemetry.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
