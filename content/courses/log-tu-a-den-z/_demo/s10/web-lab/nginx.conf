# nginx.conf — reverse proxy của Lab 10 (nginx 1.27). Ghi 2 access log: dạng chữ "main" và dạng JSON.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
events { worker_connections 256; }
http {
  # Lab giả lập khách ở nhiều IP: tin X-Forwarded-For từ mạng docker (giống đứng sau CDN — bài 13.3)
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;

  # "combined" chuẩn + 3 trường cực có ích khi chẩn đoán
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time urt=$upstream_response_time rid=$request_id';
  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                  '"rt":$request_time,"urt":"$upstream_response_time","rid":"$request_id","ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log main;
  access_log /var/log/nginx/access.json json;

  limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
  client_max_body_size 1k;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    location /admin/ { deny all; }
    location = /api/login {
      limit_req zone=login burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header X-Request-Id $request_id;
    }
    location /api/ {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 5s;
    }
  }
}
