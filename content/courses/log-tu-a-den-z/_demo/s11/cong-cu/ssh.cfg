# Chương 11 — các máy trên LAN 192.168.56.0/24 (xem may.bash). android/wrt/win chỉ có LAN ⇒ đi qua lab7.
Host *
  IdentityFile ~/.rtq-lgz/vm/khoa
  IdentitiesOnly yes
  UserKnownHostsFile ~/.rtq-lgz/c11/known_hosts
  StrictHostKeyChecking accept-new
  ConnectTimeout 8
  LogLevel ERROR
Host lab7
  HostName 127.0.0.1
  Port 41707
  User hv
Host keodo
  HostName 127.0.0.1
  Port 41709
  User hv
Host android
  HostName 192.168.56.142
  User hv
  ProxyJump lab7
Host wrt
  HostName 192.168.56.1
  User root
  ProxyJump lab7
Host win
  HostName 192.168.56.177
  User Administrator
  ProxyJump lab7
