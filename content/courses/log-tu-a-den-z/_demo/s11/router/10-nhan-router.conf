# /etc/rsyslog.d/10-nhan-router.conf — máy Linux trong nhà NHẬN syslog của router (UDP 514), mỗi thiết bị một tệp
module(load="imudp")
template(name="theoThietBi" type="string" string="/var/log/remote/%HOSTNAME%.log")
ruleset(name="tuThietBiMang") {
  action(type="omfile" dynaFile="theoThietBi" fileCreateMode="0640" fileGroup="adm")
  stop
}
input(type="imudp" port="514" ruleset="tuThietBiMang")
