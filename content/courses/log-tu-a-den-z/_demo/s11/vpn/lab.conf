# /etc/openvpn/server/lab.conf — máy chủ OpenVPN của lab (chạy bằng openvpn-server@lab, log vào journal)
port 1194
proto udp
dev tun
ca ca.crt
cert server.crt
key server.key
dh none
crl-verify crl.pem
server 10.8.0.0 255.255.255.0
keepalive 10 60
status /run/openvpn-server/status-lab.log 10
status-version 2
verb 3
