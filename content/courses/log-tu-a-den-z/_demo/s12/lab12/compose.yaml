# Lab 12 — PostgreSQL 17 + API Node (pg). Không tạo mạng docker: db --network none, api dùng chung netns của db (localhost:5432).
# Cổng API 41201 chỉ thấy từ bên trong netns (tai.mjs chạy trong container api). Log PostgreSQL bật sẵn như bài 12.1–12.2.
name: lgz-lab12
services:
  db:
    image: lgz-pg12:1            # = postgres:17 + pgaudit + pgbadger (../anh/Dockerfile)
    container_name: lgz-lab12db
    network_mode: none
    environment: { POSTGRES_PASSWORD: lab-chi-dung-o-may-nha, TZ: Asia/Ho_Chi_Minh, PGTZ: Asia/Ho_Chi_Minh }
    volumes: [ "./sql:/docker-entrypoint-initdb.d:ro" ]
    command: >
      postgres -c logging_collector=on -c log_destination=stderr,jsonlog
               -c "log_line_prefix=%m [%p] %q%u@%d app=%a client=%h "
               -c log_min_duration_statement=100ms -c log_statement=ddl -c log_lock_waits=on
               -c shared_preload_libraries=pg_stat_statements,auto_explain
               -c auto_explain.log_min_duration=100ms -c auto_explain.log_analyze=on -c auto_explain.log_buffers=on -c auto_explain.log_timing=off
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
  api:
    image: node:22-alpine
    container_name: lgz-lab12api
    network_mode: service:db
    depends_on: [db]
    working_dir: /app
    volumes: [ "./app:/app" ]
    environment: { DATABASE_URL: "postgres://app:App-Lab-2026@localhost:5432/shop", PORT: "41201", TZ: Asia/Ho_Chi_Minh }
    command: sh -c "node server.mjs >> /app/logs/api.log 2>&1"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
