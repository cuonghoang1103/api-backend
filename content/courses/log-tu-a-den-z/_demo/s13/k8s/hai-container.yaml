# 13.2 — pod hai container (nginx + sidecar đọc log) và một pod có liveness probe hỏng.
apiVersion: v1
kind: Pod
metadata: { name: web-sidecar, namespace: lab13 }
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      imagePullPolicy: Never
    - name: goi-thu
      image: alpine:latest
      imagePullPolicy: Never
      command: ["sh", "-c", "for i in 1 2 3; do wget -qO- http://127.0.0.1/khong-co >/dev/null 2>&1; wget -qO /dev/null http://127.0.0.1/; echo \"goi-thu: lan $i xong\"; sleep 1; done; sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata: { name: song-do, namespace: lab13 }
spec:
  containers:
    - name: api
      image: nginx:1.27-alpine
      imagePullPolicy: Never
      livenessProbe:
        httpGet: { path: /healthz, port: 80 }
        periodSeconds: 3
        failureThreshold: 2
