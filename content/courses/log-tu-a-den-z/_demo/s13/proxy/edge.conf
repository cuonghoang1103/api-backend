# edge.conf — nginx đóng vai "CDN biên" (giả lập Cloudflare trong lab; KHÔNG phải Cloudflare thật).
# Thêm CF-Connecting-IP = IP của khách, nối X-Forwarded-For, gắn CF-Ray = mã yêu cầu + "-SIN" (giống dạng Ray ID của Cloudflare).
log_format edge '$remote_addr [$time_local] "$request" $status ray=$request_id-SIN xff_vao="$http_x_forwarded_for"';
server {
  listen 80;
  access_log /var/log/nginx/edge.log edge;
  location / {
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header CF-Ray $request_id-SIN;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://10.113.0.10:$arg_cong;
    proxy_intercept_errors on;
    error_page 502 504 = @loi;
  }
  location @loi { default_type text/plain; return 502 "Loi may chu goc. Ray ID: $request_id-SIN\n"; }
}
