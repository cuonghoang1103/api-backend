# origin.conf — nginx ở máy chủ gốc, hai cổng để so sánh.
#   :80   CẤU HÌNH SAI : không real_ip, nối thêm X-Forwarded-For của khách ($proxy_add_x_forwarded_for), app "trust proxy = true".
#   :8080 CẤU HÌNH ĐÚNG: chỉ tin CF-Connecting-IP khi request đến từ edge 10.113.0.5, GHI ĐÈ X-Forwarded-For, app chỉ tin nginx.
log_format goc '$remote_addr real_from=$realip_remote_addr [$time_local] "$request" $status xff="$http_x_forwarded_for" cfip="$http_cf_connecting_ip" ray=$http_cf_ray';
server {
  listen 80;
  access_log /var/log/nginx/goc-sai.log goc;
  location / {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header CF-Ray $http_cf_ray;
    proxy_pass http://10.113.0.20:3000;
  }
}
server {
  listen 8080;
  set_real_ip_from 10.113.0.5;          # chỉ edge; thật ngoài đời: danh sách dải IP Cloudflare công bố
  real_ip_header CF-Connecting-IP;
  access_log /var/log/nginx/goc-dung.log goc;
  location / {
    proxy_set_header X-Forwarded-For $remote_addr;   # GHI ĐÈ, không nối chuỗi khách gửi
    proxy_set_header CF-Ray $http_cf_ray;
    proxy_pass http://10.113.0.20:3001;
  }
}
