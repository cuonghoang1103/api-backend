# Lab 15 — luật BẪY: y hệt 'SSH thất bại tăng vọt' nhưng để noDataState mặc định (NoData).
apiVersion: 1
groups:
  - orgId: 1
    name: lab15-bay
    folder: Lab 15
    interval: 30s
    rules:
      - uid: ssh-mac-dinh
        title: SSH (để noData mặc định)
        condition: C
        for: 0s
        noDataState: NoData      # MẶC ĐỊNH của Grafana — chính là cái bẫy
        execErrState: Error
        labels: { muc: canh-bao }
        annotations:
          summary: 'SSH thất bại {{ $values.B.Value }} lần trong 5 phút trên {{ $labels.host }}'
          viec_can_lam: 'Xem IP nguồn: {host="lab15"} |= "Failed password" — chặn nếu không phải người nhà (Bài 8.3)'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki-lab
            model:
              expr: 'sum by (host) (count_over_time({job="journal", unit="ssh.service"} |= "Failed password" [5m]))'
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [10] } }]
