# NXLog Community Edition 3.x (C:\Program Files\nxlog\conf\nxlog.conf) — MẪU: đọc Event Log, đổi sang JSON, gửi syslog qua TLS (cổng 6514, RFC 5425).
<Extension json>
    Module      xm_json
</Extension>
<Input eventlog>
    Module      im_msvistalog
    <QueryXML>
        <QueryList><Query Id="0">
            <Select Path="Security">*[System[(EventID=4624 or EventID=4625 or EventID=4720 or EventID=1102)]]</Select>
            <Select Path="System">*[System[(EventID=7045 or EventID=104)]]</Select>
        </Query></QueryList>
    </QueryXML>
    Exec        to_json();
</Input>
<Output trungtam>
    Module      om_ssl
    Host        log.lab15.lan
    Port        6514
    CAFile      C:\ProgramData\nxlog\ca.crt
    CertFile    C:\ProgramData\nxlog\may-nay.crt
    CertKeyFile C:\ProgramData\nxlog\may-nay.key
</Output>
<Route r1>
    Path        eventlog => trungtam
</Route>
