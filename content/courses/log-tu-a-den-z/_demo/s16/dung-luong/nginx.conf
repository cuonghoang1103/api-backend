# nginx.conf — bỏ nhiễu ở NGUỒN: không ghi /health thành công, lấy mẫu 10 % request 2xx/3xx, giữ 100 % lỗi
events {}
http {
  map $request_uri $la_health { ~^/health 1; default 0; }
  split_clients $request_id $mau_10 { 10% 1; * 0; }
  map "$status:$la_health:$mau_10" $ghi {
    ~^[45]         1;   # mọi 4xx/5xx: luôn ghi
    ~^[23]..:1     0;   # /health thành công: bỏ
    ~^[23]..:0:1   1;   # 10 % phần còn lại
    default        0;
  }
  server {
    listen 8080;
    access_log /var/log/nginx/day-du.log;
    access_log /var/log/nginx/gon.log combined if=$ghi;
    location /health { return 200 "ok\n"; }
    location /api/loi { return 502 "loi\n"; }
    location / { return 200 "ok\n"; }
  }
}
