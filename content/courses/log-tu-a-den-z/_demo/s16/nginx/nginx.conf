# nginx.conf — hai access log cạnh nhau: "combined" mặc định (lộ ?token=) và "che" (thay giá trị token/password trong query)
events {}
http {
  map $args $args_che {
    default                                         $args;
    "~^(?<a>.*?)(?<k>token|password|code)=[^&]*(?<b>.*)$"   "${a}${k}=[CHE]${b}";
  }
  log_format che '$remote_addr - $remote_user [$time_local] "$request_method $uri${is_args}$args_che $server_protocol" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  server {
    listen 8080;
    access_log /var/log/nginx/combined.log combined;
    access_log /var/log/nginx/che.log che;
    location / { return 200 "ok\n"; }
  }
}
