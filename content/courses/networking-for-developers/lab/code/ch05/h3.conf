worker_processes 1;
events { worker_connections 64; }
http {
  server {
    listen 8443 ssl;
    listen 8443 quic reuseport;
    http2 on;
    http3 on;
    ssl_certificate     /tmp/c.pem;
    ssl_certificate_key /tmp/k.pem;
    server_name labflow.test;
    add_header Alt-Svc 'h3=":8443"; ma=86400';
    location / { default_type text/plain; return 200 'LabFlow over HTTP/3\n'; }
  }
}
