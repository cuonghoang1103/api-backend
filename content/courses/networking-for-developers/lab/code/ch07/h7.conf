# nginx của Chương 7: TLS + HTTP/2 + HTTP/3 trên 8443, gzip, HSTS, CORS, ETag (tệp tĩnh), và proxy đặt X-Forwarded-For
pid /tmp/nx.pid;
worker_processes 1;
events { worker_connections 64; }
http {
  access_log off;
  gzip on; gzip_types text/plain application/json text/css application/javascript; gzip_min_length 40;
  server {
    listen 8443 ssl;
    listen 8443 quic reuseport;
    http2 on; http3 on;
    ssl_certificate /tmp/c.pem; ssl_certificate_key /tmp/c.key;
    server_name labflow.test;
    add_header Alt-Svc 'h3=":8443"; ma=86400';
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    root /tmp/www;
    location / { default_type text/plain; try_files $uri /index.txt; }
    location /api/ {
      default_type application/json;
      return 200 '{"ok":true,"note":"a JSON body long enough that gzip and brotli actually shrink it a lot lot lot lot lot"}';
    }
    location /cors {
      add_header Access-Control-Allow-Origin "https://app.labflow.test" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
      if ($request_method = OPTIONS) { return 204; }
      default_type application/json; return 200 '{"ok":true}';
    }
  }
}
