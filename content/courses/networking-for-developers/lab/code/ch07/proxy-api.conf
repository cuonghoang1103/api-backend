# proxy tầng 2 (trên máy api): nhận từ proxy tầng 1, THÊM địa chỉ vào X-Forwarded-For rồi chuyển tới node api
pid /tmp/p2.pid;
worker_processes 1; events { worker_connections 64; }
http { access_log off; server { listen 8091;
  location / { proxy_pass http://127.0.0.1:3000; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } } }
