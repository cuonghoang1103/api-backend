# proxy tầng 1 (trên máy web): nhận từ client, đặt X-Forwarded-For rồi chuyển tới proxy tầng 2
pid /tmp/p1.pid;
worker_processes 1; events { worker_connections 64; }
http { access_log off; server { listen 8090;
  location / { proxy_pass http://10.10.2.20:8091; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } } }
