# Ch8 — "CDN thu nhỏ": một nginx BIÊN (edge, :8080) có proxy_cache, đặt trước một ORIGIN (:8081). Thêm một biên HỎNG (:8082).
pid /tmp/nx.pid;
worker_processes 1;
events { worker_connections 64; }
http {
  proxy_cache_path /tmp/cache keys_zone=z:1m max_size=10m inactive=10m;
  # ORIGIN: máy chủ gốc, đặt header cache CỦA NÓ
  server {
    listen 8081; root /tmp/www; access_log off;
    location /img/ { add_header Cache-Control "public, max-age=3600"; }
    location /slow { return 200 'slow origin\n'; }   # /slow do máy chủ api giả lập chậm thay
    location / { expires 30s; add_header Cache-Control "public, max-age=30"; }
  }
  # EDGE ĐÚNG: proxy_cache + X-Cache cho thấy HIT/MISS/EXPIRED
  server {
    listen 8080; access_log off;
    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_cache z; proxy_cache_valid 200 30s;
      proxy_cache_use_stale updating; add_header X-Cache $upstream_cache_status;
      proxy_cache_key "$scheme$host$request_uri";   # KHÔNG gồm cookie ⇒ mọi người dùng chia sẻ một bản
    }
    location /cham/ { proxy_pass http://10.10.2.20:3000/; proxy_read_timeout 1s; }   # 504 khi origin chậm
    client_max_body_size 1m;                                                        # 413 khi upload > 1MB
  }
  # EDGE HỎNG: nuốt Cache-Control của origin rồi dán no-store ⇒ cache KHÔNG BAO GIỜ có hiệu lực
  server {
    listen 8082; access_log off;
    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store";
    }
  }
}
