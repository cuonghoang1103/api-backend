# Ch10 lab — nginx như một BỘ CÂN BẰNG TẢI L7 (hiểu HTTP) trước 3 backend (10.10.2.20:3001-3003).
# Chạy trên nfd-web:  nginx -c /lab/k/code/ch10/lb.conf
# :8080 round-robin + passive health (max_fails) + /slow timeout 1s (⇒504) · :8081 consistent hash theo ?user · :8082 backend chết (⇒502)
worker_processes 1;
pid /tmp/lb.pid;
events { worker_connections 256; }
http {
  access_log off;
  proxy_connect_timeout 1s;

  upstream be {                      # round robin (mặc định) + kiểm sức khoẻ bị động
    server 10.10.2.20:3001 max_fails=1 fail_timeout=5s;
    server 10.10.2.20:3002 max_fails=1 fail_timeout=5s;
    server 10.10.2.20:3003 max_fails=1 fail_timeout=5s;
  }
  upstream be_hash {                  # băm nhất quán theo ?user= ⇒ cùng user luôn về cùng backend
    hash $arg_user consistent;
    server 10.10.2.20:3001;
    server 10.10.2.20:3002;
    server 10.10.2.20:3003;
  }
  upstream be_dead { server 10.10.2.20:3009; }   # cổng không ai nghe ⇒ 502

  server {                           # L7: round robin, thêm X-Forwarded-For, timeout 1s cho /slow
    listen 8080;
    location / {
      proxy_pass http://be;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_500;   # backend lỗi/chết ⇒ thử backend kế
    }
    location /slow { proxy_pass http://be; proxy_read_timeout 1s; proxy_next_upstream off; }   # backend 3s qua timeout 1s ⇒ 504
  }
  server { listen 8081; location / { proxy_pass http://be_hash; } }   # consistent hash
  server { listen 8082; location / { proxy_pass http://be_dead; } }   # ⇒ 502 (không backend sống)
}
