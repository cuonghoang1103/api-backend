# Ch11 lab — một điểm cuối TLS tự ký để demo openssl s_client (tầng TLS trong bảng kiểm). Chạy trên nfd-web.
worker_processes 1;
pid /tmp/tls.pid;
events { worker_connections 64; }
http {
  access_log off;
  server {
    listen 8443 ssl;
    ssl_certificate /tmp/c11.pem;
    ssl_certificate_key /tmp/c11.key;
    location / { return 200 "tls ok\n"; }
  }
}
