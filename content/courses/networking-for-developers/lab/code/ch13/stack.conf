# Ch13 capstone — một reverse proxy "edge" có thể TINH CHỈNH, đứng trước API, để đo trước/sau.
# Chạy trên nfd-web:  nginx -c /lab/k/code/ch13/stack.conf
#   :8080  — edge đã tối ưu: gzip, keep-alive tới upstream, cache /cached (biến /api/slow 3s thành tức thì)
#   /big.html (tĩnh, nén tốt) · /api/* (proxy + keep-alive) · /cached (cache) · /timeout (504) · /dead (502)
worker_processes 1;
pid /tmp/stack.pid;
events { worker_connections 256; }
http {
  access_log off;
  proxy_cache_path /tmp/ccache levels=1:2 keys_zone=cz:5m inactive=60s;
  upstream api  { server 10.10.2.20:3000; keepalive 16; }   # keepalive ⇒ dùng lại kết nối tới backend
  upstream dead { server 10.10.2.20:3999; }                  # không ai nghe ⇒ 502
  gzip on; gzip_types text/plain application/json; gzip_min_length 256;

  server {
    listen 8080;
    location = /big.html { root /tmp/www; }                  # tĩnh lớn, nén tốt (demo nén)
    location /api/ {                                          # proxy + keep-alive tới upstream
      proxy_pass http://api;
      proxy_http_version 1.1; proxy_set_header Connection "";
    }
    location = /cached {                                      # cache câu trả lời chậm: MISS 3s → HIT tức thì
      proxy_pass http://api/api/slow;
      proxy_cache cz; proxy_cache_valid 200 30s;
      add_header X-Cache $upstream_cache_status;
    }
    location = /timeout { proxy_pass http://api/api/slow; proxy_read_timeout 1s; }  # 504
    location = /dead    { proxy_pass http://dead/; }          # 502
  }
}
