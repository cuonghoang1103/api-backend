// ns1.cdn.test (192.0.2.40) — the CDN provider's DNS. GeoDNS with views: the answer depends on the address of the RESOLVER that asks.
//   vn = resolvers in Vietnam (the ISP resolver 192.0.2.1, the Hanoi site of the public DNS 192.0.2.30) ⇒ Hanoi edge 203.0.113.10
//   anything else (e.g. the Singapore site 198.19.255.2) ⇒ Singapore edge 203.0.113.11
acl vn { 192.0.2.1; 192.0.2.30; 198.51.100.0/24; 100.64.0.0/24; };
options { directory "/var/cache/bind"; listen-on { 192.0.2.40; 127.0.0.1; }; listen-on-v6 { none; };
  recursion no; dnssec-validation no; server-id "ns1.cdn.test"; version "lab"; };
view "vn" { match-clients { vn; }; zone "cdn.test" { type primary; file "/lab/k/moi-truong/dns/vung/cdn.test.zone"; }; };
view "sg" { match-clients { any; }; zone "cdn.test" { type primary; file "/lab/k/moi-truong/dns/vung/cdn.test.sg.zone"; }; };
