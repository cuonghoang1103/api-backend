// ns1.nic.test (192.0.2.20) — máy chủ của TLD .test (nhà đăng ký/registry): ủy quyền tên miền xuống máy chủ của chủ tên miền.
options { directory "/var/cache/bind"; listen-on { 192.0.2.20; 127.0.0.1; }; listen-on-v6 { none; };
  recursion no; dnssec-validation no; server-id "ns1.nic.test"; version "lab"; };
zone "test" { type primary; file "/dnsz/test.signed"; };
include "/etc/bind/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };
