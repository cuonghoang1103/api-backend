# nginx cổng LabFlow cho Chương 3: hai địa chỉ = hai "máy biên" (Hà Nội .10, Singapore .11) — GeoDNS chọn cái nào.
worker_processes 1;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  map $server_addr $noi { 203.0.113.11 "Singapore (server 203.0.113.11)"; default "Hanoi (server 203.0.113.10)"; }
  server {
    listen 80;
    listen [::]:80;
    location / { default_type text/plain; return 200 'LabFlow edge $noi\nyou came from $remote_addr port $remote_port\n'; }
  }
}
