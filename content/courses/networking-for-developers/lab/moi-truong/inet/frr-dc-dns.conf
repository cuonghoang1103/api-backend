! DC AS64510 (bản Chương 3, dns.yml) — như frr-dc.conf + phiên BGP với pop2 (DNS công cộng anycast, Singapore) qua sg0.
frr defaults traditional
hostname dc
log file /tmp/frr.log
!
router bgp 64510
 bgp router-id 192.0.2.3
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.0.2.1 remote-as 64500
 neighbor 192.0.2.1 description isp
 neighbor 198.19.255.2 remote-as 64530
 neighbor 198.19.255.2 description pop2 (public DNS, Singapore)
 neighbor 2001:db8:ffff::1 remote-as 64500
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 198.19.255.0/24
  no neighbor 2001:db8:ffff::1 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:d::/48
  neighbor 2001:db8:ffff::1 activate
 exit-address-family
exit
!
