! ISP AS64500 (bản Chương 3, dns.yml) — như frr-isp.conf + phiên BGP với pop1 (DNS công cộng anycast, Hà Nội).
frr defaults traditional
hostname isp
log file /tmp/frr.log
!
router bgp 64500
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.0.2.3 remote-as 64510
 neighbor 192.0.2.3 description dc (LabFlow hosting)
 neighbor 192.0.2.66 remote-as 64511
 neighbor 192.0.2.66 description rogue
 neighbor 192.0.2.30 remote-as 64530
 neighbor 192.0.2.30 description pop1 (public DNS, Hanoi)
 neighbor 2001:db8:ffff::3 remote-as 64510
 neighbor 2001:db8:ffff::66 remote-as 64511
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  no neighbor 2001:db8:ffff::3 activate
  no neighbor 2001:db8:ffff::66 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:a::/48
  neighbor 2001:db8:ffff::3 activate
  neighbor 2001:db8:ffff::66 activate
 exit-address-family
exit
!
