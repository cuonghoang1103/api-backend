! pop1 AS64530 — DNS công cộng 198.19.1.1, điểm Hà Nội: ngồi ở IX, chỉ nối BGP với ISP; quảng bá dải anycast 198.19.1.0/24.
frr defaults traditional
hostname pop1
log file /tmp/frr.log
!
router bgp 64530
 bgp router-id 192.0.2.30
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.0.2.1 remote-as 64500
 neighbor 192.0.2.1 description isp
 !
 address-family ipv4 unicast
  network 198.19.1.0/24
 exit-address-family
exit
!
