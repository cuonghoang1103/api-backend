! pop2 AS64530 — CÙNG DNS công cộng 198.19.1.1, điểm Singapore: nối BGP với router DC; quảng bá CÙNG dải anycast 198.19.1.0/24.
frr defaults traditional
hostname pop2
log file /tmp/frr.log
!
router bgp 64530
 bgp router-id 198.19.255.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 198.19.255.1 remote-as 64510
 neighbor 198.19.255.1 description dc
 !
 address-family ipv4 unicast
  network 198.19.1.0/24
 exit-address-family
exit
!
