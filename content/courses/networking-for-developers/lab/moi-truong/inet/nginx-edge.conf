# nginx ở cổng vào LabFlow (máy server, DC): nói cho người gọi biết máy chủ THẤY địa chỉ nào — bài NAT/IPv6 dựa vào dòng này.
worker_processes 1;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  server {
    listen 80;
    listen [::]:80;
    location / { default_type text/plain; return 200 'LabFlow edge (server 203.0.113.10)\nyou came from $remote_addr port $remote_port\n'; }
  }
}
