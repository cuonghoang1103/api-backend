# nginx của lab: phục vụ trang tĩnh ở / và chuyển /api/ sang máy chủ Node (giống cuongthai.com: nginx đứng trước API).
worker_processes 1;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  server {
    listen 80;
    server_name labflow.test;
    location / { default_type text/html; return 200 '<h1>LabFlow lab</h1>\n'; }
    location /big { default_type text/plain; return 200 '$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id\n'; }
    # hai đường cố ý hỏng để học đọc mã lỗi của proxy: 502 (phía sau không ai nghe) và 504 (phía sau quá chậm)
    location /hong/ { proxy_pass http://10.10.2.20:4999/; }
    location /cham/ { proxy_pass http://10.10.2.20:3000/; proxy_read_timeout 1s; }
    location /api/ {
      proxy_pass http://10.10.2.20:3000;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
