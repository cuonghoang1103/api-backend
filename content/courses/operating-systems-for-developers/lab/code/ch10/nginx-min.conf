# nginx-min.conf — cấu hình nhỏ nhất cho phòng lab (chạy tiền cảnh, không cần root dir của gói).
worker_processes 2;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log;
events { worker_connections 20000; }
http {
    access_log off;
    sendfile on;
    server {
        listen 8080;
        root /tmp/www;
        location = /hello { return 200 "hello from nginx\n"; }
    }
}
