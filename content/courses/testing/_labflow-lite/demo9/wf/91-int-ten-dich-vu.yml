# Lesson 9.1 — integration tests against a PostgreSQL service container (GitHub docs pattern: service name, no ports)
name: tests
on: [push, pull_request]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: labflow_test
        options: >-
          --health-cmd "pg_isready -U postgres -d labflow_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/labflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:int -- test/integration
