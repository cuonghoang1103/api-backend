<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="chup" content="560x300">
<title>Layer 3 — HTML + CSS + JavaScript</title>
<style>
  body   { font-family: system-ui, sans-serif; background: #f5f7fb; margin: 24px; }
  h1     { color: #1f4e8c; margin: 0 0 4px; }
  button { background: #1f4e8c; color: white; border: 0; border-radius: 8px;
           padding: 10px 18px; font-size: 16px; cursor: pointer; }
  #count { color: #555; }
</style>
</head>
<body>
  <h1>Hi, I'm Linh</h1>
  <p>I am learning web development.</p>
  <button id="like">Like</button>
  <p id="count">0 likes</p>
  <script>
    let likes = 0;
    const button = document.querySelector('#like');
    const count = document.querySelector('#count');
    button.addEventListener('click', () => {
      likes = likes + 1;
      count.textContent = likes + (likes === 1 ? ' like' : ' likes');
      console.log('clicked, likes =', likes);
    });
    // the demo clicks three times by itself, so the screenshot shows the result
    button.click(); button.click(); button.click();
  </script>
</body>
</html>
