<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="chup" content="700x220">
<title>Global class names collide</title>
<style>
  /* card.css, written by Lan */
  .title { font-size: 20px; color: rgb(37, 99, 235); }
  /* footer.css, written by Minh a month later */
  .title { font-size: 12px; color: rgb(156, 163, 175); text-transform: uppercase; }
  body { font-family: system-ui, sans-serif; padding: 16px; }
  .card, footer { border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="card"><h3 class="title">Product card title</h3><p>Lan never touched this file again.</p></div>
  <footer><span class="title">Footer heading</span></footer>
  <script>
    const t = getComputedStyle(document.querySelector('.card .title'));
    console.log('card title is now', t.fontSize, t.color, t.textTransform, '— broken by a rule written for the footer');
  </script>
</body>
</html>
