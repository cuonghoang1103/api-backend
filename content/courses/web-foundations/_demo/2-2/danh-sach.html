<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Lists</title><meta name="chup" content="640x250">
<style>body{font-family:system-ui,sans-serif;margin:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px 24px} ul,ol,dl{margin:4px 0}</style></head>
<body>
  <ul>
    <li>Flour</li>
    <li>Water</li>
    <li>Salt
      <ul>
        <li>fine sea salt</li>
      </ul>
    </li>
  </ul>
  <ol>
    <li>Mix</li>
    <li>Knead</li>
    <li>Bake</li>
  </ol>
  <ol start="5" reversed>
    <li>Fifth from the end</li>
    <li>Fourth</li>
  </ol>
  <dl>
    <dt>HTML</dt>
    <dd>Structure of a page</dd>
    <dt>CSS</dt>
    <dd>How it looks</dd>
  </dl>
<script>
  console.log('items directly in the first list:', document.querySelector('ul').children.length);
  console.log('all li on the page:', document.querySelectorAll('li').length);
</script>
</body>
</html>
