<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Div soup</title><meta name="chup" content="640x330">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  .top { background: #1f4e8c; color: #fff; padding: 12px 16px; font-size: 20px; font-weight: 700; }
  .menu { background: #e8eef7; padding: 8px 16px; }
  .link { color: #1f4e8c; text-decoration: underline; cursor: pointer; margin-right: 12px; }
  .post { padding: 12px 16px; }
  .title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .btn { display: inline-block; background: #1f4e8c; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .bottom { background: #eee; padding: 8px 16px; font-size: 14px; }
</style>
</head>
<body>
  <div class="top">My Blog</div>
  <div class="menu"><span class="link" onclick="location.href='/'">Home</span><span class="link">About</span></div>
  <div class="post">
    <div class="title">Why semantic HTML matters</div>
    <div>Screen readers and search engines read the structure.</div>
    <div class="btn" onclick="alert('liked')">Like</div>
  </div>
  <div class="bottom">© 2026 My Blog</div>
</body>
</html>
