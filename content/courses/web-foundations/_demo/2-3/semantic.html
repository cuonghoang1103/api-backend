<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Semantic</title><meta name="chup" content="640x330">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  header { background: #1f4e8c; color: #fff; padding: 12px 16px; font-size: 20px; font-weight: 700; }
  nav { background: #e8eef7; padding: 8px 16px; }
  nav a { color: #1f4e8c; margin-right: 12px; }
  article { padding: 12px 16px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 6px; }
  button { background: #1f4e8c; color: #fff; padding: 6px 12px; border: 0; border-radius: 6px; cursor: pointer; font: inherit; }
  footer { background: #eee; padding: 8px 16px; font-size: 14px; }
</style>
</head>
<body>
  <header>My Blog</header>
  <nav><a href="/">Home</a><a href="/about">About</a></nav>
  <main>
    <article>
      <h1>Why semantic HTML matters</h1>
      <p>Screen readers and search engines read the structure.</p>
      <button type="button" onclick="alert('liked')">Like</button>
    </article>
  </main>
  <footer>© 2026 My Blog</footer>
</body>
</html>
