<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Contrast</title><meta name="chup" content="640x210">
<style>body{font-family:system-ui,sans-serif;margin:12px} p{padding:6px 10px;margin:6px 0;border-radius:6px}</style></head>
<body>
<p style="color:#000;background:#fff">black on white</p>
<p style="color:#767676;background:#fff">#767676 grey on white</p>
<p style="color:#aaa;background:#fff">#aaa light grey on white</p>
<p style="color:#fff;background:#e08a1e">white on orange</p>
<p style="color:#fff;background:#1f4e8c">white on blue</p>
<script>
  // The WCAG contrast formula: relative luminance of each colour, then (L1 + 0.05) / (L2 + 0.05)
  const lum = (rgb) => {
    const [r, g, b] = rgb.match(/\d+/g).slice(0, 3).map((v) => {
      const c = v / 255;
      return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  for (const p of document.querySelectorAll('p')) {
    const s = getComputedStyle(p);
    const [a, b] = [lum(s.color), lum(s.backgroundColor)].sort((x, y) => y - x);
    const ratio = (a + 0.05) / (b + 0.05);
    console.log(p.textContent.padEnd(26), ratio.toFixed(2) + ':1', ratio >= 4.5 ? 'AA pass' : 'AA FAIL');
  }
</script>
</body>
</html>
