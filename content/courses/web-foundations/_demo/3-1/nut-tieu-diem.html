<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Button styles</title><meta name="chup" content="640x130">
<style>
  body { font-family: system-ui, sans-serif; margin: 20px; display: flex; gap: 16px; }
  .btn {
    font: inherit;                 /* controls do not inherit by themselves */
    color: #fff;
    background: #1f4e8c;
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .btn:hover { background: #17406f; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid #e08a1e; outline-offset: 2px; }   /* keep a visible focus! */
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
</style></head>
<body>
  <button class="btn" id="a">Normal</button>
  <button class="btn" id="b">Focused</button>
  <button class="btn" disabled>Disabled</button>
<script>
  document.getElementById('b').focus();
  console.log('focus on #b; matches :focus-visible?', document.getElementById('b').matches(':focus-visible'));
</script>
</body>
</html>
