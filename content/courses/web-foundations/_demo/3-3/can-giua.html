<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Centering</title>
<style>
  .stage { display: flex; justify-content: center; align-items: center; width: 400px; height: 300px; background: #eee; }
  .box { width: 100px; height: 60px; background: #1f4e8c; }
</style></head>
<body>
  <div class="stage"><div class="box"></div></div>
<script>
  const s = document.querySelector('.stage').getBoundingClientRect(), b = document.querySelector('.box').getBoundingClientRect();
  console.log('space left/right:', b.left - s.left, s.right - b.right, '· top/bottom:', b.top - s.top, s.bottom - b.bottom);
</script>
</body>
</html>
