<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Grid areas</title><meta name="chup" content="640x300">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  .page {
    display: grid;
    min-height: 300px;
    grid-template-columns: 180px 1fr;
    grid-template-rows: 60px 1fr 40px;
    grid-template-areas:
      "header header"
      "side   main"
      "footer footer";
  }
  header { grid-area: header; background: #1f4e8c; color: #fff; }
  aside  { grid-area: side; background: #e8eef7; }
  main   { grid-area: main; background: #fff; }
  footer { grid-area: footer; background: #eee; }
  .page > * { padding: 10px; }
</style></head>
<body>
  <div class="page">
    <header>header</header>
    <aside>side</aside>
    <main>main</main>
    <footer>footer</footer>
  </div>
<script>
  for (const s of ['header', 'aside', 'main', 'footer']) {
    const r = document.querySelector(s).getBoundingClientRect();
    console.log(s.padEnd(7), 'x', r.x, 'y', r.y, Math.round(r.width) + '×' + r.height);
  }
</script>
</body>
</html>
