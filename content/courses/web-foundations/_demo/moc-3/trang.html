<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes — Recipe notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="trang.html"><strong>Recipe notebook</strong></a>
      <nav aria-label="Main"><ul><li><a href="trang.html">Recipes</a></li><li><a href="new.html">Add</a></li><li><a href="login.html">Log in</a></li></ul></nav>
    </div>
  </header>
  <main class="container">
    <h1>All recipes</h1>
    <ul class="cards" id="cards"></ul>
  </main>
  <script>
    // Six placeholder cards so the grid has something to lay out.
    const names = ['Pho bo', 'Banh flan', 'Goi cuon', 'Bun cha', 'Che ba mau', 'Com tam with a much longer name'];
    document.getElementById('cards').innerHTML = names.map((n, i) =>
      '<li><article class="card"><svg viewBox="0 0 16 9" role="img" aria-label="photo placeholder"><rect width="16" height="9" fill="#e4e7eb"/></svg>' +
      '<div class="card__body"><h2 style="font-size:1.1rem;margin:0">' + n + '</h2><p class="card__meta">' + (20 + i * 10) + ' minutes</p></div></article></li>').join('');
    const cols = getComputedStyle(document.getElementById('cards')).gridTemplateColumns.split(' ').length;
    console.log('width ' + innerWidth + 'px -> ' + cols + ' column(s)');
  </script>
</body>
</html>
