# ════════════════════════════════════════════════════════════════
# coturn — máy chủ TURN/STUN cho gọi thoại 1-1
#
# VÌ SAO CẦN: hai máy sau NAT (đặc biệt 4G Việt Nam) KHÔNG nối thẳng được
# với nhau. TURN đứng giữa tiếp sức. Khoảng 10-20% cuộc gọi cần tới nó;
# phần còn lại nối thẳng và máy chủ chỉ làm nhiệm vụ giới thiệu.
#
# ⚠️ Chạy `network_mode: host` trong compose. TURN cần một DẢI cổng UDP để
# cấp cho từng phiên; map từng cổng qua bridge của Docker là không khả thi,
# và NAT của Docker còn làm hỏng địa chỉ mà TURN quảng bá cho client.
# ════════════════════════════════════════════════════════════════

listening-port=3478
tls-listening-port=5349

# Dải cổng chuyển tiếp — HẸP có chủ đích. Mỗi cuộc gọi thoại chiếm 1-2 cổng,
# nên 40 cổng đủ cho ~20 cuộc song song. Mở rộng hơn chỉ làm bề mặt tấn công
# to ra mà không dùng tới.
min-port=49160
max-port=49200

# `realm` phải khớp thứ backend ký vào khoá tạm, không thì coturn từ chối.
realm=cuongthai.com
server-name=cuongthai.com

# ── Xác thực bằng KHOÁ TẠM ────────────────────────────────────────
#
# KHÔNG dùng tài khoản cố định (`user=abc:xyz`). Client web phải cầm được
# thông tin đăng nhập TURN để dùng nó — nghĩa là bất kỳ ai mở DevTools cũng
# đọc được, và họ sẽ có một máy chủ tiếp sức miễn phí do bạn trả băng thông.
#
# Cơ chế khoá tạm: backend ký `HMAC-SHA1(bí mật, "<hết hạn>:<userId>")` rồi
# đưa cho client. coturn tự kiểm bằng cùng bí mật, không cần cơ sở dữ liệu.
# Khoá hết hạn sau 10 phút nên rò ra cũng gần như vô hại.
use-auth-secret
# ⚠️ Bí mật KHÔNG đặt ở đây. File cấu hình của coturn không nở biến môi
# trường, mà nhét bí mật thẳng vào file là đưa nó vào git. Compose truyền
# bằng tham số dòng lệnh `--static-auth-secret=${TURN_SECRET}`, đọc từ
# `/opt/cuonghoangdev/.env` — cùng chỗ mọi bí mật khác của production.

# ── TLS ───────────────────────────────────────────────────────────
# Dùng lại chứng chỉ Let's Encrypt mà nginx đang dùng, mount CHỈ ĐỌC.
# Certbot gia hạn là cả hai cùng có bản mới.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
# Bỏ hẳn giao thức cũ đã vỡ.
no-tlsv1
no-tlsv1_1

# ── Chặn lạm dụng ─────────────────────────────────────────────────
#
# Không có mấy dòng này thì TURN thành bàn đạp quét mạng nội bộ: kẻ tấn công
# xin coturn tiếp sức tới 127.0.0.1 hay 10.x, và coturn ngoan ngoãn làm —
# tức là chọc thẳng vào Postgres và Redis đang chạy cùng máy.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Trần mỗi phiên và tổng — VPS còn phải chạy Postgres, đừng để một cuộc gọi
# hỏng hay một kẻ phá hoại ăn hết băng thông.
user-quota=12
total-quota=100
max-bps=128000

# Tắt những thứ không dùng: bớt bề mặt tấn công.
no-multicast-peers
no-cli
no-software-attribute

# Log ra stdout để `docker logs` đọc được, thay vì đẻ file trong container.
log-file=stdout
simple-log
