# Cấu hình đóng gói — electron-builder
#
# Chạy:
#   npm run pack        # thư mục chưa nén, để thử nhanh
#   npm run dist:mac    # CuongThai-<ver>-arm64.dmg và -x64.dmg
#   npm run dist:win    # CuongThai-Setup-<ver>.exe
#   npm run dist:linux  # .AppImage và .deb
#
# ⚠️ WINDOWS CHƯA KÝ SỐ (quyết định của chủ dự án, 16/08/2026) — SmartScreen
#   chặn màn xanh, phải bấm "Thêm thông tin" → "Vẫn chạy". Linux không ảnh hưởng.
#
# ✅ macOS CÓ đường ký + công chứng (19/08/2026): `npm run dist:mac:ky`
#   (xem scripts/ky-mac.mjs). Cần chứng thư "Developer ID Application" trong
#   Keychain và hồ sơ notarytool tên `cuongthai-notary`; script tự kiểm cả hai
#   trước khi dựng và nói rõ thiếu cái gì.
#
#   `npm run dist:mac` (KHÔNG ký) vẫn giữ nguyên: nó đặt
#   CSC_IDENTITY_AUTO_DISCOVERY=false nên electron-builder bỏ qua bước ký, và
#   `hardenedRuntime` bên dưới trở thành vô hại vì không có chữ ký nào để gắn cờ.
#   Bản chưa ký khi tải về vẫn bị Gatekeeper báo "app bị hỏng" — app KHÔNG hỏng,
#   gỡ bằng: xattr -dr com.apple.quarantine /Applications/CuongThai.app

appId: com.cuongthai.desktop
productName: CuongThai
copyright: © 2026 CuongHoangDev

directories:
  output: release
  buildResources: build

# Chỉ đóng gói thứ app thật sự cần lúc chạy.
# `dist/**` là mã đã build; `node_modules` được electron-builder tự lọc theo
# `dependencies` trong package.json (KHÔNG gồm devDependencies), nên electron,
# vite, playwright... không lọt vào bản cài.
# Móc chạy ngay sau khi ký, trước khi đóng .dmg/.zip — công chứng bản .app để
# con dấu nằm sẵn trong CẢ HAI gói. Móc tự tắt nếu không có KY_MAC=1, nên bản
# dựng chưa ký không đụng tới nó.
afterSign: scripts/notarize-hook.cjs

files:
  - dist/**/*
  - package.json
  - '!**/*.map'   # source map chỉ có ích khi gỡ lỗi, và nó phình gói lên gấp đôi

# ── macOS ──────────────────────────────────────────────────
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # arm64 và x64 RIÊNG, không dùng `universal`: bản universal nhét cả hai kiến
  # trúc vào một file nên nặng gấp đôi (~250MB), trong khi mỗi người dùng chỉ
  # cần đúng một nửa. Trang /download tự nhận diện và đưa đúng bản.
  # ⛔ PHẢI có CẢ `zip`, không chỉ `dmg`.
  #
  # `dmg` là thứ người dùng tải về và cài lần đầu. Nhưng electron-updater trên
  # macOS dùng Squirrel.Mac, và Squirrel CHỈ áp được bản cập nhật từ `.zip` —
  # thiếu nó thì app tìm thấy bản mới, tải xuống, rồi chết với
  # `ZIP file not provided` và người dùng mắc kẹt ở bản cũ mãi mãi.
  #
  # Đo được 17/08/2026 bằng cách CHẠY bản đã đóng gói. Đọc cấu hình không ra:
  # `dmg` trông hoàn toàn hợp lý, và `latest-mac.yml` vẫn được sinh ra bình
  # thường như thể mọi thứ đều ổn.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # macOS 11 là bản cũ nhất Electron 33 còn hỗ trợ.
  minimumSystemVersion: '11.0'
  # ── Ký số + công chứng ────────────────────────────────────
  # Apple TỪ CHỐI công chứng bất cứ thứ gì không bật Hardened Runtime, nên nó
  # phải bật. Đổi lại, Hardened Runtime chặn đúng những gì Electron cần (JIT,
  # bộ nhớ thực thi không ký, nạp thư viện ngoài) — bù lại bằng hai file
  # entitlements bên dưới. Đọc chú thích trong chính hai file đó trước khi cắt
  # bớt khoá nào: app ký xong mà thiếu khoá thì crash NGAY lúc mở, còn bản chưa
  # ký lại chạy bình thường, nên rất dễ đổ oan cho bản build.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # `identity: null` (ép KHÔNG ký) đã bỏ. Bản chưa ký nay điều khiển bằng biến
  # môi trường CSC_IDENTITY_AUTO_DISCOVERY=false trong script `dist:mac`, nhờ
  # vậy cùng một file cấu hình phục vụ được cả hai đường.
  #
  # spctl chạy trên MÁY BUILD không nói lên điều gì về máy người dùng (máy build
  # đã tin chứng thư của chính nó), mà lại làm hỏng build khi mạng chậm.
  # scripts/ky-mac.mjs kiểm lại tử tế sau khi công chứng + đóng dấu xong.
  gatekeeperAssess: false
  # Bật bằng tham số dòng lệnh trong scripts/ky-mac.mjs (`-c.mac.notarize...`),
  # KHÔNG bật ở đây: để `true` cố định thì mọi bản dựng chưa ký cũng lao vào
  # công chứng rồi chết giữa chừng.
  notarize: false
  # Khai báo lý do xin quyền micro. macOS hiện đúng câu này trong hộp thoại xin
  # quyền — bỏ trống thì hệ thống hiện chuỗi mặc định vô nghĩa, và người dùng
  # không hiểu vì sao app xin micro nên họ từ chối.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      CuongThai dùng micro khi bạn giữ nút nói với trợ lý Odin. Micro chỉ bật
      trong lúc bạn giữ nút và tắt ngay khi thả tay.

dmg:
  # ⚠️ `title` PHẢI có ${arch}. Đây là tên ổ đĩa ảo lúc dựng, và macOS mount nó
  # thật vào /Volumes. Hai bản arm64 + x64 dựng liên tiếp với cùng một tên sẽ
  # đụng nhau: bản sau không mount được, rồi `hdiutil detach` thất bại năm lần
  # liên tiếp và giết cả job. Máy cá nhân ít gặp vì ổ cũ kịp tự tháo; máy CI
  # nhanh hơn nên dính chắc.
  # Đã hỏng đúng như vậy trên GitHub Actions ngày 16/08/2026.
  title: '${productName} ${version} ${arch}'
  artifactName: '${productName}-${version}-${arch}.${ext}'

# ── Windows ────────────────────────────────────────────────
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  # Cho người dùng chọn thư mục cài. Bắt buộc cài vào Program Files sẽ đòi
  # quyền quản trị, và app này không cần quyền đó.
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: '${productName}-Setup-${version}.${ext}'

# ── Linux ──────────────────────────────────────────────────
linux:
  icon: build/icon.png
  category: Development
  synopsis: Ứng dụng desktop cho cuongthai.com
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # Đăng ký scheme deep-link để vòng OAuth quay lại được app.
  desktop:
    MimeType: x-scheme-handler/cuongthai;

appImage:
  artifactName: '${productName}-${version}.${ext}'

deb:
  artifactName: '${productName}-${version}.${ext}'
  # libsecret là kho khoá của Linux. Thiếu nó thì `safeStorage` không mã hoá
  # được, app từ chối ghi phiên, và người dùng phải đăng nhập lại mỗi lần mở.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libsecret-1-0

# ── Phát hành ──────────────────────────────────────────────
# GitHub Releases. electron-updater đọc thẳng từ đây; không cần máy chủ riêng.
# ⚠️ Repo dưới đây CHƯA TỒN TẠI tính đến 16/08/2026. Trước lần phát hành đầu:
#     gh repo create cuonghoang1103/cuongthai-desktop --public
#   Hoặc đổi `repo` thành `api-backend` để phát hành ngay trong repo hiện tại —
#   nhưng repo đó là PRIVATE, mà electron-updater tải bản mới KHÔNG kèm token,
#   nên bản cài sẽ không tự cập nhật được. Repo phát hành phải PUBLIC.
publish:
  provider: github
  owner: cuonghoang1103
  repo: cuongthai-desktop
  # NHÁP, không phải `release`.
  #
  # Ba nền tảng dựng SONG SONG và cùng đẩy file vào một bản phát hành. Với
  # `releaseType: release`, job nào xong trước sẽ CÔNG BỐ bản phát hành ngay,
  # trong khi hai job kia còn đang dựng — nên luôn có một cửa sổ vài phút mà
  # bản phát hành tồn tại công khai nhưng thiếu file.
  #
  # Ai bấm "Kiểm tra bản mới" đúng lúc đó sẽ nhận nguyên một bãi lỗi đỏ
  # `Cannot find latest-mac.yml … 404`, đọc như app hỏng chứ không phải "đang
  # dựng, chờ chút". Đã xảy ra thật với bản 0.5.1 ngày 17/08/2026.
  #
  # Để nháp thì `electron-updater` KHÔNG thấy gì (bản nháp không nằm trong
  # `/releases/latest` và tải ẩn danh thì 404) — app im lặng báo "đã mới nhất"
  # cho tới khi bản phát hành đủ file được công bố ở bước cuối của workflow.
  releaseType: draft
