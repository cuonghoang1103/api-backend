; ============================================================
; Mini-Me Robot — ESP32-S3-DevKitC-1 (N16R8)
; ============================================================
;
; ⚠️ ĐỪNG CHẠY `pio pkg install` ĐỂ THÊM THƯ VIỆN — nó ghi lại file này
;    và XOÁ SẠCH mọi dòng chú thích. Thêm tay vào `lib_deps` rồi
;    `pio run` là đủ; thư viện tự tải về ở lần build đầu.
;
; Board choice matters here. `esp32-s3-devkitc-1` alone defaults to
; the 8 MB / no-PSRAM layout; this build needs the 16 MB flash +
; 8 MB OCTAL PSRAM variant, which is what the explicit build flags
; below select. Get this wrong and the symptom is not a compile
; error — it is `ps_malloc()` silently returning NULL at runtime and
; the audio buffer never allocating.
;
; ── BA MÀN, MỘT THƯ VIỆN (đổi 15/08/2026) ──
;
; Trước đây màn 3.5" chạy TFT_eSPI. Nhưng TFT_eSPI chốt LOẠI CHIP MÀN
; lúc biên dịch — một bản build chỉ nói chuyện được với một driver — nên
; nó không thể vừa lái ILI9488 (ngực) vừa lái GC9A01 (hai mắt).
;
; Cả ba màn nay dùng **Arduino_GFX**, chọn driver lúc CHẠY. Vì thế mọi
; cờ `-DTFT_*`, `-DUSER_SETUP_LOADED`, `-DSPI_FREQUENCY`,
; `-DUSE_HSPI_PORT` đã BỎ HẲN: chân và tốc độ nay khai trong
; `src/config.h` + `src/man_hinh.h`, tức bằng mã, tức git thấy được và
; sửa một chỗ.

[env:mini-me]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 16 MB flash with an OTA-capable partition table — two app slots so
; a bad firmware push can roll back instead of bricking the robot.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; `demo_mat.cpp` cũng khai setup()/loop() — để lẫn vào đây là trùng ký
; hiệu, trình liên kết báo lỗi.
build_src_filter = +<*> -<demo_mat.cpp> -<tim_loi_mat.cpp> -<kiem_day.cpp> -<tim_loi_tft.cpp> -<thu_banh.cpp>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; Bật log của thư viện WebSocket để nó tự nói vì sao ngắt. Không có
    ; dòng này thì mọi lần rớt đều hiện ra y hệt nhau: "disconnected".
    -DDEBUG_ESP_PORT=Serial
    ; -DPROBE_NETWORK=1  ; bật khi cần chẩn đoán mạng, đừng để chạy thường trực

    ; ⚠️ Trần 5 giây của thư viện là quá gắt cho TLS trên ESP32-S3.
    ;
    ; Đo trên phần cứng thật 10/08: nginx LUÔN trả 101 (log xác nhận),
    ; nhưng bo lúc đọc được phản hồi lúc không — lần được thì bắt tay
    ; xong trong 0,3 giây và sống 32 giây, lần không thì im tới lúc
    ; thư viện bỏ cuộc ở đúng giây thứ 5 rồi thử lại. Kết quả là robot
    ; chỉ online khoảng 70% thời gian, và người dùng phải nói 2-3 lần
    ; mới trúng lúc nó đang nghe.
    ;
    ; Nới lên 15 giây: nếu phản hồi chỉ đến chậm thì nó kịp đến.
    -DWEBSOCKETS_TCP_TIMEOUT=15000

lib_deps =
    links2004/WebSockets@^2.6.1          ; plain RFC-6455 client → /device-ws
    bblanchon/ArduinoJson@^7.2.0         ; command + telemetry framing
    moononournation/GFX Library for Arduino@1.4.9   ; ngực ILI9488 + 2 mắt GC9A01

    ; Chặng B mới cần — chưa bật để build nhanh:
    ; earlephilhower/ESP8266Audio@^1.9.9
    ; adafruit/Adafruit NeoPixel@^1.12.3
    ; adafruit/Adafruit MPU6050@^2.2.6
    ; adafruit/Adafruit VL53L0X@^1.2.4

; ============================================================
; [env:mat-demo] — BÀN THỬ HAI MẮT, chạy độc lập
; ============================================================
;
;     pio run -e mat-demo -t upload && pio device monitor
;
; Chỉ biên dịch `eyes.cpp` + `demo_mat.cpp`. Không WiFi, không mic,
; không loa, không động cơ — nạp được ngay khi mới có hai cái màn trên
; bàn. Đấu dây ghi ở đầu `src/demo_mat.cpp`.
[env:mat-demo]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_src_filter = -<*> +<eyes.cpp> +<demo_mat.cpp>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2

lib_deps = moononournation/GFX Library for Arduino@1.4.9

; ============================================================
; [env:tim-loi] — bisect màn tròn khi nó ra sọc
; ============================================================
;
;     pio run -e tim-loi -t upload && pio device monitor
;
; Thử SÁU cấu hình SPI khác nhau trong một lần nạp, mỗi cấu hình tô bốn
; ô màu đặc. Người dùng nhìn một lần rồi báo số hiệu cấu hình nào sạch.
; Sáu lần đoán gộp thành một lượt hỏi — xem đầu `src/tim_loi_mat.cpp`.
[env:tim-loi]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_src_filter = -<*> +<tim_loi_mat.cpp>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2

lib_deps = moononournation/GFX Library for Arduino@1.4.9

; ============================================================
; [env:kiem-day] — dò từng sợi dây bằng đồng hồ đo
; ============================================================
;
;     pio run -e kiem-day -t upload && pio device monitor
;
; Kéo lần lượt từng chân lên mức cao, 6 giây một chân, đọc tên ra
; Serial. Kẹp que đo vào chân TRÊN BO MÀN rồi xem nó lên đúng lúc nào.
; Kiểm được cả chỗ cắm lẫn lõi dây — thứ mà nhìn bằng mắt không thấy.
[env:kiem-day]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_src_filter = -<*> +<kiem_day.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2

; ============================================================
; [env:tft-tron] — màn tròn chạy bằng TFT_eSPI, KHÔNG Arduino_GFX
; ============================================================
;
;     pio run -e tft-tron -t upload && pio device monitor
;
; Màn ngực 3.5" chạy ổn định trên ĐÚNG ba chân này (11/12/13) ở 20 MHz
; bằng TFT_eSPI, suốt nhiều tuần. Vậy phần cứng tải được SPI. Bản này
; lái màn TRÒN bằng cùng thư viện ấy để xem Arduino_GFX có phải thủ
; phạm không — xem đầu `src/tim_loi_tft.cpp`.
[env:tft-tron]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_src_filter = -<*> +<tim_loi_tft.cpp>

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -DUSER_SETUP_LOADED
    -DGC9A01_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_DC=13
    -DTFT_CS=-1          ; CS kéo tay trong mã
    -DTFT_RST=-1         ; RST nối 3V3
    -DLOAD_GLCD
    -DSPI_FREQUENCY=20000000
    ; ⚠️ BẮT BUỘC trên bản R8 — không có là `tft.init()` treo cứng.
    -DUSE_HSPI_PORT

lib_deps = bodmer/TFT_eSPI@^2.5.43

; ============================================================
; [env:thu-banh] — bàn kiểm hai bánh xích, không cần màn/mạng
; ============================================================
;
;     pio run -e thu-banh -t upload && pio device monitor
;
; Chạy được với đúng thứ đang có trên tay: ESP32-S3 + 2× IBT-2 + 2 động
; cơ + TP101 + nguồn 12V. Không đụng màn hình, vỏ, WiFi hay server —
; nên thử được ngay trong lúc còn chờ hàng.
;
; ⛔ VCC của IBT-2 cắm 3V3, KHÔNG PHẢI 5V. Chi tiết trong thu_banh.cpp.
;
; Việc chính của nó là lệnh `r`: đo mức PWM thấp nhất mà động cơ bứt
; được ma sát tĩnh với khối lượng robot THẬT. `DAP_MOI_MUC` trong
; banh_xe.cpp hiện là số đoán — số đo được sẽ thay vào đó.
[env:thu-banh]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; ⚠️ THIẾU HAI CỜ NÀY LÀ `Serial` ĐI RA UART0, KHÔNG RA CỔNG USB.
; Nạp vẫn xanh (esptool dùng bộ nạp ROM, luôn hiện cổng), nhưng app
; chạy rồi thì gõ phím không ai nhận và log không ai thấy — trông y
; như firmware treo. Dính đúng lỗi này 21/08/2026. Mọi env khác trong
; file đều đã có, chỉ env này viết thiếu.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
build_src_filter = -<*> +<thu_banh.cpp>
