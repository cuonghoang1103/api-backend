; ============================================================
; Mini-Me Robot — ESP32-S3-DevKitC-1 (N16R8)
; ============================================================
;
; Board choice matters here. `esp32-s3-devkitc-1` alone defaults to
; the 8 MB / no-PSRAM layout; this build needs the 16 MB flash +
; 8 MB OCTAL PSRAM variant, which is what the explicit build flags
; below select. Get this wrong and the symptom is not a compile
; error — it is `ps_malloc()` silently returning NULL at runtime and
; the audio buffer never allocating.

[env:mini-me]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 16 MB flash with an OTA-capable partition table — two app slots so
; a bad firmware push can roll back instead of bricking the robot.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; TFT_eSPI is configured by build flags rather than by editing
    ; User_Setup.h inside the library folder — that edit does not
    ; survive `pio pkg update` and is invisible to git.
    -DUSER_SETUP_LOADED
    -DGC9A01_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_DC=13
    -DTFT_RST=-1
    -DTFT_CS=10
    -DLOAD_GLCD
    -DSPI_FREQUENCY=40000000

lib_deps =
    links2004/WebSockets@^2.6.1          ; plain RFC-6455 client → /device-ws
    bblanchon/ArduinoJson@^7.2.0         ; command + telemetry framing
    earlephilhower/ESP8266Audio@^1.9.9   ; MP3 decode → I2S (works on ESP32)
    bodmer/TFT_eSPI@^2.5.43              ; the two round eyes
    adafruit/Adafruit NeoPixel@^1.12.3   ; WS2812 ring
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit VL53L0X@^1.2.4
    adafruit/Adafruit BusIO@^1.16.1

; ── Simulator-free smoke build ──
; Same sources, no upload — used to check the firmware still compiles
; in CI before anyone owns the hardware.
[env:mini-me-check]
extends = env:mini-me
targets = build
