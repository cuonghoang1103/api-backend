<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!--
    Sơ đồ nối MIC + LOA cho robot Odin. Vẽ bằng tay trong mã, KHÔNG nhờ
    máy sinh ảnh: ngày 01/10/2026 máy sinh ảnh vẽ từ prompt ra "4 5 5 7 15 15"
    thay vì "4 5 6 7 15 16" và bỏ mất cả mic lẫn ampli. Với sơ đồ nối dây,
    sai một chữ số là cắm sai một sợi.

    Nguồn sự thật: src/config.h (PIN_MIC_*, PIN_AMP_*) và shell/lap-rap.html.
    Dựng lại PDF/PNG: node shell/so-do/dung.mjs
  -->
  <rect width="1240" height="1754" fill="#ffffff"/>

  <!-- ── Đầu trang ── -->
  <text x="60" y="92" font-size="46" font-weight="800" fill="#111827">ODIN — NỐI MIC + LOA</text>
  <text x="60" y="130" font-size="21" fill="#4B5563">ESP32-S3 cắm trên shield MKE-B01 · số chân đối chiếu với config.h ngày 01/10/2026</text>
  <line x1="60" y1="152" x2="1180" y2="152" stroke="#D1D5DB" stroke-width="2"/>

  <!-- ══════════════ ① MIC ══════════════ -->
  <text x="60" y="203" font-size="32" font-weight="800" fill="#111827">① MIC INMP441</text>
  <text x="345" y="203" font-size="20" fill="#6B7280">5 dây dài + 1 dây ngắn</text>

  <rect x="200" y="225" width="270" height="415" rx="18" fill="#EAF2FF" stroke="#1E3A8A" stroke-width="3"/>
  <text x="335" y="266" font-size="26" font-weight="800" fill="#1E3A8A" text-anchor="middle">INMP441</text>
  <text x="335" y="291" font-size="17" fill="#6B7280" text-anchor="middle">micro</text>

  <rect x="870" y="225" width="310" height="380" rx="18" fill="#F9FAFB" stroke="#111827" stroke-width="3"/>
  <text x="1025" y="266" font-size="24" font-weight="800" fill="#111827" text-anchor="middle">ESP32-S3</text>
  <text x="1025" y="290" font-size="16" fill="#6B7280" text-anchor="middle">trên shield MKE-B01</text>

  <!-- dây mic -->
  <g stroke-width="7" stroke-linecap="round">
    <line x1="479" y1="340" x2="861" y2="340" stroke="#D4A106"/>
    <line x1="479" y1="395" x2="861" y2="395" stroke="#16A34A"/>
    <line x1="479" y1="450" x2="861" y2="450" stroke="#2563EB"/>
    <line x1="479" y1="505" x2="861" y2="505" stroke="#DC2626"/>
    <line x1="479" y1="560" x2="861" y2="560" stroke="#111827"/>
  </g>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="800" y="328" fill="#B8860B">vàng</text>
    <text x="800" y="383" fill="#16A34A">lục</text>
    <text x="800" y="438" fill="#2563EB">lam</text>
    <text x="800" y="493" fill="#DC2626">đỏ</text>
    <text x="800" y="548" fill="#111827">đen</text>
  </g>

  <!-- L/R chập sang GND ngay trên bo mic -->
  <path d="M479,615 H505 V560" stroke="#111827" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="505" cy="560" r="7" fill="#111827"/>
  <text x="522" y="622" font-size="17" font-weight="700" fill="#DC2626">L/R nối ngắn sang GND ngay trên bo mic — BẮT BUỘC</text>

  <!-- chân mic -->
  <g font-size="24" font-weight="800" fill="#111827" text-anchor="end">
    <text x="450" y="348">SCK</text>
    <text x="450" y="403">WS</text>
    <text x="450" y="458">SD</text>
    <text x="450" y="513">VDD</text>
    <text x="450" y="568">GND</text>
    <text x="450" y="623">L/R</text>
  </g>
  <g fill="#ffffff" stroke="#111827" stroke-width="3">
    <circle cx="470" cy="340" r="9"/><circle cx="470" cy="395" r="9"/>
    <circle cx="470" cy="450" r="9"/><circle cx="470" cy="505" r="9"/>
    <circle cx="470" cy="560" r="9"/><circle cx="470" cy="615" r="9"/>
  </g>

  <!-- chân ESP32 phía mic -->
  <g font-size="24" font-weight="800" fill="#111827">
    <text x="892" y="348">GPIO 4</text>
    <text x="892" y="403">GPIO 5</text>
    <text x="892" y="458">GPIO 6</text>
    <text x="892" y="513" fill="#DC2626">3V3</text>
    <text x="892" y="568">GND</text>
  </g>
  <text x="892" y="535" font-size="15" font-weight="700" fill="#DC2626">khối 3V3 của shield</text>
  <text x="892" y="590" font-size="15" fill="#6B7280">chân G bất kỳ</text>
  <g fill="#ffffff" stroke="#111827" stroke-width="3">
    <circle cx="870" cy="340" r="9"/><circle cx="870" cy="395" r="9"/>
    <circle cx="870" cy="450" r="9"/><circle cx="870" cy="505" r="9"/>
    <circle cx="870" cy="560" r="9"/>
  </g>

  <!-- ══════════════ ② AMPLI + LOA ══════════════ -->
  <text x="60" y="715" font-size="32" font-weight="800" fill="#111827">② AMPLI MAX98357A + LOA</text>
  <text x="520" y="715" font-size="20" fill="#6B7280">5 dây · GAIN và SD để hở</text>
  <text x="60" y="750" font-size="17" font-weight="700" fill="#B45309">⚠ Bo thường in theo thứ tự LRC · BCLK · DIN · GAIN · SD · GND · Vin — NGƯỢC với GPIO 7 · 15 · 16. Dò theo CHỮ.</text>

  <rect x="200" y="770" width="270" height="420" rx="18" fill="#F3EEFF" stroke="#5B21B6" stroke-width="3"/>
  <text x="335" y="808" font-size="26" font-weight="800" fill="#5B21B6" text-anchor="middle">MAX98357A</text>
  <text x="335" y="832" font-size="17" fill="#6B7280" text-anchor="middle">ampli</text>
  <text x="335" y="1176" font-size="15" fill="#6B7280" text-anchor="middle">cầu đấu loa</text>

  <rect x="870" y="770" width="310" height="320" rx="18" fill="#F9FAFB" stroke="#111827" stroke-width="3"/>
  <text x="1025" y="808" font-size="24" font-weight="800" fill="#111827" text-anchor="middle">ESP32-S3</text>
  <text x="1025" y="832" font-size="16" fill="#6B7280" text-anchor="middle">trên shield MKE-B01</text>

  <!-- dây ampli -->
  <g stroke-width="7" stroke-linecap="round">
    <line x1="479" y1="865" x2="861" y2="865" stroke="#7C3AED"/>
    <line x1="479" y1="910" x2="861" y2="910" stroke="#6B7280"/>
    <line x1="479" y1="955" x2="861" y2="955" stroke="#92400E"/>
    <line x1="479" y1="1000" x2="861" y2="1000" stroke="#EA580C"/>
    <line x1="479" y1="1045" x2="861" y2="1045" stroke="#111827"/>
  </g>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="800" y="853" fill="#7C3AED">tím</text>
    <text x="800" y="898" fill="#6B7280">xám</text>
    <text x="800" y="943" fill="#92400E">nâu</text>
    <text x="800" y="988" fill="#EA580C">cam</text>
    <text x="800" y="1033" fill="#111827">đen</text>
  </g>

  <!-- tụ 1000µF giữa Vin và GND, sát ampli -->
  <circle cx="560" cy="1000" r="6" fill="#111827"/>
  <circle cx="560" cy="1045" r="6" fill="#111827"/>
  <path d="M560,1000 V1015 M543,1015 H577 M543,1029 Q560,1019 577,1029 M560,1025 V1045" stroke="#111827" stroke-width="4" fill="none"/>
  <text x="583" y="1013" font-size="16" font-weight="800" fill="#111827">+</text>
  <text x="600" y="1028" font-size="15" font-weight="700" fill="#374151">tụ 1000µF (nên có)</text>

  <!-- GAIN, SD để hở -->
  <g stroke-linecap="round">
    <line x1="479" y1="1095" x2="512" y2="1095" stroke="#9CA3AF" stroke-width="5"/>
    <line x1="479" y1="1140" x2="512" y2="1140" stroke="#9CA3AF" stroke-width="5"/>
    <path d="M517,1085 L537,1105 M517,1105 L537,1085 M517,1130 L537,1150 M517,1150 L537,1130" stroke="#DC2626" stroke-width="5"/>
  </g>
  <text x="550" y="1102" font-size="20" font-weight="800" fill="#DC2626">để hở</text>
  <text x="550" y="1147" font-size="20" font-weight="800" fill="#DC2626">để hở</text>
  <text x="616" y="1147" font-size="16" fill="#6B7280">— nối GND là loa câm</text>

  <!-- chân ampli -->
  <g font-size="24" font-weight="800" fill="#111827" text-anchor="end">
    <text x="450" y="873">DIN</text>
    <text x="450" y="918">BCLK</text>
    <text x="450" y="963">LRC</text>
    <text x="450" y="1008">Vin</text>
    <text x="450" y="1053">GND</text>
    <text x="450" y="1103">GAIN</text>
    <text x="450" y="1148">SD</text>
  </g>
  <g fill="#ffffff" stroke="#111827" stroke-width="3">
    <circle cx="470" cy="865" r="9"/><circle cx="470" cy="910" r="9"/>
    <circle cx="470" cy="955" r="9"/><circle cx="470" cy="1000" r="9"/>
    <circle cx="470" cy="1045" r="9"/><circle cx="470" cy="1095" r="9"/>
    <circle cx="470" cy="1140" r="9"/>
  </g>

  <!-- chân ESP32 phía ampli -->
  <g font-size="24" font-weight="800" fill="#111827">
    <text x="892" y="873">GPIO 7</text>
    <text x="892" y="918">GPIO 15</text>
    <text x="892" y="963">GPIO 16</text>
    <text x="892" y="1008" fill="#EA580C">5V</text>
    <text x="892" y="1053">GND</text>
  </g>
  <text x="892" y="1030" font-size="15" font-weight="700" fill="#EA580C">hàng 5V của shield</text>
  <text x="892" y="1075" font-size="15" fill="#6B7280">chân G bất kỳ</text>
  <g fill="#ffffff" stroke="#111827" stroke-width="3">
    <circle cx="870" cy="865" r="9"/><circle cx="870" cy="910" r="9"/>
    <circle cx="870" cy="955" r="9"/><circle cx="870" cy="1000" r="9"/>
    <circle cx="870" cy="1045" r="9"/>
  </g>

  <!-- loa -->
  <rect x="282" y="1184" width="16" height="12" fill="#111827"/>
  <rect x="372" y="1184" width="16" height="12" fill="#111827"/>
  <line x1="290" y1="1196" x2="290" y2="1240" stroke="#DB2777" stroke-width="7" stroke-linecap="round"/>
  <line x1="380" y1="1196" x2="380" y2="1240" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
  <text x="272" y="1226" font-size="18" font-weight="800" fill="#DB2777" text-anchor="end">+ hồng</text>
  <text x="396" y="1226" font-size="18" font-weight="800"><tspan fill="#0D9488">− xanh ngọc</tspan><tspan fill="#DC2626"> · KHÔNG nối GND</tspan></text>
  <rect x="240" y="1240" width="190" height="56" rx="12" fill="#F9FAFB" stroke="#374151" stroke-width="3"/>
  <circle cx="272" cy="1268" r="16" fill="none" stroke="#374151" stroke-width="3"/>
  <circle cx="272" cy="1268" r="6" fill="#374151"/>
  <text x="350" y="1276" font-size="22" font-weight="800" fill="#374151" text-anchor="middle">LOA ⌀65</text>

  <!-- ══════════════ Nhớ kỹ ══════════════ -->
  <rect x="60" y="1318" width="1120" height="282" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>
  <text x="88" y="1356" font-size="24" font-weight="800" fill="#B91C1C">NHỚ KỸ TRƯỚC KHI CẮM ĐIỆN</text>
  <g font-size="19" fill="#111827">
    <text x="88" y="1394">⛔  Mic chỉ dùng 3V3. Cấp 5V là chết mic.</text>
    <text x="88" y="1425">⛔  Chỉ ampli dùng 5V — lấy ở hàng 5V của shield.</text>
    <text x="88" y="1456">⛔  Dây − của loa đi thẳng vào loa, không bao giờ nối GND.</text>
    <text x="88" y="1487">⚠  3V3 lấy ở KHỐI 3V3 của shield (góc trên phải), không lấy chân 3V3 của ESP32.</text>
    <text x="88" y="1518">⚠  L/R của mic để hở = mic câm.   SD của ampli nối GND = loa câm.</text>
    <text x="88" y="1549">⚠  SD để hở mà loa vẫn câm, chip nguội → nối SD vào 3V3 (firmware phát cùng tiếng ra cả 2 kênh).</text>
    <text x="88" y="1580">⚠  Tụ 1000µF: chân dài (+) vào Vin, chân có sọc (−) vào GND. Cắm ngược là phồng, nổ.</text>
  </g>

  <!-- ══════════════ Thử ══════════════ -->
  <rect x="60" y="1615" width="1120" height="110" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="88" y="1648" font-size="20" font-weight="800" fill="#111827">THỬ SAU KHI NỐI — adapter 12V vào jack shield, cắm thêm USB</text>
  <text x="88" y="1680" font-size="17" fill="#111827" font-family="Menlo, Courier New, monospace">cd firmware/mini-me-robot/test  →  pio run -e test -t upload &amp;&amp; pio device monitor</text>
  <text x="88" y="1708" font-size="17" fill="#111827">gõ 1 = mic (cột # dài ra khi nói)  ·  2 = loa (nghe 5 nốt)  ·  5 = loa-bằng-mic (báo ✅ LOA KÊU THẬT)</text>

  <text x="60" y="1745" font-size="14" fill="#6B7280">Vị trí chân trên hình là minh hoạ — luôn cắm theo CHỮ in trên bo.  ·  Odin · 01/10/2026</text>
</svg>
