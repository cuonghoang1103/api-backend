; Bàn kiểm linh kiện — nạp cái này TRƯỚC firmware thật.
;
; Tách riêng khỏi firmware chính để chạy được ngay cả khi bo chưa có
; đủ linh kiện: nó không cần động cơ, không cần WiFi có mật khẩu.
;
; BA môi trường:
;   test           — không có màn hình (nhanh nhất, dùng khi chỉ kiểm bo/mic/loa)
;   test-ili9488   — màn 3.5" chip ILI9488  ← thử cái này TRƯỚC
;   test-st7796    — màn 3.5" chip ST7796   ← nếu cái trên ra màn trắng
;
; Không đọc được ID chip qua SPI vì chân MISO để trống, nên phải thử.

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; qio_opi = PSRAM octal (bản N16R8). Bo N8R2 (PSRAM quad) thì đổi
; thành qio_qspi, nếu không `psramFound()` trả false dù có PSRAM thật.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2

; ── Không màn hình ──
[env:test]
build_flags = ${env.build_flags}
lib_deps =

; ── Cấu hình chung cho màn 3.5" SPI ──
; TFT_eSPI cấu hình bằng build flag chứ không sửa User_Setup.h trong
; thư mục thư viện: sửa file đó không sống sót qua `pio pkg update` và
; git không thấy được.
[tft]
common_flags =
    -DUSER_SETUP_LOADED
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    ; ⚠️ −1 chứ KHÔNG phải 14. Bàn kiểm này viết cho giai đoạn 0, lúc
    ; trên bo mới chỉ có màn 3.5" và GPIO 14 còn rảnh. Từ 15/08/2026
    ; GPIO 14 là **CS của MẮT PHẢI** (`PIN_EYE_CS_R` trong src/config.h),
    ; và RST cả ba màn nối cứng 3V3, reset bằng lệnh mềm 0x01.
    ; Giữ 14 ở đây thì mỗi lần bàn kiểm reset màn 3.5" là nó kéo luôn
    ; chân chọn chip của mắt phải — kết quả đo không tin được.
    -DTFT_RST=-1
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    ; 20 MHz để bắt đầu: dây Dupont dài đủ sinh nhiễu ở tốc độ cao,
    ; biểu hiện là màn hiện sọc. Chạy được rồi hãy tăng dần.
    -DSPI_FREQUENCY=20000000
    ; ⚠️ BẮT BUỘC trên ESP32-S3 bản R8: không chỉ định bus thì TFT_eSPI
    ; chọn bus mặc định có chân trùng GPIO 33–37 — vốn đã bị PSRAM
    ; octal chiếm. Kết quả là `tft.init()` TREO CỨNG, không lỗi, không
    ; timeout, chỉ đứng im giữa chừng.
    -DUSE_HSPI_PORT
    -DHAS_TFT=1

[env:test-ili9488]
build_flags = ${env.build_flags} ${tft.common_flags} -DILI9488_DRIVER
lib_deps = bodmer/TFT_eSPI@^2.5.43

[env:test-st7796]
build_flags = ${env.build_flags} ${tft.common_flags} -DST7796_DRIVER
lib_deps = bodmer/TFT_eSPI@^2.5.43
