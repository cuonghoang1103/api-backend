; Bàn kiểm linh kiện — nạp cái này TRƯỚC firmware thật.
;
; Tách riêng khỏi firmware chính để chạy được ngay cả khi bo chưa có
; đủ linh kiện: nó không cần màn hình, không cần động cơ, không cần
; WiFi có mật khẩu.

[env:test]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; qio_opi = PSRAM octal (bản N16R8). Nếu bo của bạn là N8R2 (PSRAM
; quad) thì đổi thành qio_qspi, nếu không `psramFound()` sẽ trả false
; dù chip có PSRAM thật.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2

; Không thư viện ngoài — chỉ dùng những gì Arduino-ESP32 có sẵn, để
; lần nạp đầu tiên không phụ thuộc mạng.
lib_deps =
