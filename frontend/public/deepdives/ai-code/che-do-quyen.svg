<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 344" width="700" height="344" role="img" aria-label="Năm chế độ quyền của AI Code: Kế hoạch chỉ đọc; Hỏi từng việc thì sửa tệp, lệnh thường và lệnh nguy hiểm đều hỏi; Tự nhận sửa file thì sửa tệp tự chạy còn lệnh vẫn hỏi; Tự nhận cả lệnh an toàn thì chỉ lệnh cần kiểm và nguy hiểm còn hỏi; Bỏ qua tất cả thì không hỏi gì, phải qua cửa xác nhận và không bao giờ được làm mặc định">
