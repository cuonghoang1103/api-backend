  <text x="40" y="369" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">BACKEND · Express — KHÔNG giữ trạng thái</text>
  <text x="40" y="392" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#fcd34d">POST /api/v1/agent/turn</text>
  <text x="40" y="413" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">khai 46 tool theo khả năng app gửi · tự chạy 5 tool</text>
  <text x="40" y="433" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">danh sách trắng model · trần bước · ví 5 giờ</text>

  <!-- ── Ngoại tuyến ──────────────────────────────────────── -->
