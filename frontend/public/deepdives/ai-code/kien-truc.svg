  <line x1="200" y1="278" x2="200" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#mui)"/>
  <text x="212" y="304" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">HTTPS · SSE</text>
  <text x="212" y="322" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">gửi TOÀN BỘ hội thoại mỗi lượt</text>

  <line x1="568" y1="278" x2="568" y2="340" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#mui)"/>
