  <text x="260" y="224" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">phân loại lệnh 3 mức</text>
  <text x="260" y="244" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">5 chế độ quyền · hook</text>

  <rect x="456" y="160" width="204" height="102" rx="6" fill="#0d1424" stroke="#a78bfa"/>
  <text x="468" y="182" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">Cắm thêm</text>
  <text x="468" y="204" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">MCP: ≤5 server, ≤40 tool</text>
  <text x="468" y="224" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">kỹ năng · bộ nhớ bài học</text>
  <text x="468" y="244" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">PATH thật từ shell</text>

