<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="700" height="580" role="img" aria-label="Kiến trúc AI Code: renderer chỉ vẽ sự kiện; main process của Electron giữ vòng lặp agent, chạy 41 tool trên máy cùng các chốt an toàn và MCP; backend Express không giữ trạng thái, nhận toàn bộ hội thoại mỗi lượt qua SSE, khai 46 tool và áp danh sách trắng model, trần bước, ví 5 giờ; backend gọi cổng riêng cho agent hoặc cổng LLM chính khi cổng riêng sập; khi mất mạng main nói thẳng với llama-server trên máy">
  <defs>
    <marker id="mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="580" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="579" rx="12" fill="none" stroke="#1e293b"/>

  <!-- ── Renderer ─────────────────────────────────────────── -->
  <rect x="24" y="24" width="652" height="64" rx="8" fill="#0a1120" stroke="#334155"/>
  <text x="40" y="49" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">RENDERER · giao diện React</text>
  <text x="40" y="72" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">chỉ VẼ sự kiện: chữ chảy, dòng tool, thẻ duyệt diff/lệnh — không tham gia vòng lặp</text>

  <line x1="350" y1="88" x2="350" y2="116" stroke="#64748b" stroke-width="1.5" marker-end="url(#mui)"/>
  <text x="362" y="107" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">IPC</text>

  <!-- ── Main process ─────────────────────────────────────── -->
  <rect x="24" y="120" width="652" height="158" rx="8" fill="#0a1120" stroke="#22d3ee"/>
  <text x="40" y="145" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">MAIN PROCESS · Electron/Node — vòng lặp agent</text>
  <text x="660" y="145" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#22d3ee">loop.ts</text>

  <rect x="40" y="160" width="196" height="102" rx="6" fill="#0d1424" stroke="#4ade80"/>
  <text x="52" y="182" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#4ade80">41 tool chạy trên máy</text>
  <text x="52" y="204" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">đọc/sửa tệp · git</text>
  <text x="52" y="224" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">lệnh · lệnh nền · PTY</text>
  <text x="52" y="244" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">trình duyệt (9 tool)</text>

  <rect x="248" y="160" width="196" height="102" rx="6" fill="#0d1424" stroke="#fb923c"/>
