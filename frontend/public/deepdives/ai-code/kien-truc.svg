  <text x="480" y="392" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#fcd34d">llama-server</text>
  <text x="480" y="413" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">chạy trên chính máy bạn</text>
  <text x="480" y="433" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">cùng bộ tool, cùng luật</text>

  <line x1="170" y1="454" x2="170" y2="490" stroke="#64748b" stroke-width="1.5" marker-end="url(#mui)"/>
  <line x1="400" y1="454" x2="400" y2="490" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#mui)"/>

  <!-- ── Hai cổng ─────────────────────────────────────────── -->
  <rect x="24" y="494" width="310" height="66" rx="8" fill="#0a1120" stroke="#4ade80"/>
  <text x="40" y="519" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Cổng riêng cho agent</text>
  <text x="40" y="542" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">giao thức Anthropic · 8 model Claude</text>

  <rect x="346" y="494" width="330" height="66" rx="8" fill="#0a1120" stroke="#fb923c"/>
  <text x="362" y="519" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Cổng LLM chính — khi cổng riêng sập</text>
  <text x="362" y="542" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">cần vé mật khẩu · gpt-6-sol / gpt-6-astra</text>
