<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" role="img" aria-label="Vòng lặp gọi tool của AI Code: người dùng giao việc; main gửi toàn bộ hội thoại lên máy chủ; máy chủ gọi model và chảy chữ về, tự chạy tool vòng máy chủ; khung done mang một trong bốn giá trị stop: end thì chạy hook xong lượt rồi báo xong, max_steps thì dừng ở trần của mức nỗ lực, continue thì gọi lại ngay, tool_calls thì qua hook trước tool, phân loại và thẻ duyệt, chạy tool trên máy, nối kết quả rồi gọi lại">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="540" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="539" rx="12" fill="none" stroke="#1e293b"/>

  <!-- 1 -->
  <rect x="96" y="20" width="320" height="40" rx="6" fill="#0a1120" stroke="#334155"/>
  <text x="112" y="45" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Bạn giao một việc</text>
  <line x1="256" y1="60" x2="256" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#m1)"/>

  <!-- 2 -->
  <rect x="96" y="84" width="320" height="56" rx="6" fill="#0a1120" stroke="#22d3ee"/>
  <text x="112" y="106" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">main gửi TOÀN BỘ hội thoại lên</text>
  <text x="112" y="127" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#fcd34d">POST /api/v1/agent/turn</text>
  <line x1="256" y1="140" x2="256" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#m1)"/>

  <!-- 3 -->
  <rect x="96" y="164" width="320" height="74" rx="6" fill="#0a1120" stroke="#334155"/>
  <text x="112" y="186" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">máy chủ gọi model, chữ chảy về</text>
  <text x="112" y="207" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">tool vòng máy chủ (tim_web, notes_read…):</text>
  <text x="112" y="225" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">máy chủ tự chạy rồi gọi model lại</text>
  <line x1="256" y1="238" x2="256" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#m1)"/>

  <!-- 4 -->
  <rect x="96" y="262" width="320" height="42" rx="6" fill="#0a1120" stroke="#fcd34d"/>
  <text x="112" y="288" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#fcd34d">done · stop = ?</text>

  <!-- end -->
  <path d="M416,274 L432,274 L432,232 L442,232" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#mg)"/>
  <rect x="446" y="200" width="230" height="64" rx="6" fill="#0a1120" stroke="#4ade80"/>
  <text x="462" y="222" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#4ade80">'end'</text>
  <text x="462" y="242" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">hook xongLuot chạy TRƯỚC,</text>
  <text x="462" y="258" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">rồi mới báo “xong”</text>

  <!-- max_steps -->
  <path d="M416,292 L432,292 L432,318 L442,318" fill="none" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#mr)"/>
  <rect x="446" y="286" width="230" height="64" rx="6" fill="#0a1120" stroke="#f43f5e"/>
  <text x="462" y="308" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f43f5e">'max_steps'</text>
  <text x="462" y="328" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">chạm trần của mức nỗ lực</text>
  <text x="462" y="344" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">8·30·60·100·160·260</text>

  <!-- tool_calls xuống -->
  <line x1="256" y1="304" x2="256" y2="334" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#mc)"/>
  <text x="266" y="324" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#22d3ee">'tool_calls'</text>

  <!-- 5 -->
  <rect x="96" y="338" width="320" height="68" rx="6" fill="#0a1120" stroke="#fb923c"/>
  <text x="112" y="360" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">hook trước tool → phân loại → duyệt</text>
  <text x="112" y="380" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">thẻ duyệt hiện diff hoặc nguyên văn lệnh;</text>
  <text x="112" y="396" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">bị từ chối ⇒ lý do đi vào hội thoại</text>
  <line x1="256" y1="406" x2="256" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#m1)"/>

  <!-- 6 -->
  <rect x="96" y="424" width="320" height="54" rx="6" fill="#0a1120" stroke="#22d3ee"/>
  <text x="112" y="446" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">chạy tool trên máy, nối kết quả</text>
  <text x="112" y="466" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#fcd34d">{ role: 'tool', tool_call_id, … }</text>

  <!-- vòng về: tool_calls (lơ) -->
  <path d="M96,451 L76,451 L76,120 L92,120" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#mc)"/>
  <!-- continue (vàng) -->
  <path d="M96,283 L52,283 L52,100 L92,100" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#my)"/>

  <!-- chú giải -->
  <line x1="446" y1="396" x2="476" y2="396" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="484" y="400" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">chạy tool rồi gọi lại</text>
  <line x1="446" y1="420" x2="476" y2="420" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="484" y="424" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#fcd34d">'continue'</text>
  <text x="484" y="440" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">không có gì để chạy,</text>
  <text x="484" y="456" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">gọi lại ngay</text>

  <text x="24" y="510" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Lưới đỡ phía app: tối đa 320 vòng, lớn hơn mọi trần của máy chủ. Trần thật là trần bước</text>
  <text x="24" y="528" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">của máy chủ — đếm từ câu bạn gõ gần nhất, không phải từ đầu cuộc trò chuyện.</text>
</svg>
