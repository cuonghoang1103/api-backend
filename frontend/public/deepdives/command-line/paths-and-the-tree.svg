<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 404" width="700" height="404" role="img" aria-label="A filesystem tree from root down to words.txt, and the four ways to write a path to it">
  <rect width="700" height="404" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="403" rx="12" fill="none" stroke="#1e293b"/>

  <text x="28" y="32" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">One file. Three ways to name it.</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14">
    <text x="28" y="64" fill="#94a3b8">/</text>
    <text x="50" y="90" fill="#475569">├──</text>
    <text x="86" y="90" fill="#94a3b8">etc/</text>
    <text x="50" y="116" fill="#475569">├──</text>
    <text x="86" y="116" fill="#94a3b8">usr/</text>
    <text x="50" y="142" fill="#475569">└──</text>
    <text x="86" y="142" fill="#94a3b8">Users/</text>
    <text x="108" y="168" fill="#475569">└──</text>
    <text x="144" y="168" fill="#fb923c">admin/</text>
    <text x="232" y="168" fill="#475569">←</text>
    <text x="254" y="168" fill="#fb923c">~</text>
    <text x="166" y="194" fill="#475569">├──</text>
    <text x="202" y="194" fill="#94a3b8">Downloads/</text>
    <text x="166" y="220" fill="#475569">└──</text>
    <text x="202" y="220" fill="#22d3ee">project/</text>
    <text x="298" y="220" fill="#475569">←</text>
    <text x="320" y="220" fill="#22d3ee">you are here</text>
    <text x="224" y="246" fill="#475569">├──</text>
    <text x="260" y="246" fill="#94a3b8">deploy.sh</text>
    <text x="224" y="272" fill="#475569">└──</text>
    <text x="260" y="272" fill="#94a3b8">src/</text>
    <text x="282" y="298" fill="#475569">└──</text>
    <text x="318" y="298" fill="#4ade80">words.txt</text>
  </g>

  <line x1="28" y1="320" x2="672" y2="320" stroke="#1e293b"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="13.5" fill="#4ade80">
    <text x="28" y="346">/Users/admin/project/src/words.txt</text>
    <text x="28" y="368">~/project/src/words.txt</text>
    <text x="28" y="390">src/words.txt</text>
  </g>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#64748b">
    <text x="326" y="346">absolute — starts at /</text>
    <text x="326" y="368">absolute — ~ is your home</text>
    <text x="326" y="390">relative — from where you stand</text>
  </g>
</svg>
