<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-label="AES chia dữ liệu thành khối 16 byte rồi chạy 14 vòng biến đổi, mỗi vòng gồm bốn bước thay thế byte, dịch hàng, trộn cột và cộng khoá vòng">
  <rect width="700" height="380" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="379" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="28" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">AES-256 chia dữ liệu thành khối 16 byte, rồi chạy <tspan fill="#e2e8f0">14 vòng</tspan> biến đổi lên từng khối.</text>

  <!-- input block 4x4 -->
  <text x="24" y="58" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">khối 16 byte</text>
  <g stroke="#334155" fill="#111c30">
    <rect x="24" y="68" width="26" height="26" rx="3"/><rect x="52" y="68" width="26" height="26" rx="3"/>
    <rect x="80" y="68" width="26" height="26" rx="3"/><rect x="108" y="68" width="26" height="26" rx="3"/>
    <rect x="24" y="96" width="26" height="26" rx="3"/><rect x="52" y="96" width="26" height="26" rx="3"/>
    <rect x="80" y="96" width="26" height="26" rx="3"/><rect x="108" y="96" width="26" height="26" rx="3"/>
    <rect x="24" y="124" width="26" height="26" rx="3"/><rect x="52" y="124" width="26" height="26" rx="3"/>
    <rect x="80" y="124" width="26" height="26" rx="3"/><rect x="108" y="124" width="26" height="26" rx="3"/>
    <rect x="24" y="152" width="26" height="26" rx="3"/><rect x="52" y="152" width="26" height="26" rx="3"/>
    <rect x="80" y="152" width="26" height="26" rx="3"/><rect x="108" y="152" width="26" height="26" rx="3"/>
  </g>
  <text x="79" y="196" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#64748b">4 × 4 byte</text>

  <path d="M142 123 L176 123" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- one round: 4 steps stacked, description right-aligned inside the panel -->
  <rect x="184" y="56" width="330" height="164" rx="8" fill="#0a1120" stroke="#22d3ee"/>
  <text x="198" y="76" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">MỘT VÒNG — 4 bước</text>

  <rect x="196" y="84" width="306" height="28" rx="5" fill="#111c30" stroke="#334155"/>
  <text x="206" y="102" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#e2e8f0">1 · SubBytes</text>
  <text x="492" y="102" text-anchor="end" font-family="ui-sans-serif, sans-serif" font-size="10.5" fill="#64748b">thay từng byte qua bảng tra</text>

  <rect x="196" y="116" width="306" height="28" rx="5" fill="#111c30" stroke="#334155"/>
  <text x="206" y="134" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#e2e8f0">2 · ShiftRows</text>
  <text x="492" y="134" text-anchor="end" font-family="ui-sans-serif, sans-serif" font-size="10.5" fill="#64748b">dịch các hàng sang trái</text>

  <rect x="196" y="148" width="306" height="28" rx="5" fill="#111c30" stroke="#334155"/>
  <text x="206" y="166" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#e2e8f0">3 · MixColumns</text>
  <text x="492" y="166" text-anchor="end" font-family="ui-sans-serif, sans-serif" font-size="10.5" fill="#64748b">trộn các cột với nhau</text>

  <rect x="196" y="180" width="306" height="28" rx="5" fill="#1c1a10" stroke="#fcd34d"/>
  <text x="206" y="198" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#fcd34d">4 · AddRoundKey</text>
  <text x="492" y="198" text-anchor="end" font-family="ui-sans-serif, sans-serif" font-size="10.5" fill="#94a3b8">XOR với khoá của vòng này</text>

  <!-- loop arrow -->
  <path d="M420 220 C420 244, 260 244, 260 222" stroke="#22d3ee" stroke-width="1.5" fill="none" marker-end="url(#arc)"/>
  <text x="340" y="258" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#22d3ee">lặp 14 lần</text>

  <path d="M522 123 L556 123" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- output: scrambled -->
  <g stroke="#334155">
    <rect x="564" y="68" width="26" height="26" rx="3" fill="#1e3a5f"/><rect x="592" y="68" width="26" height="26" rx="3" fill="#3b2f4a"/>
    <rect x="620" y="68" width="26" height="26" rx="3" fill="#14352c"/><rect x="648" y="68" width="26" height="26" rx="3" fill="#4a2f2f"/>
    <rect x="564" y="96" width="26" height="26" rx="3" fill="#3b2f4a"/><rect x="592" y="96" width="26" height="26" rx="3" fill="#14352c"/>
    <rect x="620" y="96" width="26" height="26" rx="3" fill="#4a3f1f"/><rect x="648" y="96" width="26" height="26" rx="3" fill="#1e3a5f"/>
    <rect x="564" y="124" width="26" height="26" rx="3" fill="#14352c"/><rect x="592" y="124" width="26" height="26" rx="3" fill="#4a2f2f"/>
    <rect x="620" y="124" width="26" height="26" rx="3" fill="#1e3a5f"/><rect x="648" y="124" width="26" height="26" rx="3" fill="#3b2f4a"/>
    <rect x="564" y="152" width="26" height="26" rx="3" fill="#4a3f1f"/><rect x="592" y="152" width="26" height="26" rx="3" fill="#1e3a5f"/>
    <rect x="620" y="152" width="26" height="26" rx="3" fill="#3b2f4a"/><rect x="648" y="152" width="26" height="26" rx="3" fill="#14352c"/>
  </g>
  <text x="619" y="196" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#4ade80">bản mã</text>

  <!-- measured footer -->
  <rect x="24" y="274" width="652" height="86" rx="6" fill="#0a1120" stroke="#334155"/>
  <text x="38" y="296" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">đo thật — vì sao không lần ngược được</text>
  <text x="38" y="318" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">Sau 14 vòng, quan hệ thống kê giữa đầu vào và đầu ra biến mất hoàn toàn:</text>
  <text x="38" y="338" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e2e8f0">entropy bản mã  = 7.9928 / 8.0   ← gần như ngẫu nhiên tuyệt đối</text>
  <text x="38" y="354" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e2e8f0">đổi 1 bit đầu vào → 50.04% số bit đầu ra đổi theo  (đo 2000 lần)</text>

  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#334155"/></marker>
    <marker id="arc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#22d3ee"/></marker>
  </defs>
</svg>
