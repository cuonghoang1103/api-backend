<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 344" width="700" height="344" role="img" aria-label="The box model measured: content-box makes width:200 occupy 250px while border-box keeps it at 200, percentages always resolve against the containing width, and width:auto means fill for a block but fit for an inline-block">
  <rect width="700" height="344" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="343" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">width: 200px · padding: 20px · border: 5px — the same three declarations, two boxes.</text>

  <!-- content-box -->
  <text x="24" y="54" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">box-sizing: content-box → occupies 250px</text>
  <rect x="24" y="62" width="250" height="60" fill="none" stroke="#f43f5e" stroke-dasharray="3 3"/>
  <rect x="29" y="67" width="240" height="50" fill="#1a2334" stroke="#f43f5e"/>
  <rect x="49" y="82" width="200" height="20" fill="#26334d" stroke="#94a3b8"/>
  <text x="149" y="97" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e2e8f0">content 200</text>
  <text x="24" y="138" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">border 5 · padding 20 · content 200 · padding 20 · border 5</text>

  <!-- border-box -->
  <text x="356" y="54" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">box-sizing: border-box → occupies 200px</text>
  <rect x="356" y="62" width="200" height="60" fill="none" stroke="#4ade80" stroke-dasharray="3 3"/>
  <rect x="361" y="67" width="190" height="50" fill="#1a2334" stroke="#4ade80"/>
  <rect x="381" y="82" width="150" height="20" fill="#26334d" stroke="#94a3b8"/>
  <text x="456" y="97" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e2e8f0">content 150</text>
  <text x="356" y="138" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">content shrinks to fit — the box stays 200</text>

  <!-- computed style warning -->
  <rect x="24" y="152" width="652" height="40" rx="6" fill="#0a1120" stroke="#fcd34d"/>
  <text x="38" y="177" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">getComputedStyle().width says 200px for BOTH — use offsetWidth (250 / 200)</text>

  <!-- percentages -->
  <rect x="24" y="204" width="320" height="60" rx="6" fill="#0a1120" stroke="#22d3ee"/>
  <text x="38" y="226" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">% always resolves against WIDTH</text>
  <text x="38" y="248" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">parent 400×100 · padding-top:10% → 40px</text>

  <!-- width auto -->
  <rect x="356" y="204" width="320" height="60" rx="6" fill="#0a1120" stroke="#a78bfa"/>
  <text x="370" y="226" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#a78bfa">width: auto means two things</text>
  <text x="370" y="248" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">block fills 300 · inline-block fits 42</text>

  <!-- inline ignores -->
  <rect x="24" y="276" width="652" height="52" rx="6" fill="#0a1120" stroke="#fb923c"/>
  <text x="38" y="298" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fb923c">display: inline ignores width and height completely</text>
  <text x="38" y="318" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">declared 200×80 → measured 50.58×16.5, and computed width still reports 200px</text>
</svg>
