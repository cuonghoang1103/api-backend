<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-label="Sáu đường ghi thẻ khác nhau (REST, sửa hàng loạt, MCP, Ask AI, luật tự động, bàn giao) đều đi qua một hàm applyIssueChange gồm bảy bước kiểm, rồi sau commit mới phát sự kiện ra socket, chuông, luật tự động và hộp thư agent.">
  <rect width="700" height="372" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="371" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="34" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">AI GHI THẺ</text>
  <text x="236" y="34" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#4ade80" letter-spacing="1">MỘT CỬA</text>
  <text x="520" y="34" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">SAU COMMIT</text>

  <!-- bên gọi -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#e2e8f0">
    <rect x="24" y="50" width="196" height="32" rx="6" fill="#0a1120" stroke="#334155"/>
    <text x="36" y="71">REST · kéo thẻ, sửa trường</text>
    <rect x="24" y="90" width="196" height="32" rx="6" fill="#0a1120" stroke="#334155"/>
    <text x="36" y="111">Sửa hàng loạt (bulk)</text>
    <rect x="24" y="130" width="196" height="32" rx="6" fill="#0a1120" stroke="#a78bfa"/>
    <text x="36" y="151">MCP · agent bên ngoài</text>
    <rect x="24" y="170" width="196" height="32" rx="6" fill="#0a1120" stroke="#334155"/>
    <text x="36" y="191">Ask AI · người bấm Apply</text>
    <rect x="24" y="210" width="196" height="32" rx="6" fill="#0a1120" stroke="#334155"/>
    <text x="36" y="231">Luật tự động (SYSTEM)</text>
    <rect x="24" y="250" width="196" height="32" rx="6" fill="#0a1120" stroke="#334155"/>
    <text x="36" y="271">Bàn giao · service desk</text>
  </g>
  <g stroke="#334155" stroke-width="1.3" fill="none">
    <path d="M 220 66 L 236 140"/><path d="M 220 106 L 236 150"/><path d="M 220 146 L 236 160"/>
    <path d="M 220 186 L 236 170"/><path d="M 220 226 L 236 180"/><path d="M 220 266 L 236 190"/>
  </g>

  <!-- cửa -->
  <rect x="236" y="50" width="270" height="232" rx="8" fill="#0a1120" stroke="#4ade80"/>
  <text x="250" y="76" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#fcd34d">applyIssueChange()</text>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">
    <text x="250" y="104">1. chuẩn hoá actor: agent ⇒ AGENT</text>
    <text x="250" y="128">2. SELECT … FOR UPDATE khoá thẻ</text>
    <text x="250" y="152">3. trạng thái thuộc đúng quy trình?</text>
    <text x="250" y="176" fill="#fb923c">4. agent xin Done ⇒ đổi sang Review</text>
    <text x="250" y="200">5. luật chuyển + Done rules</text>
    <text x="250" y="224">6. ghi lịch sử từng trường</text>
    <text x="250" y="248">7. sai version ⇒ 409 Conflict</text>
  </g>
  <text x="250" y="272" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">tất cả trong một transaction</text>

  <g stroke="#4ade80" stroke-width="1.3" fill="none" stroke-dasharray="4 3">
    <path d="M 506 120 L 520 82"/><path d="M 506 140 L 520 124"/><path d="M 506 160 L 520 166"/><path d="M 506 180 L 520 208"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#e2e8f0">
    <rect x="520" y="66" width="156" height="32" rx="6" fill="#0a1120" stroke="#334155"/>
    <text x="530" y="87">Phòng Socket.IO</text>
    <rect x="520" y="108" width="156" height="32" rx="6" fill="#0a1120" stroke="#334155"/>
    <text x="530" y="129">Chuông + email</text>
    <rect x="520" y="150" width="156" height="32" rx="6" fill="#0a1120" stroke="#334155"/>
    <text x="530" y="171">Luật tự động</text>
    <rect x="520" y="192" width="156" height="32" rx="6" fill="#0a1120" stroke="#a78bfa"/>
    <text x="530" y="213">Hộp thư agent (SSE)</text>
  </g>

  <line x1="24" y1="302" x2="676" y2="302" stroke="#1e293b"/>
  <text x="24" y="326" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#94a3b8">Sửa trường và chuyển trạng thái từ mọi đường gọi đều qua đây — nên chúng không lệch luật nhau.</text>
  <text x="24" y="348" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Ngoại lệ đo được: 29 lệnh ghi hẹp ở 12 tệp khác (xoá mềm, chia sẻ khách, ghi giờ, đóng sprint…).</text>
</svg>
