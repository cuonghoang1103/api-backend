<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="700" height="410" role="img" aria-label="Biểu đồ cột: số dòng mã thêm vào CT Work theo bảy giai đoạn từ 23/09 đến 13/10/2026, kèm số commit mỗi giai đoạn. Hai đỉnh lớn là 23-24/09 và 10/10; các giai đoạn dùng thật và sửa lỗi thêm rất ít dòng.">
  <rect width="700" height="410" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="409" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="34" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="1">21 NGÀY · 113 COMMIT · DÒNG MÃ THÊM VÀO THEO GIAI ĐOẠN</text>
  <text x="24" y="54" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">chiều cao cột = số dòng thêm (git log --numstat); dưới cột = ngày, số commit, việc chính</text>

  <line x1="40" y1="252" x2="680" y2="252" stroke="#334155"/>

  <!-- cột: baseline 252, 95,8k = 170px -->
  <rect x="60" y="167" width="52" height="85" rx="3" fill="#22d3ee"/>
  <text x="86" y="159" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e2e8f0">48,0k</text>

  <rect x="151" y="246" width="52" height="6" rx="2" fill="#4ade80"/>
  <text x="177" y="238" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e2e8f0">3,2k</text>

  <rect x="243" y="186" width="52" height="66" rx="3" fill="#a78bfa"/>
  <text x="269" y="178" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e2e8f0">37,1k</text>

  <rect x="334" y="238" width="52" height="14" rx="2" fill="#4ade80"/>
  <text x="360" y="230" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e2e8f0">7,7k</text>

  <rect x="425" y="153" width="52" height="99" rx="3" fill="#fb923c"/>
  <text x="451" y="145" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e2e8f0">55,7k</text>

  <rect x="517" y="82" width="52" height="170" rx="3" fill="#fb923c"/>
  <text x="543" y="74" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e2e8f0">95,8k</text>

  <rect x="600" y="246" width="52" height="6" rx="2" fill="#4ade80"/>
  <text x="626" y="238" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e2e8f0">3,6k</text>

  <!-- nhãn dưới -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">
    <text x="86" y="274" font-family="ui-monospace, Menlo, monospace" fill="#e2e8f0">23–24/09</text>
    <text x="86" y="292" fill="#94a3b8">34 commit</text>
    <text x="86" y="310" fill="#64748b">đợt 0–8:</text>
    <text x="86" y="326" fill="#64748b">Jira + Xray</text>

    <text x="177" y="274" font-family="ui-monospace, Menlo, monospace" fill="#e2e8f0">25/09–02/10</text>
    <text x="177" y="292" fill="#94a3b8">12 commit</text>
    <text x="177" y="310" fill="#64748b">dùng thử,</text>
    <text x="177" y="326" fill="#64748b">sửa lỗi</text>

    <text x="269" y="274" font-family="ui-monospace, Menlo, monospace" fill="#e2e8f0">03–05/10</text>
    <text x="269" y="292" fill="#94a3b8">12 commit</text>
    <text x="269" y="310" fill="#64748b">lớp studio</text>
    <text x="269" y="326" fill="#64748b">S1–S6</text>

    <text x="360" y="274" font-family="ui-monospace, Menlo, monospace" fill="#e2e8f0">06–08/10</text>
    <text x="360" y="292" fill="#94a3b8">4 commit</text>
    <text x="360" y="310" fill="#64748b">dùng thật,</text>
    <text x="360" y="326" fill="#64748b">agent GĐ1</text>

    <text x="451" y="274" font-family="ui-monospace, Menlo, monospace" fill="#e2e8f0">09/10</text>
    <text x="451" y="292" fill="#94a3b8">12 commit</text>
    <text x="451" y="310" fill="#64748b">MCP, mẫu FPT,</text>
    <text x="451" y="326" fill="#64748b">chat, sơ đồ</text>

    <text x="543" y="274" font-family="ui-monospace, Menlo, monospace" fill="#e2e8f0">10/10</text>
    <text x="543" y="292" fill="#94a3b8">16 commit</text>
    <text x="543" y="310" fill="#64748b">SWR302, lớp,</text>
    <text x="543" y="326" fill="#64748b">tích hợp</text>

    <text x="626" y="274" font-family="ui-monospace, Menlo, monospace" fill="#e2e8f0">11–13/10</text>
    <text x="626" y="292" fill="#94a3b8">23 commit</text>
    <text x="626" y="310" fill="#64748b">sửa lỗi +</text>
    <text x="626" y="326" fill="#64748b">app riêng</text>
  </g>

  <line x1="24" y1="344" x2="676" y2="344" stroke="#1e293b"/>
  <rect x="24" y="358" width="12" height="12" rx="2" fill="#4ade80"/>
  <text x="42" y="369" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">dùng thật &amp; sửa — rất ít dòng mới</text>
  <rect x="330" y="358" width="12" height="12" rx="2" fill="#fb923c"/>
  <text x="348" y="369" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">thêm tính năng (cam, tím, lơ)</text>
  <text x="24" y="394" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Đo trên app/work, components/work, services/work, routes/work*, mcp — gồm cả mã test.</text>
</svg>
