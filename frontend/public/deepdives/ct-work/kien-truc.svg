<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-label="Kiến trúc CT Work: bốn loại client gọi vào một backend Express duy nhất qua REST, MCP và Socket.IO; mọi lời gọi qua permissions.ts, rồi tới các service, rồi cửa ghi thẻ applyIssueChange, rồi PostgreSQL; tệp ở R2, AI qua cổng LLM.">
