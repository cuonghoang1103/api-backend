<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 366" width="700" height="366" role="img" aria-label="A query is executed as a tree of resolvers, one per field, level by level — which is where the N+1 problem comes from">
  <rect width="700" height="366" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="365" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">Every field is a function. The server walks the query breadth-first, level by level.</text>

  <!-- query -->
  <rect x="24" y="48" width="250" height="112" rx="6" fill="#0a1120" stroke="#334155"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">
    <text x="36" y="70">{ posts {</text>
    <text x="36" y="90">    title</text>
    <text x="36" y="110">    author {</text>
    <text x="36" y="130">      name</text>
    <text x="36" y="150">} } }</text>
  </g>

  <!-- levels -->
  <text x="310" y="62" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#fb923c">level 1 — once</text>
  <rect x="310" y="70" width="366" height="26" rx="5" fill="#111c30" stroke="#fb923c"/>
  <text x="322" y="87" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">Query.posts()  →  [ p0, p1, p2, p3, p4 ]</text>

  <text x="310" y="118" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#22d3ee">level 2 — once per post</text>
  <rect x="310" y="126" width="366" height="26" rx="5" fill="#111c30" stroke="#22d3ee"/>
  <text x="322" y="143" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">Post.title(p0) … Post.title(p4)   free, in memory</text>

  <rect x="310" y="158" width="366" height="26" rx="5" fill="#111c30" stroke="#f43f5e"/>
  <text x="322" y="175" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#f43f5e">Post.author(p0) … Post.author(p4)  5 DB queries</text>

  <text x="310" y="206" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#a78bfa">level 3 — once per author</text>
  <rect x="310" y="214" width="366" height="26" rx="5" fill="#111c30" stroke="#a78bfa"/>
  <text x="322" y="231" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">Author.name(a) … in memory again</text>

  <g stroke="#475569" stroke-width="1.2" fill="none">
    <path d="M274 104 H 302"/><path d="M302 104 l-7 -4 v8 z" fill="#475569" stroke="none"/>
  </g>

  <line x1="24" y1="258" x2="676" y2="258" stroke="#1e293b"/>

  <text x="24" y="282" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#e2e8f0">This is where <tspan fill="#f43f5e">N+1</tspan> is born, and it is not a bug in GraphQL</text>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#94a3b8">
    <text x="24" y="306">One query for the list, then one per row for the nested field — 1 + N. The resolver for</text>
    <text x="24" y="324"><tspan font-family="ui-monospace, Menlo, monospace" fill="#fcd34d">Post.author</tspan> has no idea it is being called five times; each call sees one post.</text>
    <text x="24" y="348">The fix is to batch a level before it runs — that is the whole idea of a DataLoader.</text>
  </g>
</svg>
