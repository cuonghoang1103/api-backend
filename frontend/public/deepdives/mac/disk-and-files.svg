<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 344" width="700" height="344" role="img" aria-label="Measured on one working Mac: about fifty one gigabytes of development tooling before any project code, dominated by the Docker virtual machine, and one project holding nearly a hundred and eighteen thousand files under node_modules which is why exclusion matters more than raising file limits">
  <rect width="700" height="344" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="343" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="28" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">One working machine, measured with du -sh. None of this is project code.</text>

  <rect x="24" y="42" width="440" height="26" rx="4" fill="#111c30" stroke="#f43f5e"/>
  <text x="38" y="60" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">Docker VM — 31.7 GB of images</text>
  <text x="662" y="60" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">35 GB</text>

  <rect x="24" y="72" width="132" height="26" rx="4" fill="#111c30" stroke="#fb923c"/>
  <text x="38" y="90" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fb923c">Homebrew</text>
  <text x="662" y="90" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fb923c">7.1 GB</text>

  <rect x="24" y="102" width="88" height="26" rx="4" fill="#0a1120" stroke="#a78bfa"/>
  <text x="38" y="120" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#a78bfa">Xcode.app</text>
  <text x="662" y="120" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#a78bfa">4.6 GB</text>

  <rect x="24" y="132" width="44" height="26" rx="4" fill="#0a1120" stroke="#22d3ee"/>
  <text x="80" y="150" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">DerivedData 2.0 · Playwright 1.6 · nvm 1.1 GB</text>
  <text x="662" y="150" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#64748b">4.7 GB</text>

  <rect x="24" y="166" width="652" height="30" rx="5" fill="#111c30" stroke="#1e293b"/>
  <text x="38" y="186" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">total before a line of your own code</text>
  <text x="662" y="186" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">≈ 51 GB</text>

  <text x="24" y="220" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">And the file count, which is what makes editors and search slow — one project:</text>

  <rect x="24" y="230" width="318" height="70" rx="6" fill="#0a1120" stroke="#f43f5e"/>
  <text x="38" y="250" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">node_modules</text>
  <text x="38" y="270" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">117,816 files · 2.1 GB</text>
  <text x="38" y="290" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">backend 36,655 + frontend 81,161</text>

  <rect x="358" y="230" width="318" height="70" rx="6" fill="#0a1120" stroke="#4ade80"/>
  <text x="372" y="250" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">searching the same tree</text>
  <text x="372" y="270" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">rg 0.08 s over 4,024 files</text>
  <text x="372" y="290" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">grep -r 120 s over 149,068</text>

  <rect x="24" y="308" width="652" height="26" rx="5" fill="#111c30" stroke="#fcd34d"/>
  <text x="38" y="326" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">ulimit -n is already 1,048,576 here. Exclude, do not raise.</text>
</svg>
