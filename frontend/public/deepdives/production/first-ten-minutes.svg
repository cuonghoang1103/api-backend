<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-label="An ordered checklist for the first ten minutes of an incident: curl from outside, then check whether it is everything or one thing, then container status and exit codes, then logs for the window, then disk, then the database, then application metrics, writing the time down before changing anything">
  <rect width="700" height="380" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="379" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="28" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">Ordered so each step eliminates the most possibilities. Do not skip to the one you enjoy.</text>

  <rect x="24" y="42" width="652" height="34" rx="5" fill="#111c30" stroke="#4ade80"/>
  <text x="38" y="63" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">1  curl -w from OUTSIDE — status + the five timings</text>
  <text x="662" y="63" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">4 seconds</text>

  <rect x="24" y="80" width="652" height="34" rx="5" fill="#0a1120" stroke="#22d3ee"/>
  <text x="38" y="101" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">2  one static file · one public route · one authed route</text>
  <text x="662" y="101" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">everything, or one thing?</text>

  <rect x="24" y="118" width="652" height="34" rx="5" fill="#0a1120" stroke="#22d3ee"/>
  <text x="38" y="139" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">3  docker ps — read UPTIME first, then ExitCode + OOMKilled</text>
  <text x="662" y="139" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">Up 40s = the story</text>

  <rect x="24" y="156" width="652" height="34" rx="5" fill="#0a1120" stroke="#a78bfa"/>
  <text x="38" y="177" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#a78bfa">4  docker logs --since 10m — COUNT errors before reading them</text>

  <rect x="24" y="194" width="652" height="34" rx="5" fill="#0a1120" stroke="#a78bfa"/>
  <text x="38" y="215" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#a78bfa">5  df -h · df -i · docker system df</text>
  <text x="662" y="215" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">cheap, explains a lot</text>

  <rect x="24" y="232" width="652" height="34" rx="5" fill="#0a1120" stroke="#fb923c"/>
  <text x="38" y="253" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fb923c">6  pg_stat_activity — wait_event_type + pg_blocking_pids</text>
  <text x="662" y="253" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">if it HANGS not errors</text>

  <rect x="24" y="270" width="652" height="34" rx="5" fill="#0a1120" stroke="#fcd34d"/>
  <text x="38" y="291" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">7  only NOW: app metrics — loop lag, queue depth, error rate</text>

  <rect x="24" y="308" width="652" height="56" rx="6" fill="#111c30" stroke="#f43f5e"/>
  <text x="38" y="328" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">8  write the TIME and what you saw — before you change anything</text>
  <text x="38" y="346" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">&quot;when did it start&quot; is usually the fastest route to &quot;what changed&quot;</text>
  <text x="38" y="360" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">record what you CHANGED too — half of confusing incidents are two people fixing at once</text>
</svg>
