<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="Two containers with the same health check both report healthy, but one never mounted a router and returns 404 where the other returns 401; the health check cannot tell them apart while an unauthenticated curl on each feature route can">
  <rect width="700" height="320" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="319" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="28" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">Same image, same health check. One of these has a dead feature. Docker reports both healthy.</text>

  <rect x="24" y="44" width="318" height="150" rx="6" fill="#111c30" stroke="#4ade80"/>
  <text x="38" y="64" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">the good build</text>
  <text x="38" y="88" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">docker STATUS</text>
  <text x="328" y="88" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">healthy</text>
  <text x="38" y="112" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">GET /health</text>
  <text x="328" y="112" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">200</text>
  <text x="38" y="136" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">GET /api/v1/profile</text>
  <text x="328" y="136" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">401</text>
  <text x="38" y="160" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">GET /api/v1/gifs</text>
  <text x="328" y="160" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">401</text>
  <text x="38" y="182" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">401 = the router is mounted</text>

  <rect x="358" y="44" width="318" height="150" rx="6" fill="#111c30" stroke="#f43f5e"/>
  <text x="372" y="64" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">the stale build</text>
  <text x="372" y="88" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">docker STATUS</text>
  <text x="662" y="88" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">healthy</text>
  <text x="372" y="112" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">GET /health</text>
  <text x="662" y="112" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">200</text>
  <text x="372" y="136" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">GET /api/v1/profile</text>
  <text x="662" y="136" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">401</text>
  <text x="372" y="160" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">GET /api/v1/gifs</text>
  <text x="662" y="160" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">404</text>
  <text x="372" y="182" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">404 = that route is not in the image</text>

  <rect x="24" y="206" width="652" height="46" rx="6" fill="#0a1120" stroke="#fcd34d"/>
  <text x="38" y="226" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">A health check proves ONE endpoint works. It is not evidence about any other.</text>
  <text x="38" y="244" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">this exact failure shipped to production and lasted until users reported it</text>

  <rect x="24" y="262" width="652" height="46" rx="6" fill="#111c30" stroke="#4ade80"/>
  <text x="38" y="282" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">the fix: one unauth GET per feature module, after every deploy, fail on 404</text>
  <text x="38" y="300" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">only list routes that return non-404 on a bare GET, or every deploy false-fails</text>
</svg>
