<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 336" width="700" height="336" role="img" aria-label="One curl call returns five cumulative timings; subtracting them isolates DNS, the TCP handshake, the TLS handshake, the server think time and the transfer, and only one of those five is your application code">
  <rect width="700" height="336" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="335" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="28" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">curl gives five CUMULATIVE numbers. Subtract to get the phases. One of them is your code.</text>

  <text x="24" y="54" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">real homepage request, 97 ms total</text>

  <rect x="24" y="64" width="20" height="26" rx="3" fill="#111c30" stroke="#64748b"/>
  <text x="52" y="82" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">DNS</text>
  <text x="662" y="82" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">3 ms</text>

  <rect x="24" y="94" width="40" height="26" rx="3" fill="#111c30" stroke="#22d3ee"/>
  <text x="72" y="112" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">TCP handshake</text>
  <text x="662" y="112" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">6 ms</text>

  <rect x="24" y="124" width="120" height="26" rx="3" fill="#111c30" stroke="#a78bfa"/>
  <text x="152" y="142" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#a78bfa">TLS handshake</text>
  <text x="662" y="142" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#a78bfa">18 ms</text>

  <rect x="24" y="154" width="146" height="26" rx="3" fill="#111c30" stroke="#4ade80"/>
  <text x="178" y="172" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">server thinking  ← YOUR CODE</text>
  <text x="662" y="172" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">22 ms</text>

  <rect x="24" y="184" width="316" height="26" rx="3" fill="#111c30" stroke="#fb923c"/>
  <text x="348" y="202" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fb923c">transfer, 89 KB</text>
  <text x="662" y="202" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fb923c">48 ms</text>

  <rect x="24" y="222" width="652" height="46" rx="6" fill="#0a1120" stroke="#f43f5e"/>
  <text x="38" y="242" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">A 404 on the same site: ttfb 154 ms · total 320 ms · 61 KB of rendered page</text>
  <text x="38" y="260" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">a crawler on dead links costs more than real traffic — and looks like an incident</text>

  <rect x="24" y="278" width="652" height="46" rx="6" fill="#111c30" stroke="#fcd34d"/>
  <text x="38" y="298" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">30 samples: p50 45.9 ms · p90 186.8 · p99 231.6</text>
  <text x="38" y="316" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">the mean said 66.9 ms — a number no single user experienced</text>
</svg>
