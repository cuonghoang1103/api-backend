<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-label="One createAsyncThunk dispatch emits pending then either fulfilled or rejected; the dispatch promise resolves with the action rather than rejecting, and unwrap throws a plain serialised object rather than an Error">
  <rect width="700" height="340" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="339" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">One call, two actions. Measured with a middleware recording everything that reached the store.</text>

  <rect x="24" y="46" width="652" height="34" rx="6" fill="#111c30" stroke="#fcd34d"/>
  <text x="38" y="68" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">dispatch(fetchUser(id))</text>

  <rect x="24" y="90" width="652" height="30" rx="5" fill="#111c30" stroke="#22d3ee"/>
  <text x="38" y="110" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">users/fetch/pending      status = &#39;loading&#39;</text>

  <rect x="24" y="130" width="320" height="60" rx="5" fill="#111c30" stroke="#4ade80"/>
  <text x="38" y="151" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">users/fetch/fulfilled</text>
  <text x="38" y="171" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">status = &#39;ok&#39; · data = payload</text>

  <rect x="356" y="130" width="320" height="60" rx="5" fill="#111c30" stroke="#f43f5e"/>
  <text x="370" y="151" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">users/fetch/rejected</text>
  <text x="370" y="171" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">status = &#39;failed&#39; · error = message</text>

  <rect x="24" y="200" width="652" height="34" rx="5" fill="#0a1120" stroke="#fb923c"/>
  <text x="38" y="222" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fb923c">data STILL holds the old user unless your rejected case clears it</text>

  <rect x="24" y="244" width="320" height="76" rx="6" fill="#0a1120" stroke="#334155"/>
  <text x="38" y="266" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">the promise never rejects</text>
  <text x="38" y="286" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">await dispatch(...) resolves</text>
  <text x="38" y="306" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">with the rejected ACTION</text>

  <rect x="356" y="244" width="320" height="76" rx="6" fill="#0a1120" stroke="#334155"/>
  <text x="370" y="266" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">.unwrap() throws — but what?</text>
  <text x="370" y="286" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">a plain Object, not an Error</text>
  <text x="370" y="306" xml:space="preserve" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">e instanceof Error === false</text>
</svg>
