<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 388" width="700" height="388" role="img" aria-label="The life of a script: shebang, strict mode, traps installed, preflight checks, then the work; the EXIT trap runs on every exit path including set -e aborts and SIGTERM, but a SIGKILL bypasses it entirely and leaves temp files and locks behind">
  <rect width="700" height="388" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="387" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="28" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">Install the trap BEFORE creating anything it has to clean up. Order is the whole design.</text>

  <rect x="24" y="42" width="652" height="30" rx="5" fill="#0a1120" stroke="#94a3b8"/>
  <text x="38" y="62" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">#!/usr/bin/env bash</text>

  <rect x="24" y="78" width="652" height="30" rx="5" fill="#0a1120" stroke="#22d3ee"/>
  <text x="38" y="98" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">set -Eeuo pipefail</text>
  <text x="662" y="98" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">-E so ERR reaches functions</text>

  <rect x="24" y="114" width="652" height="48" rx="5" fill="#111c30" stroke="#a78bfa"/>
  <text x="38" y="134" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#a78bfa">WORK=$(mktemp -d)</text>
  <text x="38" y="153" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#a78bfa">trap &#39;rc=$?; rm -rf &quot;$WORK&quot;; exit $rc&#39; EXIT</text>
  <text x="662" y="153" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">save $? FIRST</text>

  <rect x="24" y="168" width="652" height="30" rx="5" fill="#0a1120" stroke="#fcd34d"/>
  <text x="38" y="188" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">command -v docker &gt;/dev/null || exit 1   ·   : &quot;${DATABASE_URL:?must be set}&quot;</text>

  <rect x="24" y="204" width="652" height="34" rx="5" fill="#111c30" stroke="#4ade80"/>
  <text x="38" y="226" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">main &quot;$@&quot;      the actual work</text>

  <text x="24" y="264" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">Every one of these paths runs the EXIT trap — except the last one.</text>

  <rect x="24" y="274" width="318" height="98" rx="6" fill="#0a1120" stroke="#4ade80"/>
  <text x="38" y="294" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">cleanup RUNS</text>
  <text x="38" y="314" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">ran to the end</text>
  <text x="328" y="314" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">$?=0</text>
  <text x="38" y="332" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">exit 3</text>
  <text x="328" y="332" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">$?=3</text>
  <text x="38" y="350" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">killed by set -e / set -u</text>
  <text x="328" y="350" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">1 · 127</text>
  <text x="38" y="366" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">SIGTERM (docker stop)</text>
  <text x="328" y="366" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">143</text>

  <rect x="358" y="274" width="318" height="98" rx="6" fill="#0a1120" stroke="#f43f5e"/>
  <text x="372" y="294" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">cleanup DOES NOT RUN</text>
  <text x="372" y="314" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#e2e8f0">kill -9  ·  the OOM killer</text>
  <text x="662" y="314" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">137</text>
  <text x="372" y="336" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">measured: temp marker left behind 1 of 1</text>
  <text x="372" y="354" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">put a PID inside the lock: the next run</text>
  <text x="372" y="368" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">must be able to tell stale from live</text>
</svg>
