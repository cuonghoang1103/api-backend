<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 384" width="700" height="384" role="img" aria-label="One state change: the write queues a job, the queue is flushed on the next microtask, pre watchers run before the render, the render patches the DOM, post watchers run after; a hundred writes in the same tick collapse into one render">
  <rect width="700" height="384" rx="12" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="699" height="383" rx="12" fill="none" stroke="#1e293b"/>

  <text x="24" y="28" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">From a write to a repainted node. Everything between the two dashed lines happens in ONE microtask.</text>

  <rect x="24" y="44" width="652" height="34" rx="6" fill="#111c30" stroke="#fcd34d"/>
  <text x="38" y="66" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#fcd34d">n.value++   (×100 in the same click handler — measured: still ONE render)</text>

  <line x1="24" y1="90" x2="676" y2="90" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="676" y="104" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">queueJob — deduped by job id</text>

  <rect x="44" y="112" width="612" height="30" rx="5" fill="#0a1120" stroke="#22d3ee"/>
  <text x="58" y="132" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">watch(…, { flush: &#39;sync&#39; })</text>
  <text x="642" y="132" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">ran immediately, before the queue · DOM = old</text>

  <rect x="44" y="148" width="612" height="30" rx="5" fill="#0a1120" stroke="#22d3ee"/>
  <text x="58" y="168" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#22d3ee">watch(…, { flush: &#39;pre&#39; })   ← the default</text>
  <text x="642" y="168" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">DOM = old</text>

  <rect x="44" y="184" width="612" height="30" rx="5" fill="#0a1120" stroke="#94a3b8"/>
  <text x="58" y="204" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#94a3b8">onBeforeUpdate()</text>

  <rect x="44" y="220" width="612" height="48" rx="5" fill="#111c30" stroke="#4ade80"/>
  <text x="58" y="240" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#4ade80">render() → patch(oldVNode, newVNode)</text>
  <text x="58" y="259" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">flag says TEXT ⇒ one el.textContent write · the other six elements are not visited</text>

  <rect x="44" y="274" width="612" height="30" rx="5" fill="#0a1120" stroke="#a78bfa"/>
  <text x="58" y="294" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#a78bfa">watch(…, { flush: &#39;post&#39; })  ·  onUpdated()</text>
  <text x="642" y="294" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#4ade80">DOM = new — measure layout here</text>

  <line x1="24" y1="316" x2="676" y2="316" stroke="#334155" stroke-dasharray="4 4"/>

  <rect x="24" y="330" width="652" height="40" rx="6" fill="#0a1120" stroke="#f43f5e"/>
  <text x="38" y="348" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#f43f5e">Read the DOM right after the write and you read the OLD value.</text>
  <text x="38" y="364" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">await nextTick() puts you past the line · it is a promise microtask, not a timer</text>
</svg>
