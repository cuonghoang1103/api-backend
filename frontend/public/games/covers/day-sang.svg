<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1250"/>
      <stop offset="0.55" stop-color="#120b33"/>
      <stop offset="1" stop-color="#0a0820"/>
    </linearGradient>
    <radialGradient id="quang" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="sang" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="m"/>
      <feMerge><feMergeNode in="m"/><feMergeNode in="m"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#nen)"/>
  <rect width="1200" height="675" fill="url(#quang)"/>
  <!-- sao -->
  <g fill="#fff" opacity="0.6">
    <circle cx="90" cy="80" r="2"/><circle cx="210" cy="520" r="1.5"/><circle cx="1080" cy="120" r="2"/>
    <circle cx="1010" cy="560" r="1.5"/><circle cx="160" cy="300" r="1.2"/><circle cx="1130" cy="380" r="1.2"/>
  </g>
  <!-- lưới 4x4 nghiêng nhẹ -->
  <g transform="translate(600 345) rotate(-8) translate(-250 -250)">
    <rect x="-24" y="-24" width="548" height="548" rx="48" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <g fill="url(#o)" stroke="#c4b5fd" stroke-opacity="0.18">
      <rect x="0" y="0" width="110" height="110" rx="22"/><rect x="130" y="0" width="110" height="110" rx="22"/>
      <rect x="260" y="0" width="110" height="110" rx="22"/><rect x="390" y="0" width="110" height="110" rx="22"/>
      <rect x="0" y="130" width="110" height="110" rx="22"/><rect x="130" y="130" width="110" height="110" rx="22"/>
      <rect x="260" y="130" width="110" height="110" rx="22"/><rect x="390" y="130" width="110" height="110" rx="22"/>
      <rect x="0" y="260" width="110" height="110" rx="22"/><rect x="130" y="260" width="110" height="110" rx="22"/>
      <rect x="260" y="260" width="110" height="110" rx="22"/><rect x="390" y="260" width="110" height="110" rx="22"/>
      <rect x="0" y="390" width="110" height="110" rx="22"/><rect x="130" y="390" width="110" height="110" rx="22"/>
      <rect x="260" y="390" width="110" height="110" rx="22"/><rect x="390" y="390" width="110" height="110" rx="22"/>
    </g>
    <!-- vệt nối dãy -->
    <polyline points="55,185 315,55 445,315 185,445" fill="none" stroke="#f0abfc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 18" opacity="0.7"/>
    <!-- 4 ô đang sáng -->
    <g filter="url(#sang)">
      <rect x="0" y="130" width="110" height="110" rx="22" fill="#22d3ee"/>
      <rect x="260" y="0" width="110" height="110" rx="22" fill="#a78bfa"/>
      <rect x="390" y="260" width="110" height="110" rx="22" fill="#f472b6"/>
      <rect x="130" y="390" width="110" height="110" rx="22" fill="#facc15"/>
    </g>
    <g fill="#0b0820" font-family="ui-rounded, system-ui, sans-serif" font-weight="800" font-size="46" text-anchor="middle">
      <text x="55" y="202">1</text><text x="315" y="72">2</text><text x="445" y="332">3</text><text x="185" y="462">4</text>
    </g>
  </g>
</svg>
