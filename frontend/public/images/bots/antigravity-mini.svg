<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Antigravity Mini — bot bản tin Antigravity">
  <title>Antigravity Mini</title>
  <defs>
    <radialGradient id="agBg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="agFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef1ff"/>
      <stop offset="100%" stop-color="#cdd3ff"/>
    </linearGradient>
    <style>
      #ag-float{animation:ag-lift 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      #ag-eyes{animation:ag-blink 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      #ag-orbit{animation:ag-spin 7s linear infinite;transform-box:fill-box;transform-origin:80px 85px}
      .ag-star{animation:ag-tw 2.6s ease-in-out infinite}
      @keyframes ag-lift{0%,100%{transform:translateY(2px) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
      @keyframes ag-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
      @keyframes ag-spin{to{transform:rotate(360deg)}}
      @keyframes ag-tw{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){#ag-float,#ag-eyes,#ag-orbit,.ag-star{animation:none}}
    </style>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#agBg)"/>
  <circle class="ag-star" cx="36" cy="44" r="2.4" fill="#fff"/>
  <circle class="ag-star" cx="128" cy="52" r="2" fill="#c7d2fe"/>
  <circle class="ag-star" cx="120" cy="116" r="2.4" fill="#fff"/>
  <circle class="ag-star" cx="40" cy="120" r="2" fill="#a5b4fc"/>
  <g id="ag-orbit">
    <ellipse cx="80" cy="85" rx="60" ry="23" fill="none" stroke="#818cf8" stroke-width="2.5" opacity=".55" transform="rotate(-20 80 85)"/>
    <circle cx="20" cy="70" r="4" fill="#c4b5fd" transform="rotate(-20 80 85)"/>
  </g>
  <g id="ag-float">
    <rect x="36" y="48" width="88" height="74" rx="26" fill="url(#agFace)" stroke="#4338ca" stroke-width="4"/>
    <rect x="25" y="70" width="12" height="28" rx="6" fill="#a5b4fc"/>
    <rect x="123" y="70" width="12" height="28" rx="6" fill="#a5b4fc"/>
    <ellipse cx="58" cy="100" rx="7.5" ry="4.5" fill="#c7cdff" opacity=".7"/>
    <ellipse cx="102" cy="100" rx="7.5" ry="4.5" fill="#c7cdff" opacity=".7"/>
    <g id="ag-eyes" fill="#4338ca">
      <circle cx="63" cy="80" r="9"/>
      <circle cx="97" cy="80" r="9"/>
      <circle cx="66" cy="77" r="3" fill="#eef1ff"/>
      <circle cx="100" cy="77" r="3" fill="#eef1ff"/>
    </g>
    <path d="M67 106 Q80 114 93 106" fill="none" stroke="#4338ca" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
