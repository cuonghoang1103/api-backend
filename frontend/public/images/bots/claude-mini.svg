<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Claude Mini — bot bản tin Claude">
  <title>Claude Mini</title>
  <defs>
    <linearGradient id="clBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef9a73"/>
      <stop offset="100%" stop-color="#c9603a"/>
    </linearGradient>
    <linearGradient id="clFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7f2"/>
      <stop offset="100%" stop-color="#ffe3d2"/>
    </linearGradient>
    <style>
      #cl-float{animation:cl-bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      #cl-eyes{animation:cl-blink 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      #cl-tip{animation:cl-glow 2s ease-in-out infinite}
      @keyframes cl-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes cl-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
      @keyframes cl-glow{0%,100%{opacity:.6}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){#cl-float,#cl-eyes,#cl-tip{animation:none}}
    </style>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#clBg)"/>
  <g id="cl-float">
    <line x1="80" y1="30" x2="80" y2="46" stroke="#ffd9a0" stroke-width="5" stroke-linecap="round"/>
    <circle id="cl-tip" cx="80" cy="27" r="7" fill="#fff2d6"/>
    <rect x="34" y="46" width="92" height="78" rx="28" fill="url(#clFace)" stroke="#a9512f" stroke-width="4"/>
    <rect x="23" y="70" width="12" height="30" rx="6" fill="#ffd0b0"/>
    <rect x="125" y="70" width="12" height="30" rx="6" fill="#ffd0b0"/>
    <ellipse cx="57" cy="100" rx="8" ry="5" fill="#ffb59a" opacity=".65"/>
    <ellipse cx="103" cy="100" rx="8" ry="5" fill="#ffb59a" opacity=".65"/>
    <g id="cl-eyes" fill="#c9603a">
      <!-- spark / asterisk eyes, a nod to the Claude mark -->
      <path d="M63 72 l0 20 M55 76 l16 12 M55 88 l16 -12" stroke="#c9603a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M97 72 l0 20 M89 76 l16 12 M89 88 l16 -12" stroke="#c9603a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>
    <path d="M66 108 Q80 118 94 108" fill="none" stroke="#a9512f" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
