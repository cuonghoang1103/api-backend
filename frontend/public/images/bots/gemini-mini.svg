<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Gemini Mini — bot bản tin Gemini">
  <title>Gemini Mini</title>
  <defs>
    <linearGradient id="gmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="55%" stop-color="#7c6cf0"/>
      <stop offset="100%" stop-color="#9b72cb"/>
    </linearGradient>
    <linearGradient id="gmFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7ff"/>
      <stop offset="100%" stop-color="#e3e8ff"/>
    </linearGradient>
    <style>
      #gm-float{animation:gm-bob 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      #gm-eyes{animation:gm-blink 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      #gm-spark{animation:gm-twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes gm-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes gm-blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
      @keyframes gm-twinkle{0%,100%{transform:scale(.8);opacity:.7}50%{transform:scale(1.15);opacity:1}}
      @media (prefers-reduced-motion:reduce){#gm-float,#gm-eyes,#gm-spark{animation:none}}
    </style>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#gmBg)"/>
  <g id="gm-float">
    <line x1="80" y1="30" x2="80" y2="46" stroke="#cfe0ff" stroke-width="5" stroke-linecap="round"/>
    <!-- Gemini four-point spark as the antenna tip -->
    <path id="gm-spark" d="M80 18 C81.6 24 83 25.4 89 27 C83 28.6 81.6 30 80 36 C78.4 30 77 28.6 71 27 C77 25.4 78.4 24 80 18 Z" fill="#eaf0ff"/>
    <rect x="34" y="46" width="92" height="78" rx="26" fill="url(#gmFace)" stroke="#5b5bd6" stroke-width="4"/>
    <rect x="23" y="70" width="12" height="30" rx="6" fill="#9db4ff"/>
    <rect x="125" y="70" width="12" height="30" rx="6" fill="#9db4ff"/>
    <ellipse cx="57" cy="101" rx="8" ry="5" fill="#c3cdff" opacity=".7"/>
    <ellipse cx="103" cy="101" rx="8" ry="5" fill="#c3cdff" opacity=".7"/>
    <g id="gm-eyes" fill="#4f5fd6">
      <!-- sparkle eyes (four-point stars) -->
      <path d="M63 72 C64.2 78 65 78.8 71 80 C65 81.2 64.2 82 63 88 C61.8 82 61 81.2 55 80 C61 78.8 61.8 78 63 72 Z"/>
      <path d="M97 72 C98.2 78 99 78.8 105 80 C99 81.2 98.2 82 97 88 C95.8 82 95 81.2 89 80 C95 78.8 95.8 78 97 72 Z"/>
    </g>
    <path d="M66 108 Q80 118 94 108" fill="none" stroke="#5b5bd6" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
