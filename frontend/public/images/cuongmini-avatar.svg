<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="CuongMini — bot bản tin công nghệ">
  <title>CuongMini</title>
  <defs>
    <linearGradient id="cmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d78e6"/>
      <stop offset="100%" stop-color="#4f5bd5"/>
    </linearGradient>
    <linearGradient id="cmFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef0ff"/>
    </linearGradient>
    <style>
      #cm-float{animation:cm-bob 3.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      #cm-eyes{animation:cm-blink 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      #cm-hand{animation:cm-wave 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:118px 118px}
      #cm-tip{animation:cm-glow 1.9s ease-in-out infinite}
      @keyframes cm-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes cm-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
      @keyframes cm-wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(18deg)}}
      @keyframes cm-glow{0%,100%{opacity:.6}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){#cm-float,#cm-eyes,#cm-hand,#cm-tip{animation:none}}
    </style>
  </defs>
  <circle cx="80" cy="80" r="80" fill="url(#cmBg)"/>
  <g id="cm-float">
    <line x1="80" y1="30" x2="80" y2="46" stroke="#ffd166" stroke-width="5" stroke-linecap="round"/>
    <circle id="cm-tip" cx="80" cy="27" r="7" fill="#ffd166"/>
    <rect x="34" y="46" width="92" height="78" rx="26" fill="url(#cmFace)" stroke="#3b46b8" stroke-width="4"/>
    <rect x="23" y="70" width="12" height="30" rx="6" fill="#ffd166"/>
    <rect x="125" y="70" width="12" height="30" rx="6" fill="#ffd166"/>
    <ellipse cx="57" cy="101" rx="8" ry="5" fill="#b9c0ff" opacity=".7"/>
    <ellipse cx="103" cy="101" rx="8" ry="5" fill="#b9c0ff" opacity=".7"/>
    <g id="cm-eyes" fill="#4f5bd5">
      <circle cx="63" cy="80" r="10"/>
      <circle cx="97" cy="80" r="10"/>
      <circle cx="66" cy="77" r="3.2" fill="#ffffff"/>
      <circle cx="100" cy="77" r="3.2" fill="#ffffff"/>
    </g>
    <path d="M66 108 Q80 118 94 108" fill="none" stroke="#3b46b8" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <!-- waving hand -->
  <g id="cm-hand">
    <circle cx="120" cy="118" r="11" fill="#ffd166" stroke="#3b46b8" stroke-width="3"/>
  </g>
</svg>
