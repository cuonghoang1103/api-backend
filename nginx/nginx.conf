# ============================================================
# Nginx Configuration - All-in-One VPS
#
# Responsibilities:
# 1. SSL termination (HTTPS)
# 2. Static file serving for /uploads/* (bypasses Node.js)
# 3. Reverse proxy to Next.js frontend and Node.js backend
# 4. Gzip compression
# 5. Cache headers for static assets
# 6. Rate limiting
# ============================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ─────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log main buffer=16k flush=2s;

    # ─── Performance ──────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # ─── Gzip Compression ────────────────────────────────
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        font/ttf
        font/eot
        font/otf
        image/svg+xml
        image/x-icon
        # Bổ sung 2026-08-04: manifest PWA và wasm trước đây gửi thô.
        # `application/wasm` đáng giá nhất — sân chơi 3D /playground nạp
        # wasm, nén gzip cắt được phần lớn dung lượng. Nén wasm không
        # cản streaming compilation của trình duyệt.
        application/manifest+json
        application/wasm
        text/xml;

    # ─── Buffer Sizes ────────────────────────────────────
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 500m;  # Allow large uploads (nginx handles them, backend processes)
    output_buffers 1 32k;
    postpone_output 1460;

    # ─── Timeouts ────────────────────────────────────────
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ─── Rate Limiting Zones ─────────────────────────────
    # `limit_req_status 429` là BẮT BUỘC: mặc định nginx trả 503 khi
    # chặn, và 503 lại rơi vào `error_page 500 502 503 504 /50x.html`
    # ở dưới → khách nhận trang HTML "An error occurred" của nginx
    # thay vì JSON. Hệ quả thật (đo được 2026-08-04): gõ sai mật khẩu
    # 4 lần là frontend cố `res.json()` trên một trang HTML và vỡ,
    # còn công cụ theo dõi uptime tưởng backend chết. 429 mới là mã
    # đúng cho "quá nhiều request", và nó không dính error_page 5xx.
    limit_req_status 429;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # auth: 5r/m quá gắt — người dùng thật gõ sai mật khẩu 4-5 lần là
    # chuyện bình thường và sẽ bị nginx chặn trước khi backend kịp trả
    # thông báo tiếng Việt. Nới lên 20r/m; hàng rào chính chống dò mật
    # khẩu vẫn là authLimiter của Express (10 lần/phút/IP, khoá theo IP
    # không giả mạo được) — tầng nginx này chỉ để chặn lũ request thô.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

    # ─── Upstream Backends ───────────────────────────────
    upstream frontend {
        server cuonghoangdev_frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server cuonghoangdev_backend:3001;
        keepalive 32;
    }

    # ─── Server Blocks ───────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name cuongthai.com www.cuongthai.com api.cuongthai.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS Server ─────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        # ─── HTTP/2 ──────────────────────────────────────────
        # Trang chủ nạp ~100 request. HTTP/1.1 chỉ cho 6 kết nối song song
        # một origin, nên phần còn lại XẾP HÀNG — khoảng 17 lượt chờ chỉ để
        # có chỗ gửi. HTTP/2 dồn tất cả vào MỘT kết nối đã bắt tay sẵn, ghép
        # kênh song song, và nén header (HPACK) — riêng phần header lặp lại
        # (cookie, user-agent) đã là vài KB mỗi request.
        #
        # Directive `http2 on;` là cú pháp của nginx >= 1.25.1. Image ở
        # docker-compose.yml là `nginx:1.27-alpine` nên nó ĐÚNG. KHÔNG quay
        # lại `listen 443 ssl http2;` — từ 1.25.1 dạng đó đã bị khai tử và
        # nginx sẽ log cảnh báo mỗi lần nạp config.
        #
        # Không cần đổi gì ở tầng ứng dụng: proxy_pass tới upstream vẫn nói
        # HTTP/1.1 (đúng, và bắt buộc cho WebSocket/SSE ở dưới) — HTTP/2 chỉ
        # nằm giữa TRÌNH DUYỆT và nginx, đúng chỗ hàng đợi đang xảy ra.
        http2 on;
        server_name cuongthai.com www.cuongthai.com api.cuongthai.com;

        # SSL Certificate (Let's Encrypt) - mounted from archive
        ssl_certificate /etc/letsencrypt/archive/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/archive/privkey.pem;

        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ─── Next.js static assets (_next/static/*) ───────
        # Long-lived, content-hashed files. Next.js fingerprints
        # every chunk by its hash (e.g. `page-570d81b649023205.js`)
        # so a new build always ships new filenames — the browser
        # is safe to cache these for a year without revalidation.
        #
        # This block is matched BEFORE the catch-all `location /`
        # below (nginx tries the most specific match first), so
        # static chunks keep their immutable cache headers even
        # though the rest of the site is served as no-cache.
        location ^~ /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            # Long-lived immutable cache — see comment above.
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            expires 365d;

            # BẮT BUỘC lặp lại 4 header bảo mật của server block.
            # nginx KHÔNG cộng dồn add_header: hễ một location có
            # add_header của riêng nó thì TOÀN BỘ add_header kế thừa
            # từ cấp trên bị vứt. Vì location này khai báo
            # Cache-Control ở trên, nó đã âm thầm mất HSTS +
            # X-Frame-Options + nosniff (đo ngày 2026-08-04: chỉ
            # /api/ còn HSTS vì đó là location duy nhất không có
            # add_header riêng). Xoá 4 dòng dưới = mất lại lần nữa.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # ─── Tài sản tĩnh trong `frontend/public/` ────────────
        # VẤN ĐỀ: `location /` ở dưới GỠ Cache-Control của upstream rồi dán
        # `no-store` lên MỌI thứ. Đúng cho HTML (nó chống ChunkLoadError sau
        # mỗi lần deploy — xem chú thích ở đó), nhưng nó cũng rơi trúng toàn
        # bộ `public/`: 12 logo SVG, 7 mascot, robot.json của Lottie, âm
        # thanh, ảnh minh hoạ… tải LẠI ở mỗi lần điều hướng, mãi mãi.
        #
        # Những file này KHÔNG có mã băm trong tên (khác `_next/static/`), nên
        # không cache vĩnh viễn được: thay ảnh mà tên giữ nguyên thì khách kẹt
        # bản cũ. 7 ngày là mức cân bằng — gần như mọi phiên duyệt đều trúng
        # cache, mà thay tài sản thì trong vòng một tuần ai cũng thấy.
        #
        # Danh sách thư mục là DANH SÁCH ĐÓNG, cố ý. Bắt theo đuôi file thôi
        # thì không đủ an toàn: `/games/<slug>` là TRANG Next.js chứ không phải
        # file trong `public/games/`, và một quy tắc rộng tay sẽ đóng băng
        # trang HTML đó 7 ngày. Thêm thư mục mới vào `public/` thì thêm tên
        # vào đây; quên thì chỉ mất cache, không hỏng gì.
        #
        # `^~` KHÔNG dùng ở đây vì đây là regex location — nginx xét regex
        # TRƯỚC prefix thường, nên nó đã thắng `location /`. Ngược lại
        # `/_next/static/` ở trên đã được nâng lên `^~` để regex này không
        # cướp mất của nó.
        location ~* ^/(animations|deepdives|exam-assets|images|logos|mascots|sounds)/.+\.(json|png|jpe?g|gif|svg|webp|avif|ico|mp3|wav|ogg|m4a|woff2?|ttf|otf)$ {
            # Rộng tay hơn `location /` (burst 50): một trang có thể xin vài
            # chục ảnh/icon cùng lúc, và bị 429 ở đây chỉ làm vỡ giao diện chứ
            # không chặn được ai. Vẫn có trần để một con bot không kéo cả kho.
            limit_req zone=general burst=100 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
            add_header Vary "Accept-Encoding" always;

            # Lặp lại header bảo mật — xem giải thích ở /_next/static/.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # Bộ icon ở gốc `public/` (favicon, apple-touch, android-chrome…).
        # Tên cố định, gần như không bao giờ đổi, và trình duyệt xin chúng ở
        # MỌI trang — nên cho hẳn 30 ngày.
        location ~* ^/(favicon\.(ico|png|svg)|favicon-\d+x\d+\.png|apple-touch-icon\.png|android-chrome-\d+x\d+\.png|robot-avatar\.png|games-icon\.png|shop-icon\.png)$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "public, max-age=2592000" always;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # ─── Sân chơi 3D: TRẢ LẠI quyền quyết định cho Next.js ────
        # `next.config.js` đã khai `public, max-age=604800` cho
        # `/playground/**` (trừ index.html) — 94MB tài nguyên, cố ý cache một
        # tuần để lượt quay lại gần như tức thì. Nhưng `location /` GỠ header
        # đó rồi dán `no-store`, nên trên thực tế **quy tắc ấy chưa từng có
        # hiệu lực**: mỗi lần vào sân chơi là tải lại từ đầu.
        #
        # Ở đây KHÔNG `proxy_hide_header Cache-Control` — để nguyên thứ Next
        # gửi. `^~` để mấy regex ở trên (bắt .png/.json/.woff2 trong
        # `/playground/`) không cướp mất và dán nhầm 7 ngày lên index.html.
        # ─── Chống vòng lặp chuyển hướng /playground ↔ /playground/ ──────
        # nginx (absolute_redirect mặc định) tự 301 `/playground` → `/playground/`
        # vì có prefix-location `^~ /playground/`; Next.js (trailingSlash:false)
        # lại 308 `/playground/` → `/playground`. Hai bên đá nhau → ERR_TOO_MANY
        # _REDIRECTS. Hai exact-match dưới phục vụ THẲNG index.html (200) cho cả
        # hai dạng, cắt vòng lặp. Asset con (/playground/*.png…) vẫn do khối
        # `^~ /playground/` bên dưới lo.
        location = /playground {
            rewrite ^ /playground/index.html break;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
        location = /playground/ {
            rewrite ^ /playground/index.html break;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        location ^~ /playground/ {
            # 94MB chia thành rất nhiều file, tải dồn một lượt. Trước đây khối này
            # rơi vào `location /` với burst=50 — tức chính lần tải đầu tiên có
            # thể tự đâm vào giới hạn và nhận 429. Nới hẳn cho nhánh tĩnh này.
            limit_req zone=general burst=200 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            # Lặp lại đủ 4 header bảo mật — xem giải thích ở /_next/static/.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;

            # index.html PHẢI luôn lấy bản mới: nó trỏ vào các file assets/ có
            # mã băm trong tên, cache nó là kẹt bản cũ trỏ vào file đã biến
            # mất → màn hình tải quay mãi, không lỗi nào hiện ra.
            location = /playground/index.html {
                proxy_pass http://frontend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
                proxy_hide_header Cache-Control;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "1; mode=block" always;
            }
        }

        # ─── Service worker: KHÔNG BAO GIỜ cache ─────────────────
        # Trình duyệt lấy /sw.js để biết có bản mới hay không. Cache nó là
        # đóng băng luôn cơ chế cập nhật của PWA. Khớp với quy tắc đã có sẵn
        # trong next.config.js; khai lại ở đây để mấy regex ở trên không đụng
        # tới, và để `Service-Worker-Allowed` đi qua nguyên vẹn.
        location = /sw.js {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # manifest PWA: đổi hiếm, nhưng đổi thì muốn thấy trong ngày.
        location = /manifest.json {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # ─── ROOT: Next.js Frontend ──────────────────────
        location = /games/love-me {
            return 301 /games/love-me-game/love-me.html;
        }

        location /games/love-me-game/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;

            # Lặp lại header bảo mật — xem giải thích ở /_next/static/.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        location / {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;

            # Next.js specific headers
            proxy_set_header X-Forwarded-Host $host;

            # Drop the upstream Cache-Control so we can replace it
            # with our own (Next.js by default emits
            # `s-maxage=31536000, stale-while-revalidate` for SSR
            # pages, which lets browsers cache HTML for a year and
            # causes the "ChunkLoadError: Loading chunk N failed"
            # bug every time we `docker compose up --build` a new
            # image with renamed chunk hashes).
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;

            # Force revalidation for HTML/RSC responses so the
            # browser never serves a stale page that still
            # references the previous build's chunk hashes.
            #
            # `_next/static/*` files themselves are handled by the
            # more specific `location /_next/static/` block above
            # (long-lived + immutable), so they don't fall through
            # to this rule.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            # Lặp lại header bảo mật — xem giải thích ở /_next/static/.
            # Đây là location phục vụ MỌI trang HTML, nên trước khi có
            # 4 dòng này thì thực tế không một trang nào của web có
            # HSTS — khách gõ "cuongthai.com" vẫn đi một nhịp HTTP
            # trước khi bị 301, đủ chỗ cho tấn công SSL-strip.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # ─── API: Proxy to Node.js Backend ───────────────
        location /api/v1/ {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Explicitly forward the Cookie header so the backend can read
            # backend_token (httpOnly) for Socket.IO auth and protected API calls.
            # Without this, the cookie is silently dropped by nginx, causing
            # "Invalid Token" on external devices even when the user is logged in.
            proxy_set_header Cookie $http_cookie;
            # Keep-alive to upstream
            proxy_set_header Connection "";

            # SSE streaming: disable all buffering
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Timeouts (SSE needs long timeout)
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ─── Long-running AI authoring endpoints ────────────────────────────────
        # A regex location beats the /api/v1/ prefix above, so these win no matter
        # where they sit in the file.
        #
        # WHY: writing a full bilingual walkthrough of a 500-LOC assignment, or a
        # news bulletin from ten sources, takes MINUTES on the strongest model —
        # one measured Code Lab explanation took 343 seconds. The 300s ceiling on
        # /api/v1/ cut the connection at 300 and returned 504 while the backend
        # went on to finish and cache the answer. From the browser that looked
        # like "the AI failed" on exactly the long exercises where it had not.
        #
        # These are admin/Pro-gated POSTs, not public traffic, so holding a worker
        # for a quarter of an hour is a cost worth paying for the few of them.
        location ~ ^/api/v1/(code-lab/exercises/[0-9]+/(ai|coach)/|admin/tech-trends/(ai|news)/) {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_connect_timeout 10s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
        }

        # ─── Public music endpoints: let backend Cache-Control through ──────────
        # More specific than /api/v1/ above, so nginx does NOT add no-cache.
        # Backend sets Cache-Control: public, max-age=60, stale-while-revalidate=300
        # for /music/tracks, /music/playlists, and /music/playlists/:id.
        location ~ ^/api/v1/music/(tracks|playlists)$ {
            limit_req zone=api burst=200 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            # Allow backend Cache-Control headers through (do NOT add no-cache)
            proxy_buffering off;
            proxy_cache off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── Public academy/courses endpoints: let backend Cache-Control through ──
        # Same pattern as music: more specific than /api/v1/ so nginx doesn't
        # add no-cache. Backend sets Cache-Control for these endpoints.
        location ~ ^/api/v1/(academy/semesters|courses/semester/.+)$ {
            limit_req zone=api burst=200 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_buffering off;
            proxy_cache off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── SSE streaming endpoint: explicitly no buffering ─────
        location /api/v1/ai/chat {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Cookie $http_cookie;

            # Force no buffering for SSE
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_request_buffering off;

            # Disable nginx buffering to allow streaming
            proxy_set_header X-Accel-Buffering no;

            # Long timeouts for streaming
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ─── Socket.IO WebSocket endpoint (Direct Messaging) ─────
        # The `Connection: upgrade` header is what flips the protocol
        # from HTTP to WebSocket. Long timeouts so the socket stays
        # idle through the user's lunch break without being torn
        # down by an aggressive proxy.
        location /socket.io/ {
            limit_req zone=api burst=200 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            # 24h idle timeout — Socket.IO sends pings every 25s
            # so a healthy connection won't be cut off.
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # ─── Notes collaboration gateway (Hocuspocus/Yjs) ───────
        # Kept on the public same-origin host so the browser needs no extra
        # CSP exception and all production TLS terminates in one place.
        location /notes-collaboration {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_buffering off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # ─── Maker Lab device gateway (raw WebSocket) ────────────
        # Physical boards (ESP32 & friends) connect here, NOT through
        # /socket.io/ — microcontrollers speak plain RFC-6455 and we
        # stream raw audio frames both ways. See src/socket/device.gateway.ts.
        #
        # Separate location rather than folding into /socket.io/ because
        # the traffic shape is different: a robot holds one very long
        # connection and bursts audio, so it gets its own (small) rate
        # limit bucket and a longer send timeout.
        location /device-ws {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No buffering: audio must reach the speaker as it arrives,
            # not once nginx decides it has enough of it.
            proxy_buffering off;

            # 24h idle — the gateway pings every 30s, so a live board
            # never goes idle; this only protects against half-open
            # sockets after a router reboot.
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # ─── Auth endpoints: stricter rate limiting ───────
        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ─── STATIC FILES: /uploads/* served by Nginx directly
        #    This bypasses Node.js completely — maximum performance
        #    Files are read from the Docker volume mount at
        #    /var/www/cuongthai.com/uploads (mapped from uploads_data volume)
        location /uploads/ {
            # Point to the mounted Docker volume
            alias /var/www/cuongthai.com/uploads/;
            # Fix: ensure /uploads/images/file.jpg → /var/www/cuongthai.com/uploads/images/file.jpg
            # (nginx alias strips the location prefix /uploads/ and appends remainder to alias path)

            # Security: lesson documents are gated on enrollment.
            # The /api/v1/courses/documents/:id/download endpoint
            # checks the user's enrollment (active + not expired)
            # before issuing the 302 to fileUrl. Direct access to
            # the underlying file would bypass that gate, so we
            # return 403 here. The `^~` modifier is critical —
            # without it the regex locations below (e.g. `\.zip$`)
            # would win precedence over the prefix match and the
            # block would never fire.
            location ^~ /uploads/lesson-documents/ {
                return 403;
            }

            # Security: prevent directory listing
            autoindex off;

            # Sendfile + AIO for optimal disk I/O
            sendfile on;
            aio threads;
            directio 4k;

            # Aggressive caching for static assets
            location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|avif)$ {
                expires 1y;
                add_header Cache-Control "public, immutable, stale-while-revalidate=2592000";
                add_header X-Content-Type-Options "nosniff";
                add_header Vary "Accept-Encoding";
                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            }

            # Audio files (music)
            location ~* \.(mp3|wav|ogg|flac|aac|m4a)$ {
                expires 7d;
                add_header Cache-Control "public, stale-while-revalidate=86400";
                add_header X-Content-Type-Options "nosniff";
                # Allow range requests for streaming
                add_header Accept-Ranges bytes;
                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            }

            # Video files
            location ~* \.(mp4|webm|mov|avi|mkv)$ {
                expires 1d;
                add_header Cache-Control "public, stale-while-revalidate=86400";
                add_header X-Content-Type-Options "nosniff";
                add_header Accept-Ranges bytes;
                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            }

            # Documents
            location ~* \.(pdf|doc|docx|xls|xlsx|zip|txt|md)$ {
                expires 30d;
                add_header Cache-Control "public";
                add_header X-Content-Type-Options "nosniff";
                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            }

            # Fonts
            location ~* \.(woff|woff2|ttf|eot|otf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff";
                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            }

            # CSS / JS
            location ~* \.(css|js)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff";
                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            }

            # Default: no cache for unknown types
            expires -1;
        }

        # ─── Error Pages ────────────────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # 429 (limit_req chặn) phải trả JSON, không phải HTML: mọi
        # endpoint bị giới hạn đều nằm dưới /api/ và frontend luôn
        # `res.json()` kết quả. Trả HTML ở đây là nguyên nhân khiến
        # màn hình đăng nhập báo lỗi vô nghĩa thay vì "thử lại sau".
        # Khớp đúng shape lỗi của backend {success,message,code} nên
        # frontend không cần sửa gì.
        #
        # `recursive_error_pages` mặc định là off, nên `return 429`
        # bên trong đây KHÔNG kích hoạt lại error_page → không lặp.
        error_page 429 @ratelimit_json;
        location @ratelimit_json {
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"success":false,"message":"Quá nhiều yêu cầu. Vui lòng đợi một phút rồi thử lại.","code":"RATE_LIMITED"}';
        }
    }
}
