# ─── Cổng key con LLM — New API + canh, đứng trước key rambo ───────────────
#
# Chạy TÁCH HẲN khỏi stack chính (project `cong-llm`, không phải
# `cuonghoangdev`): deploy-nha.sh không biết tới nó, nó cũng không đụng tới
# backend/frontend/postgres. Hỏng cả cụm này thì chỉ key con chết —
# cuongthai.com vẫn gọi rambo thẳng như cũ.
#
# Triển khai: bash services/cong-llm/trien-khai.sh (từ máy local).
# Chỉ nhập mạng `cuonghoangdev_backend` để nginx của stack chính gọi được
# `cuonghoangdev_newapi` theo tên.
#
# Bí mật: /opt/cuonghoangdev/.env (key rambo, dùng chung với backend) +
# /opt/cong-llm/.env (bí mật riêng của cụm này, trien-khai.sh tự sinh lần đầu).

name: cong-llm

services:
  newapi:
    # Ghim phiên bản: New API ra bản rc gần như mỗi ngày, `latest` mà đổi API
    # quản trị là canh không nạp lại hạn mức được nữa.
    image: calciumion/new-api:v1.0.0-rc.37
    container_name: cuonghoangdev_newapi
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      SESSION_SECRET: ${CONG_LLM_SESSION_SECRET:?thiếu CONG_LLM_SESSION_SECRET trong /opt/cong-llm/.env}
      # Opus nghĩ lâu giữa hai mẩu chữ; mặc định 120s cắt ngang lượt dài.
      STREAMING_TIMEOUT: "300"
      # ⚠️ Mặc định của New API cho route "quan trọng" (POST /api/user/login,
      # POST /api/token/:id/key) là 20 lượt / 20 phút — và `canh` thử lại đăng
      # nhập MỖI 60 GIÂY khi hỏng, tức đúng 20 lượt / 20 phút. Nghĩa là một lỗi
      # thoáng qua là canh tự khoá mình vĩnh viễn: nó gõ cửa đủ nhanh để cửa
      # không bao giờ mở lại. Đo thật 14/09/2026 — canh kẹt 429 suốt ~20 phút,
      # `nạp lại hạn mức key con hỏng` lặp lại mỗi phút, và mọi thao tác tay
      # cũng bị chặn theo.
      # Nới lên 60/20 phút để có khoảng thở. Vẫn chặn dò mật khẩu, và giao
      # diện quản trị này CHỈ nghe trên 127.0.0.1 (xem `ports` bên dưới) nên
      # không ai ngoài Internet gõ được vào đây.
      CRITICAL_RATE_LIMIT: "60"
      CRITICAL_RATE_LIMIT_DURATION: "20"
      # ⚠️ Trần SỐ PHIÊN ĐĂNG NHẬP còn hiệu lực của một tài khoản. Mặc định 50.
      # Chạm trần thì MỌI lần đăng nhập sau trả `409 AUTH_SESSION_LIMIT` — và
      # đó là cái chết dây chuyền: `canh` không đăng nhập được ⇒ không nạp lại
      # hạn mức key con mỗi cửa sổ ⇒ key khách đã mua dùng hết một lần là chết,
      # ⇒ không gộp được ví AI Code, ⇒ admin không cấp key mới được.
      # Đã dính thật 14/09/2026: 50 phiên active, cũ nhất từ 12/09.
      #
      # Nới lên 200 là ĐỆM, không phải bản vá — bản vá thật nằm ở canh.mjs
      # (giữ lại phiên qua các lần khởi động + đăng xuất phiên cũ trước khi
      # tạo phiên mới). Không có đệm này thì lúc triển khai bản vá cũng không
      # đăng nhập nổi để mà chạy.
      USER_SESSION_ACTIVE_LIMIT: "200"
    volumes:
      # SQLite + log. Bind ra host để dựng lại container không mất key con.
      - /opt/cong-llm/data:/data
    ports:
      # Giao diện quản trị CHỈ nghe trên 127.0.0.1 của VPS — vào bằng SSH tunnel:
      #   ssh -L 3300:127.0.0.1:3300 root@<vps>  rồi mở http://localhost:3300
      # Ra Internet chỉ có /llm/v1/* qua nginx (không lộ /api quản trị).
      - "127.0.0.1:3300:3000"
    networks:
      - web
    deploy:
      resources:
        limits:
          # Đo thật lúc rảnh: 35MB. Chừa cho SQLite + nhiều luồng stream.
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  canh:
    image: node:22-alpine
    container_name: cuonghoangdev_canh_llm
    restart: unless-stopped
    command: ["node", "/app/canh.mjs"]
    environment:
      AGENT_GATEWAY_BASE_URL: ${AGENT_GATEWAY_BASE_URL:?thiếu AGENT_GATEWAY_BASE_URL trong /opt/cuonghoangdev/.env}
      AGENT_GATEWAY_API_KEY: ${AGENT_GATEWAY_API_KEY:?thiếu AGENT_GATEWAY_API_KEY trong /opt/cuonghoangdev/.env}
      CANH_KHOA_NOI_BO: ${CONG_LLM_KHOA_NOI_BO:?thiếu CONG_LLM_KHOA_NOI_BO}
      NEWAPI_URL: http://cuonghoangdev_newapi:3000
      NEWAPI_USER: ${CONG_LLM_ADMIN_USER:-quantri}
      NEWAPI_PASS: ${CONG_LLM_ADMIN_PASS:?thiếu CONG_LLM_ADMIN_PASS}
      CANH_URL: http://cuonghoangdev_canh_llm:8080
      KEY_CON: ${CONG_LLM_KEY_CON:-opencode-1,opencode-2,web-phu-1}
      # Key chính đã dùng ≥70% cửa sổ 5h ⇒ đóng key con; <60% (tức cửa sổ
      # mới) mới mở lại. 30% cuối mỗi cửa sổ là của riêng web.
      # ⚠️ PHẢI KHỚP mặc định trong `canh/canh.mjs`. Compose LUÔN truyền biến
      # này xuống, nên `env.NGUONG_NHUONG ?? 0.85` trong mã KHÔNG bao giờ được
      # dùng tới — đổi mặc định ở mã mà quên chỗ này thì không có gì đổi cả,
      # và log vẫn báo ngưỡng cũ. Đã dẫm phải 16/09/2026: triển khai xong, mã
      # mới đã lên, mà cổng vẫn đóng ở 70%. Có phép kiểm so hai chỗ.
      NGUONG_NHUONG: ${CONG_LLM_NGUONG_NHUONG:-0.85}
      NGUONG_MO_LAI: ${CONG_LLM_NGUONG_MO_LAI:-0.75}
      # ─── Gộp ví với AI Code của web (14/09/2026) ─────────────────────
      # Người mua gói key terminal dùng CHUNG hạn mức với AI Code trên app
      # desktop. canh hỏi backend web số đã tiêu ở app rồi cộng với phần đã
      # tiêu qua key; chạm trần thì khoá key tới khi cửa sổ reset.
      #
      # ⚠️ Để TRỐNG cả hai ⇒ canh bỏ hẳn bước gộp và chạy y như trước. Cố ý:
      # cấu hình dở dang không được phép khoá nhầm key của người đã trả tiền.
      # `WEB_INTERNAL_TOKEN` phải TRÙNG với `INTERNAL_API_TOKEN` của backend.
      WEB_API_URL: ${CONG_LLM_WEB_API_URL:-http://cuonghoangdev_backend:3001}
      WEB_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:-}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      # Mount cả THƯ MỤC, không mount từng file: file đơn bị gắn theo inode,
      # thay file bằng tar/mv là container vẫn đọc bản cũ (xem CLAUDE.md,
      # sự cố nginx 25/08/2026).
      - ./canh:/app:ro
      - /opt/cong-llm/state:/state
    networks:
      - web
    depends_on:
      - newapi
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/suc-khoe',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web:
    external: true
    name: cuonghoangdev_backend
